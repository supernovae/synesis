apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev indexer CronJobs: suspended (manual trigger only).
# Staging and prod use jobs-staging/ and jobs-prod/ overlays.
#
# Usage: ./scripts/deploy-indexer.sh dev
# Prereq: deploy.sh has been run (Milvus, embedder must be healthy)

resources:
  - ../../base/rag/indexer

patches:
  # Suspend all CronJobs in dev (run manually via deploy-indexer.sh --trigger)
  - target:
      kind: CronJob
      name: synesis-index-docs
    patch: |
      - op: replace
        path: /spec/suspend
        value: true

  - target:
      kind: CronJob
      name: synesis-index-code
    patch: |
      - op: replace
        path: /spec/suspend
        value: true

  - target:
      kind: CronJob
      name: synesis-index-apispec
    patch: |
      - op: replace
        path: /spec/suspend
        value: true

  - target:
      kind: CronJob
      name: synesis-index-license
    patch: |
      - op: replace
        path: /spec/suspend
        value: true

images:
  - name: synesis-indexer
    newName: ghcr.io/supernovae/synesis/indexer
    newTag: latest
