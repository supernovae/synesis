apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev indexer: suspended (manual trigger via deploy-indexer.sh --run).
# Usage: ./scripts/deploy-indexer.sh --run

resources:
  - ../../base/rag/indexer

patches:
  - target:
      kind: CronJob
      name: synesis-indexer-queue
    patch: |
      - op: replace
        path: /spec/suspend
        value: true

images:
  - name: synesis-indexer
    newName: ghcr.io/supernovae/synesis/indexer
    newTag: latest
