# OpenRouter overlay — routes all LLM traffic through OpenRouter.ai API.
#
# Excludes base/model-serving entirely (no GPU pods, no vLLM).
# Replaces the LiteLLM config with OpenRouter-backed model entries.
# Patches the planner to route through LiteLLM instead of direct vLLM.
#
# Deploy:
#   kustomize build overlays/openrouter | oc apply -f -
#
# Set your API key first:
#   oc create secret generic openrouter-api-key \
#     --from-literal=api-key=sk-or-v1-YOUR_KEY \
#     -n synesis-gateway --dry-run=client -o yaml | oc apply -f -

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No base/model-serving — all inference goes through OpenRouter
resources:
  - ../../base/gateway
  - ../../base/planner
  - ../../base/rag
  - ../../base/supervisor
  - ../../base/observability
  - ../../base/sandbox
  - ../../base/admin
  - ../../base/lsp
  - ../../base/search
  - ../../base/webui
  # NOTE: openrouter-secret.yaml is NOT listed here — deploy.sh creates the
  # secret interactively so oc apply -k never overwrites a live API key.

patches:
  # -----------------------------------------------------------------------
  # LiteLLM config: replace base ConfigMap with OpenRouter-backed model list
  # -----------------------------------------------------------------------
  - target:
      kind: ConfigMap
      name: litellm-config
    path: litellm-config-openrouter.yaml
  # -----------------------------------------------------------------------
  # Supervisor: redirect model health checks through LiteLLM
  # -----------------------------------------------------------------------
  - target:
      kind: ConfigMap
      name: synesis-supervisor-config
    path: supervisor-config-patch.yaml

  # -----------------------------------------------------------------------
  # LiteLLM secrets: clear master_key so the planner's api_key="not-needed"
  # passes through without triggering a virtual-key DB lookup.
  # -----------------------------------------------------------------------
  - target:
      kind: Secret
      name: litellm-secrets
    patch: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: litellm-secrets
      stringData:
        master-key: ""

  # -----------------------------------------------------------------------
  # LiteLLM: inject OPENROUTER_API_KEY env var from the Secret
  # -----------------------------------------------------------------------
  - target:
      kind: Deployment
      name: litellm-proxy
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: litellm-proxy
      spec:
        template:
          spec:
            containers:
              - name: litellm
                env:
                  - name: OPENROUTER_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: openrouter-api-key
                        key: api-key
                  - name: LITELLM_MASTER_KEY
                    $patch: delete

  # -----------------------------------------------------------------------
  # OpenWebUI: point directly at the planner so SSE status events
  # (phase updates, thinking indicators) pass through without being
  # stripped by LiteLLM's response normalizer.
  # -----------------------------------------------------------------------
  - target:
      kind: Deployment
      name: open-webui
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: open-webui
      spec:
        template:
          spec:
            containers:
              - name: open-webui
                env:
                  - name: OPENAI_API_BASE_URL
                    value: "http://synesis-planner.synesis-planner.svc.cluster.local:8000/v1"

  # -----------------------------------------------------------------------
  # Planner: point all model URLs through LiteLLM (which proxies to OpenRouter).
  # Model names stay the same (synesis-router, synesis-general, etc.) —
  # LiteLLM resolves them to the correct OpenRouter model paths.
  # -----------------------------------------------------------------------
  - target:
      kind: Deployment
      name: synesis-planner
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: synesis-planner
      spec:
        template:
          spec:
            containers:
              - name: planner
                env:
                  # All roles route through LiteLLM gateway
                  - name: SYNESIS_ROUTER_MODEL_URL
                    value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
                  - name: SYNESIS_PLANNER_MODEL_URL
                    value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
                  - name: SYNESIS_ADVISOR_MODEL_URL
                    value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
                  - name: SYNESIS_GENERAL_MODEL_URL
                    value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
                  - name: SYNESIS_CRITIC_MODEL_URL
                    value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
                  - name: SYNESIS_SUMMARIZER_MODEL_URL
                    value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
                  # Model names unchanged — LiteLLM resolves the routing
                  - name: SYNESIS_ROUTER_MODEL_NAME
                    value: "synesis-router"
                  - name: SYNESIS_PLANNER_MODEL_NAME
                    value: "synesis-router"
                  - name: SYNESIS_ADVISOR_MODEL_NAME
                    value: "synesis-router"
                  - name: SYNESIS_GENERAL_MODEL_NAME
                    value: "synesis-general"
                  - name: SYNESIS_CRITIC_MODEL_NAME
                    value: "synesis-critic"
                  # Cap critic output tokens (DeepSeek-R1-Distill-Llama-70B); avoids overthinking and cost
                  - name: SYNESIS_CRITIC_MAX_TOKENS
                    value: "2048"
                  - name: SYNESIS_SUMMARIZER_MODEL_NAME
                    value: "synesis-summarizer"
                  # OpenRouter models are hosted — disable guided JSON (not supported by most providers)
                  - name: SYNESIS_GUIDED_JSON_ENABLED
                    value: "false"
                  # Disable UDS paths (no co-located vLLM)
                  - name: SYNESIS_ROUTER_MODEL_UDS
                    value: ""
                  - name: SYNESIS_PLANNER_MODEL_UDS
                    value: ""
                  - name: SYNESIS_GENERAL_MODEL_UDS
                    value: ""
                  - name: SYNESIS_CRITIC_MODEL_UDS
                    value: ""
                  - name: SYNESIS_ADVISOR_MODEL_UDS
                    value: ""


images:
  - name: synesis-planner
    newName: ghcr.io/supernovae/synesis/planner
    newTag: latest
  - name: synesis-admin
    newName: ghcr.io/supernovae/synesis/admin
    newTag: latest
  - name: synesis-lsp-gateway
    newName: ghcr.io/supernovae/synesis/lsp-gateway
    newTag: latest
  - name: synesis-sandbox
    newName: ghcr.io/supernovae/synesis/sandbox
    newTag: latest
  - name: synesis-bge-reranker
    newName: ghcr.io/supernovae/synesis/bge-reranker
    newTag: latest
  - name: synesis-ingestor
    newName: ghcr.io/supernovae/synesis/ingestor
    newTag: latest

# NOTE: No synesis.io/environment label here. Kustomize global labels
# stamp every resource — switching overlays (dev → openrouter) changes the
# label on all 80+ resources, triggering operator reconciles (Milvus,
# ClickHouse, etc.) and cascading pod restarts. The label is informational
# only; not worth the blast radius.
