apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production indexer CronJobs: unsuspended, weekly schedule (base defaults).
# Usage: ./scripts/deploy-indexer.sh prod

resources:
  - ../../base/rag/indexer

images:
  - name: synesis-indexer
    newName: ghcr.io/supernovae/synesis/indexer
    newTag: latest

labels:
  - pairs:
      synesis.io/environment: prod
    includeSelectors: false
