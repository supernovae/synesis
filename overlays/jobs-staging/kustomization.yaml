apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging indexer: bi-weekly schedule.
# Usage: ./scripts/deploy-indexer.sh

resources:
  - ../../base/rag/indexer

patches:
  - target:
      kind: CronJob
      name: synesis-indexer-queue
    patch: |
      - op: replace
        path: /spec/schedule
        value: "0 3 1,15 * *"

images:
  - name: synesis-indexer
    newName: ghcr.io/supernovae/synesis/indexer
    newTag: latest
