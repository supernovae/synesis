# OpenRouter API key — replace the placeholder before deploying.
#
# Create or update:
#   oc create secret generic openrouter-api-key \
#     --from-literal=api-key=sk-or-v1-YOUR_KEY_HERE \
#     -n synesis-gateway --dry-run=client -o yaml | oc apply -f -
#
# Or edit this file directly (gitignore it if committing to a shared repo).
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-api-key
  namespace: synesis-gateway
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  api-key: "sk-or-v1-REPLACE_ME"
