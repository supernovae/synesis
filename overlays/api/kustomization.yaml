# API mode — routes all LLM traffic through external providers (OpenRouter, etc.).
#
# No GPU pods, no vLLM. Provider API keys are prompted by deploy.sh on first
# run, then managed via Admin UI (Settings > Provider Keys).
#
# Usage:
#   ./scripts/deploy.sh api
#   ./scripts/deploy.sh api v1.2.0    # specific image tag

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/core
  # MCP-TS agent + Yarn IDE path (LiteLLM route synesis-yarn); depend on planner/redis from core.
  - ../../base/mcp-ts
  - ../../base/yarn-ts
  - ../../base/ast-mcp
  - ../../base/vision-worker

patches:
  # LiteLLM is now managed by Helm (base/gateway/helm/values-synesis.yaml).
  # ConfigMap, Deployment, Service, and Route are all in the Helm release.

  # Supervisor: redirect model health checks through LiteLLM
  - target:
      kind: ConfigMap
      name: synesis-supervisor-config
    path: supervisor-config-patch.yaml

  # WebUI: point directly at planner-ts so SSE status events pass through
  # without being stripped by LiteLLM's response normalizer.
  # Auth: use the internal service token so the planner trusts forwarded
  # X-OpenWebUI-* identity headers (strict_forwarded_identity_mode).
  - target:
      kind: Deployment
      name: open-webui
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: open-webui
      spec:
        template:
          spec:
            containers:
              - name: open-webui
                env:
                  - name: OPENAI_API_BASE_URL
                    value: "http://synesis-planner-ts.synesis-planner.svc.cluster.local:8080/v1"
                  - name: OPENAI_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: synesis-internal-service-auth
                        key: token
                  - name: RESET_CONFIG_ON_START
                    value: "true"

images:
  - name: synesis-admin
    newName: ghcr.io/supernovae/synesis/admin
    newTag: latest
  - name: synesis-sandbox
    newName: ghcr.io/supernovae/synesis/sandbox
    newTag: latest
  - name: synesis-bge-reranker
    newName: ghcr.io/supernovae/synesis/bge-reranker
    newTag: latest
  - name: synesis-ingestor
    newName: ghcr.io/supernovae/synesis/ingestor
    newTag: latest
  - name: quality-runner
    newName: ghcr.io/supernovae/synesis/quality-runner
    newTag: latest
  - name: ghcr.io/open-webui/open-webui
    newName: ghcr.io/supernovae/synesis/open-webui
    newTag: latest
  - name: synesis-mcp-ts
    newName: ghcr.io/supernovae/synesis/mcp-ts
    newTag: latest
  - name: synesis-ast-mcp
    newName: ghcr.io/supernovae/synesis/synesis-ast-mcp
    newTag: latest
  - name: synesis-vision-worker
    newName: ghcr.io/supernovae/synesis/vision-worker
    newTag: latest
  - name: synesis-admin-mcp-ts
    newName: ghcr.io/supernovae/synesis/admin-mcp-ts
    newTag: latest
  - name: ghcr.io/supernovae/synesis/yarn-ts
    newName: ghcr.io/supernovae/synesis/yarn-ts
    newTag: latest
