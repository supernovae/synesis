# API mode — routes all LLM traffic through external providers (OpenRouter, etc.).
#
# No GPU pods, no vLLM. Provider API keys are prompted by deploy.sh on first
# run, then managed via Admin UI (Settings > Provider Keys).
#
# Usage:
#   ./scripts/deploy.sh api
#   ./scripts/deploy.sh api v1.2.0    # specific image tag

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/core
  # MCP agent + Yarn IDE path (LiteLLM route synesis-yarn); depend on planner/redis from core.
  - ../../base/mcp
  - ../../base/yarn

patches:
  # LiteLLM is now managed by Helm (base/gateway/helm/values-synesis.yaml).
  # ConfigMap, Deployment, Service, and Route are all in the Helm release.

  # Supervisor: redirect model health checks through LiteLLM
  - target:
      kind: ConfigMap
      name: synesis-supervisor-config
    path: supervisor-config-patch.yaml

  # WebUI: point directly at the planner so SSE status events pass through
  # without being stripped by LiteLLM's response normalizer.
  - target:
      kind: Deployment
      name: open-webui
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: open-webui
      spec:
        template:
          spec:
            containers:
              - name: open-webui
                env:
                  - name: OPENAI_API_BASE_URL
                    value: "http://synesis-planner.synesis-planner.svc.cluster.local:8000/v1"

  # Planner: all model URLs through LiteLLM. Registry-backed routes are pushed
  # to LiteLLM via Prisma (/model/new); the OpenRouter ConfigMap is bootstrap only.
  - target:
      kind: Deployment
      name: synesis-planner
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: synesis-planner
      spec:
        template:
          spec:
            containers:
              - name: planner
                env:
                  - name: SYNESIS_ROUTER_MODEL_URL
                    value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
                  - name: SYNESIS_PLANNER_MODEL_URL
                    value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
                  - name: SYNESIS_ADVISOR_MODEL_URL
                    value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
                  - name: SYNESIS_GENERAL_MODEL_URL
                    value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
                  - name: SYNESIS_CRITIC_MODEL_URL
                    value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
                  - name: SYNESIS_SUMMARIZER_MODEL_URL
                    value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
                  - name: SYNESIS_ROUTER_MODEL_NAME
                    value: "synesis-router"
                  - name: SYNESIS_PLANNER_MODEL_NAME
                    value: "synesis-router"
                  - name: SYNESIS_ADVISOR_MODEL_NAME
                    value: "synesis-router"
                  - name: SYNESIS_GENERAL_MODEL_NAME
                    value: "synesis-general"
                  - name: SYNESIS_CRITIC_MODEL_NAME
                    value: "synesis-critic"
                  - name: SYNESIS_CRITIC_MAX_TOKENS
                    value: "4096"
                  - name: SYNESIS_ROUTER_REASONING_EFFORT
                    value: "none"
                  - name: SYNESIS_PLANNER_REASONING_EFFORT
                    value: "low"
                  - name: SYNESIS_SUMMARIZER_MODEL_NAME
                    value: "synesis-summarizer"
                  - name: SYNESIS_MODEL_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: litellm-secrets
                        key: master-key
                        optional: true
                  - name: SYNESIS_GUIDED_JSON_ENABLED
                    value: "false"
                  - name: SYNESIS_ROUTER_MODEL_UDS
                    value: ""
                  - name: SYNESIS_PLANNER_MODEL_UDS
                    value: ""
                  - name: SYNESIS_GENERAL_MODEL_UDS
                    value: ""
                  - name: SYNESIS_CRITIC_MODEL_UDS
                    value: ""
                  - name: SYNESIS_ADVISOR_MODEL_UDS
                    value: ""

images:
  - name: synesis-planner
    newName: ghcr.io/supernovae/synesis/planner
    newTag: latest
  - name: synesis-admin
    newName: ghcr.io/supernovae/synesis/admin
    newTag: latest
  - name: synesis-lsp-gateway
    newName: ghcr.io/supernovae/synesis/lsp-gateway
    newTag: latest
  - name: synesis-sandbox
    newName: ghcr.io/supernovae/synesis/sandbox
    newTag: latest
  - name: synesis-bge-reranker
    newName: ghcr.io/supernovae/synesis/bge-reranker
    newTag: latest
  - name: synesis-ingestor
    newName: ghcr.io/supernovae/synesis/ingestor
    newTag: latest
  - name: quality-runner
    newName: ghcr.io/supernovae/synesis/quality-runner
    newTag: latest
  - name: ghcr.io/open-webui/open-webui
    newName: ghcr.io/supernovae/synesis/open-webui
    newTag: latest
  - name: ghcr.io/supernovae/synesis/mcp
    newName: ghcr.io/supernovae/synesis/mcp
    newTag: latest
  - name: ghcr.io/supernovae/synesis/yarn
    newName: ghcr.io/supernovae/synesis/yarn
    newTag: latest
