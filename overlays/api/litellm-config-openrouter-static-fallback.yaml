# LiteLLM config — API mode static fallback.
#
# Use this when Prisma dynamic model registration is unhealthy.
# Pipeline role routes are defined statically so traffic continues to work.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: synesis-gateway
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: gateway
data:
  config.yaml: |
    model_list:
      - model_name: Synesis
        litellm_params:
          model: openai/Synesis
          api_base: http://synesis-planner-ts.synesis-planner.svc.cluster.local:8080/v1
          api_key: "not-needed"
          max_tokens: 65536
          temperature: 0.2

      - model_name: Synesis Thinking
        litellm_params:
          model: openai/Synesis Thinking
          api_base: http://synesis-planner-ts.synesis-planner.svc.cluster.local:8080/v1
          api_key: "not-needed"
          max_tokens: 65536
          temperature: 0.2

      # Static role mappings while Prisma-backed /model/new is unavailable.
      - model_name: synesis-router
        litellm_params:
          model: xai/grok-4-1-fast-non-reasoning
          api_key: "os.environ/XAI_API_KEY"
          max_tokens: 4096
          temperature: 0.1

      - model_name: synesis-summarizer
        litellm_params:
          model: xai/grok-4-1-fast-non-reasoning
          api_key: "os.environ/XAI_API_KEY"
          max_tokens: 2048
          temperature: 0.1

      - model_name: synesis-general
        litellm_params:
          model: deepinfra/deepseek-ai/DeepSeek-V3.2
          api_key: "os.environ/DEEPINFRA_API_KEY"
          max_tokens: 32768
          temperature: 0.3

      - model_name: synesis-critic
        litellm_params:
          model: openrouter/deepseek/deepseek-r1-distill-qwen-32b
          api_key: "os.environ/OPENROUTER_API_KEY"
          max_tokens: 4096
          temperature: 0.1

      - model_name: synesis-coder
        litellm_params:
          model: openrouter/qwen/qwen-2.5-coder-32b-instruct
          api_key: "os.environ/OPENROUTER_API_KEY"
          max_tokens: 16384
          temperature: 0.2

      # Optional Open WebUI thinking model.
      - model_name: synesis-thinking
        litellm_params:
          model: openrouter/deepseek/deepseek-r1-distill-llama-70b
          api_key: "os.environ/OPENROUTER_API_KEY"
          max_tokens: 16384
          temperature: 0.2

    litellm_settings:
      drop_params: true
      set_verbose: false
      num_retries: 2
      request_timeout: 300

    general_settings:
      forward_client_headers_to_llm_api: true
      background_health_checks: false
      database_connection_pool_limit: 10
      database_connection_timeout: 60
      allow_requests_on_db_unavailable: true
