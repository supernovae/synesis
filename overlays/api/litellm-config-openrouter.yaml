# LiteLLM config — API mode dynamic (Prisma-backed).
#
# Keep only bootstrap/non-registry models here. Canonical pipeline roles
# (router/general/critic/coder/summarizer) are pushed dynamically by Admin
# via LiteLLM /model/new and persisted in the LiteLLM Postgres database.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: synesis-gateway
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: gateway
data:
  config.yaml: |
    model_list:
      - model_name: Synesis
        litellm_params:
          model: openai/Synesis
          api_base: http://synesis-planner.synesis-planner.svc.cluster.local:8000/v1
          api_key: "not-needed"
          max_tokens: 65536
          temperature: 0.2

      - model_name: Synesis Thinking
        litellm_params:
          model: openai/Synesis Thinking
          api_base: http://synesis-planner.synesis-planner.svc.cluster.local:8000/v1
          api_key: "not-needed"
          max_tokens: 65536
          temperature: 0.2

      # R1 optional model (not the pipeline "Synesis Thinking" mode).
      - model_name: synesis-thinking
        litellm_params:
          model: openrouter/deepseek/deepseek-r1-distill-llama-70b
          api_key: "os.environ/OPENROUTER_API_KEY"
          max_tokens: 16384
          temperature: 0.2

    litellm_settings:
      drop_params: true
      set_verbose: false
      num_retries: 2
      request_timeout: 300

    general_settings:
      forward_client_headers_to_llm_api: true
      background_health_checks: false
      database_connection_pool_limit: 10
      database_connection_timeout: 60
      allow_requests_on_db_unavailable: true
