# LiteLLM config — API mode bootstrap.
#
# synesis-agent stays in YAML (planner passthrough). Canonical pipeline roles
# (router, general, critic, coder, summarizer) are registered via Admin
# Model Registry → Postgres → POST /model/new (requires STORE_MODEL_IN_DB +
# DATABASE_URL on litellm-proxy). If those routes also lived here, LiteLLM
# would keep the static OpenRouter mappings and ignore registry edits.
#
# Optional WebUI models not driven by the registry remain below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: synesis-gateway
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: gateway
data:
  config.yaml: |
    model_list:
      # Primary pipeline endpoint (Open WebUI → LangGraph pipeline)
      # This routes through the planner — no OpenRouter needed here.
      - model_name: synesis-agent
        litellm_params:
          model: openai/synesis-agent
          api_base: http://synesis-planner.synesis-planner.svc.cluster.local:8000/v1
          api_key: "not-needed"
          max_tokens: 65536
          temperature: 0.2

      # Thinking model (Open WebUI optional) — not in Model Registry roles.
      - model_name: synesis-thinking
        litellm_params:
          model: openrouter/deepseek/deepseek-r1-distill-llama-70b
          api_key: "os.environ/OPENROUTER_API_KEY"
          max_tokens: 16384
          temperature: 0.2

    litellm_settings:
      drop_params: true
      set_verbose: false
      num_retries: 2
      request_timeout: 300

    general_settings:
      forward_client_headers_to_llm_api: true
      background_health_checks: false
