# Synesis local compose stack.
#
# Default profile:
#   postgres, redis, synesis-admin, planner-ts, yarn-ts, Open WebUI
#
# Optional profiles:
#   mcp     - synesis-mcp and synesis-admin-mcp-ts
#   search  - SearXNG for planner web search experiments
#   rag     - NornicDB plus lightweight RAG helper services
#   ingest  - one-shot queue indexer; pair with --profile rag
#   heavy   - model-heavy ingestion helpers such as GLiNER/spam/reranker/embedder
#
# Usage:
#   cp .env.example .env
#   podman compose -f podman-compose.yaml up -d
#   docker compose -f podman-compose.yaml up -d

name: synesis-local

x-common-service-env: &common-service-env
  SYNESIS_INTERNAL_SERVICE_TOKEN: ${SYNESIS_INTERNAL_SERVICE_TOKEN:-local-dev-internal-token}
  SYNESIS_PAT_PEPPER: ${SYNESIS_PAT_PEPPER:-local-dev-pat-pepper}
  SYNESIS_REQUIRE_PAT_PEPPER: ${SYNESIS_REQUIRE_PAT_PEPPER:-false}

x-admin-db-url: &admin-db-url postgresql+asyncpg://synesis:synesis@postgres:5432/synesis_admin
x-admin-db-url-node: &admin-db-url-node postgresql://synesis:synesis@postgres:5432/synesis_admin

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: synesis_admin
      POSTGRES_USER: synesis
      POSTGRES_PASSWORD: synesis
    ports:
      - "${SYNESIS_LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synesis -d synesis_admin"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: docker.io/library/redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${SYNESIS_LOCAL_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  admin:
    image: ghcr.io/supernovae/synesis/admin:${SYNESIS_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-service-env
      SYNESIS_LOG_LEVEL: ${SYNESIS_LOG_LEVEL:-info}
      SYNESIS_ADMIN_DATABASE_URL: *admin-db-url
      SYNESIS_ADMIN_SESSION_TOKEN_KEY: ${SYNESIS_ADMIN_SESSION_TOKEN_KEY:-local-dev-session-token-key}
      SYNESIS_ADMIN_REQUIRE_SESSION_TOKEN_ENCRYPTION: ${SYNESIS_ADMIN_REQUIRE_SESSION_TOKEN_ENCRYPTION:-false}
      SYNESIS_ADMIN_COOKIE_SECURE: ${SYNESIS_ADMIN_COOKIE_SECURE:-false}
      SYNESIS_CORS_ORIGINS: ${SYNESIS_CORS_ORIGINS:-http://localhost:3000,http://localhost:8081,http://localhost:5173}
      SYNESIS_CORS_ALLOW_CREDENTIALS: "true"
      SYNESIS_PLANNER_URL: http://planner:8080
      SYNESIS_PLANNER_TS_URL: http://planner:8080
      SYNESIS_YARN_URL: http://yarn:8000
      SYNESIS_YARN_TS_URL: http://yarn:8000
      SYNESIS_MCP_URL: http://synesis-mcp:8100
      SYNESIS_ADMIN_MCP_URL: http://admin-mcp:8102
      SYNESIS_OPENWEBUI_URL: http://open-webui:8080
      SYNESIS_OPENWEBUI_ADMIN_TOKEN: ${SYNESIS_OPENWEBUI_ADMIN_TOKEN:-}
      SYNESIS_KEYCLOAK_ISSUER_URL: ${SYNESIS_KEYCLOAK_ISSUER_URL:-}
      SYNESIS_KEYCLOAK_INTERNAL_ISSUER_URL: ${SYNESIS_KEYCLOAK_INTERNAL_ISSUER_URL:-}
      SYNESIS_KEYCLOAK_AUDIENCE: ${SYNESIS_KEYCLOAK_AUDIENCE:-}
      SYNESIS_KEYCLOAK_EXPECTED_AZP: ${SYNESIS_KEYCLOAK_EXPECTED_AZP:-synesis-admin}
      SYNESIS_NORNIC_URI: ${SYNESIS_NORNIC_URI:-bolt://nornicdb:7687}
      SYNESIS_NORNIC_HTTP_URL: ${SYNESIS_NORNIC_HTTP_URL:-http://nornicdb:7474}
      SYNESIS_NORNIC_USER: ${SYNESIS_NORNIC_USER:-neo4j}
      SYNESIS_NORNIC_PASSWORD: ${SYNESIS_NORNIC_PASSWORD:-nornic-local-password}
      SYNESIS_NORNIC_DATABASE: ${SYNESIS_NORNIC_DATABASE:-nornic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    ports:
      - "${SYNESIS_LOCAL_ADMIN_PORT:-8081}:8080"
    volumes:
      - ./charts/synesis/files/admin/taxonomy_prompt_config.yaml:/etc/synesis/taxonomy_prompt_config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 20

  planner:
    image: ghcr.io/supernovae/synesis/planner-ts:${SYNESIS_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      admin:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: "8080"
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      <<: *common-service-env
      SYNESIS_PLANNER_TS_LLM_ENABLED: ${SYNESIS_PLANNER_TS_LLM_ENABLED:-false}
      SYNESIS_PLANNER_TS_LLM_BASE_URL: ${SYNESIS_PLANNER_TS_LLM_BASE_URL:-}
      SYNESIS_PLANNER_TS_LLM_API_KEY: ${SYNESIS_PLANNER_TS_LLM_API_KEY:-}
      SYNESIS_PLANNER_TS_MODEL_ID: ${SYNESIS_PLANNER_TS_MODEL_ID:-Synesis Auto}
      SYNESIS_PLANNER_TS_MODEL_IDS: ${SYNESIS_PLANNER_TS_MODEL_IDS:-Synesis Auto,Synesis Pulse,Synesis Core,Synesis Horizon}
      SYNESIS_PLANNER_TS_WRITER_MODEL: ${SYNESIS_PLANNER_TS_WRITER_MODEL:-synesis-writer}
      SYNESIS_PLANNER_TS_PLANNER_MODEL: ${SYNESIS_PLANNER_TS_PLANNER_MODEL:-synesis-planner}
      SYNESIS_PLANNER_TS_CRITIC_MODEL: ${SYNESIS_PLANNER_TS_CRITIC_MODEL:-synesis-critic}
      SYNESIS_PLANNER_TS_REQUIRE_BEARER_AUTH: ${SYNESIS_PLANNER_TS_REQUIRE_BEARER_AUTH:-false}
      SYNESIS_PLANNER_TS_ALLOW_OPAQUE_BEARER: ${SYNESIS_PLANNER_TS_ALLOW_OPAQUE_BEARER:-true}
      SYNESIS_PLANNER_TS_TRUST_FORWARDED_IDENTITY_HEADERS: ${SYNESIS_PLANNER_TS_TRUST_FORWARDED_IDENTITY_HEADERS:-false}
      SYNESIS_PLANNER_TS_STRICT_FORWARDED_IDENTITY_MODE: ${SYNESIS_PLANNER_TS_STRICT_FORWARDED_IDENTITY_MODE:-false}
      SYNESIS_PLANNER_TS_INTERNAL_SERVICE_TOKEN: ${SYNESIS_INTERNAL_SERVICE_TOKEN:-local-dev-internal-token}
      SYNESIS_PLANNER_TS_REDIS_URL: redis://redis:6379/2
      SYNESIS_PLANNER_TS_ADMIN_DB_URL: *admin-db-url-node
      SYNESIS_ADMIN_URL: http://admin:8080
      SYNESIS_ADMIN_INTERNAL_TOKEN: ${SYNESIS_INTERNAL_SERVICE_TOKEN:-local-dev-internal-token}
      SYNESIS_PLANNER_TS_STREAM_STATUS_EVENTS: ${SYNESIS_PLANNER_TS_STREAM_STATUS_EVENTS:-openwebui-data}
      SYNESIS_PLANNER_TS_OPENWEBUI_EVENTS_ENABLED: ${SYNESIS_PLANNER_TS_OPENWEBUI_EVENTS_ENABLED:-true}
      SYNESIS_PLANNER_TS_OPENWEBUI_BASE_URL: http://open-webui:8080
      SYNESIS_PLANNER_TS_OPENWEBUI_EVENT_TOKEN: ${SYNESIS_PLANNER_TS_OPENWEBUI_EVENT_TOKEN:-}
      SYNESIS_NORNIC_URI: ${SYNESIS_NORNIC_URI:-bolt://nornicdb:7687}
      SYNESIS_NORNIC_HTTP_URL: ${SYNESIS_NORNIC_HTTP_URL:-http://nornicdb:7474}
      SYNESIS_NORNIC_USER: ${SYNESIS_NORNIC_USER:-neo4j}
      SYNESIS_NORNIC_PASSWORD: ${SYNESIS_NORNIC_PASSWORD:-nornic-local-password}
      SYNESIS_NORNIC_DATABASE: ${SYNESIS_NORNIC_DATABASE:-nornic}
      SYNESIS_RAG_AUTHZ_MODE: ${SYNESIS_RAG_AUTHZ_MODE:-audit}
      SYNESIS_EMBEDDER_URL: ${SYNESIS_EMBEDDER_URL:-}
      SYNESIS_WEB_SEARCH_ENABLED: ${SYNESIS_WEB_SEARCH_ENABLED:-false}
      SYNESIS_WEB_SEARCH_URL: ${SYNESIS_WEB_SEARCH_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    ports:
      - "${SYNESIS_LOCAL_PLANNER_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20

  yarn:
    image: ghcr.io/supernovae/synesis/yarn-ts:${SYNESIS_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      admin:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: "8000"
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      <<: *common-service-env
      SYNESIS_YARN_ADMIN_API_URL: http://admin:8080
      SYNESIS_YARN_PLANNER_URL: http://planner:8080
      SYNESIS_YARN_SESSION_REDIS_URL: redis://redis:6379/3
      SYNESIS_YARN_ADMIN_DB_URL: *admin-db-url-node
      SYNESIS_YARN_ALLOW_OPAQUE_BEARER: ${SYNESIS_YARN_ALLOW_OPAQUE_BEARER:-true}
      SYNESIS_YARN_OPENAI_COMPAT_BASE_URL: ${SYNESIS_YARN_OPENAI_COMPAT_BASE_URL:-https://openrouter.ai/api/v1}
      SYNESIS_YARN_OPENAI_COMPAT_API_KEY: ${SYNESIS_YARN_OPENAI_COMPAT_API_KEY:-}
      SYNESIS_YARN_MCP_TOOLS_ENABLED: ${SYNESIS_YARN_MCP_TOOLS_ENABLED:-true}
      SYNESIS_YARN_KNOWLEDGE_SEARCH_ENABLED: ${SYNESIS_YARN_KNOWLEDGE_SEARCH_ENABLED:-false}
      SYNESIS_YARN_WEB_SEARCH_ENABLED: ${SYNESIS_YARN_WEB_SEARCH_ENABLED:-false}
      SYNESIS_YARN_EVIDENCE_PREFETCH_ENABLED: ${SYNESIS_YARN_EVIDENCE_PREFETCH_ENABLED:-false}
      SYNESIS_YARN_SECURITY_INGEST_ENABLED: ${SYNESIS_YARN_SECURITY_INGEST_ENABLED:-true}
      SYNESIS_OIDC_ISSUER_URL: ${SYNESIS_OIDC_ISSUER_URL:-}
      SYNESIS_OIDC_INTERNAL_ISSUER_URL: ${SYNESIS_OIDC_INTERNAL_ISSUER_URL:-}
      SYNESIS_OPENFGA_API_URL: ${SYNESIS_OPENFGA_API_URL:-}
      SYNESIS_OPENFGA_STORE_ID: ${SYNESIS_OPENFGA_STORE_ID:-}
      SYNESIS_OPENFGA_MODEL_ID: ${SYNESIS_OPENFGA_MODEL_ID:-}
      SYNESIS_OPENFGA_AUTH_TOKEN: ${SYNESIS_OPENFGA_AUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    ports:
      - "${SYNESIS_LOCAL_YARN_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20

  open-webui:
    image: ghcr.io/supernovae/synesis/open-webui:${SYNESIS_WEBUI_IMAGE_TAG:-v0.9.6}
    restart: unless-stopped
    depends_on:
      planner:
        condition: service_started
    environment:
      OPENAI_API_BASE_URL: http://planner:8080/v1
      OPENAI_API_KEY: ${SYNESIS_INTERNAL_SERVICE_TOKEN:-local-dev-internal-token}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-local-dev-webui-secret-key}
      WEBUI_AUTH: "true"
      DEFAULT_USER_ROLE: admin
      ENABLE_SIGNUP: ${SYNESIS_LOCAL_WEBUI_ENABLE_SIGNUP:-true}
      ENABLE_LOGIN_FORM: "true"
      ENABLE_OAUTH_SIGNUP: "false"
      ENABLE_API_KEYS: "true"
      ENABLE_OLLAMA_API: "false"
      ENABLE_IMAGE_GENERATION: "false"
      ENABLE_RAG_WEB_SEARCH: "false"
      ENABLE_KB_EXEC: "false"
      ENABLE_RETRIEVAL_UNSCOPED_COLLECTIONS: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      WEBUI_NAME: Synesis
      WEBUI_URL: http://localhost:${SYNESIS_LOCAL_WEBUI_PORT:-3000}
      DEFAULT_MODELS: Synesis Auto
      DEFAULT_PINNED_MODELS: Synesis Auto,Synesis Pulse,Synesis Core,Synesis Horizon
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      SAFE_MODE: "true"
      CODE_EXECUTION_ENGINE: ""
      CONTENT_EXTRACTION_ENGINE: ""
      HOME: /tmp/home
      STATIC_DIR: /app/backend/data/static
      AIOHTTP_CLIENT_TIMEOUT: "600"
    ports:
      - "${SYNESIS_LOCAL_WEBUI_PORT:-3000}:8080"
    volumes:
      - webui-data:/app/backend/data
      - webui-cache:/app/backend/.cache
      - webui-home:/tmp/home
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 30

  synesis-mcp:
    image: ghcr.io/supernovae/synesis/synesis-mcp:${SYNESIS_IMAGE_TAG:-latest}
    profiles: ["mcp"]
    restart: unless-stopped
    depends_on:
      planner:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "8100"
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      <<: *common-service-env
      SYNESIS_MCP_HTTP_PATH: /mcp
      SYNESIS_MCP_AUTHZ_MODE: ${SYNESIS_MCP_AUTHZ_MODE:-audit}
      SYNESIS_MCP_ALLOW_INTERNAL_ONLY: ${SYNESIS_MCP_ALLOW_INTERNAL_ONLY:-true}
      SYNESIS_MCP_CORS_ORIGINS: ${SYNESIS_MCP_CORS_ORIGINS:-http://localhost:3000,http://localhost:8081}
      SYNESIS_PLANNER_URL: http://planner:8080
      SYNESIS_ADMIN_DB_URL: *admin-db-url-node
    ports:
      - "${SYNESIS_LOCAL_MCP_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20

  admin-mcp:
    image: ghcr.io/supernovae/synesis/admin-mcp-ts:${SYNESIS_IMAGE_TAG:-latest}
    profiles: ["mcp"]
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_started
      planner:
        condition: service_started
    environment:
      PORT: "8102"
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      <<: *common-service-env
      SYNESIS_ADMIN_API_URL: http://admin:8080
      SYNESIS_ADMIN_URL: http://admin:8080
      SYNESIS_PLANNER_URL: http://planner:8080
      SYNESIS_PLANNER_TS_INTERNAL_SERVICE_TOKEN: ${SYNESIS_INTERNAL_SERVICE_TOKEN:-local-dev-internal-token}
    ports:
      - "${SYNESIS_LOCAL_ADMIN_MCP_PORT:-8102}:8102"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8102/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20

  searxng:
    image: docker.io/searxng/searxng:latest
    profiles: ["search"]
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://localhost:${SYNESIS_LOCAL_SEARCH_PORT:-8085}/
      SEARXNG_PORT: "8080"
      GRANIAN_PORT: "8080"
    ports:
      - "${SYNESIS_LOCAL_SEARCH_PORT:-8085}:8080"
    volumes:
      - searxng-cache:/var/cache/searxng

  nornicdb:
    image: docker.io/timothyswt/nornicdb-amd64-cpu:${SYNESIS_NORNICDB_IMAGE_TAG:-v1.2.3}
    profiles: ["rag"]
    restart: unless-stopped
    depends_on:
      bge-reranker:
        condition: service_started
    environment:
      NORNICDB_AUTH: neo4j/${SYNESIS_NORNIC_PASSWORD:-nornic-local-password}
      NORNICDB_RUNTIME_PROFILE: ${SYNESIS_NORNIC_RUNTIME_PROFILE:-cpu-bge}
      NORNICDB_SEARCH_RERANK_ENABLED: "true"
      NORNICDB_SEARCH_RERANK_PROVIDER: http
      NORNICDB_SEARCH_RERANK_API_URL: http://bge-reranker:8000/rerank
      NORNICDB_SEARCH_RERANK_MODEL: BAAI/bge-reranker-v2-m3
    ports:
      - "${SYNESIS_LOCAL_NORNIC_BOLT_PORT:-7687}:7687"
      - "${SYNESIS_LOCAL_NORNIC_HTTP_PORT:-7474}:7474"
    volumes:
      - nornicdb-data:/data

  keyword-service:
    image: ghcr.io/supernovae/synesis/keyword-service:${SYNESIS_IMAGE_TAG:-latest}
    profiles: ["rag"]
    restart: unless-stopped
    environment:
      SYNESIS_EMBEDDER_URL: ${SYNESIS_EMBEDDER_URL:-}
    ports:
      - "${SYNESIS_LOCAL_KEYWORD_PORT:-8086}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 20

  preprocess-service:
    image: ghcr.io/supernovae/synesis/preprocess-service:${SYNESIS_IMAGE_TAG:-latest}
    profiles: ["rag"]
    restart: unless-stopped
    ports:
      - "${SYNESIS_LOCAL_PREPROCESS_PORT:-8087}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 20

  bge-reranker:
    image: ghcr.io/supernovae/synesis/bge-reranker:${SYNESIS_IMAGE_TAG:-latest}
    profiles: ["rag", "heavy"]
    restart: unless-stopped
    ports:
      - "${SYNESIS_LOCAL_RERANKER_PORT:-8088}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 20s
      timeout: 5s
      retries: 30

  indexer:
    image: ghcr.io/supernovae/synesis/indexer:${SYNESIS_IMAGE_TAG:-latest}
    profiles: ["ingest"]
    depends_on:
      admin:
        condition: service_started
      nornicdb:
        condition: service_started
    environment:
      SYNESIS_ADMIN_URL: http://admin:8080
      SYNESIS_ADMIN_SERVICE_TOKEN: ${SYNESIS_INTERNAL_SERVICE_TOKEN:-local-dev-internal-token}
      SYNESIS_NORNIC_URI: bolt://nornicdb:7687
      SYNESIS_NORNIC_USER: ${SYNESIS_NORNIC_USER:-neo4j}
      SYNESIS_NORNIC_PASSWORD: ${SYNESIS_NORNIC_PASSWORD:-nornic-local-password}
      SYNESIS_NORNIC_DATABASE: ${SYNESIS_NORNIC_DATABASE:-nornic}
      SYNESIS_EMBEDDER_URL: ${SYNESIS_EMBEDDER_URL:-}
      SYNESIS_INDEXER_PREPROCESS_URL: http://preprocess-service:8080
      SYNESIS_INDEXER_SPAM_URL: ${SYNESIS_INDEXER_SPAM_URL:-}
      SYNESIS_INDEXER_QUEUE_MAX_ITEMS: ${SYNESIS_INDEXER_QUEUE_MAX_ITEMS:-0}
    command:
      - --mode
      - queue
      - --admin-url
      - http://admin:8080
    volumes:
      - ./bootstrap:/data/bootstrap:ro
      - indexer-work:/data/work

  gliner-service:
    image: ghcr.io/supernovae/synesis/gliner-service:${SYNESIS_IMAGE_TAG:-latest}
    profiles: ["heavy"]
    restart: unless-stopped
    ports:
      - "${SYNESIS_LOCAL_GLINER_PORT:-8089}:8080"
    volumes:
      - hf-cache:/tmp/hf_home
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      HF_HOME: /tmp/hf_home
      TRANSFORMERS_CACHE: /tmp/hf_home
      TORCH_HOME: /tmp/torch
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 20s
      timeout: 5s
      retries: 30

  spam-service:
    image: ghcr.io/supernovae/synesis/spam-service:${SYNESIS_IMAGE_TAG:-latest}
    profiles: ["heavy"]
    restart: unless-stopped
    ports:
      - "${SYNESIS_LOCAL_SPAM_PORT:-8090}:8080"
    volumes:
      - hf-cache:/tmp/hf_home
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      HF_HOME: /tmp/hf_home
      TRANSFORMERS_CACHE: /tmp/hf_home
      TORCH_HOME: /tmp/torch
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 20s
      timeout: 5s
      retries: 30

  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    profiles: ["heavy"]
    restart: unless-stopped
    command:
      - --model-id
      - BAAI/bge-m3
      - --port
      - "8080"
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      HF_HOME: /tmp/hf_home
    ports:
