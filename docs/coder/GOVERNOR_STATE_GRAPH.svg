<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-labelledby="title desc">
  <title id="title">Yarn Execution Governor State and Recovery Graph</title>
  <desc id="desc">Phase transitions and per-turn recovery escalation flow for the Yarn execution governor.</desc>
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 22px Arial, sans-serif; fill: #1e3a8a; }
      .node-text { font: 600 17px Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small-text { font: 13px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .edge-label { font: 13px Arial, sans-serif; fill: #334155; }
      .node { fill: #f8fbff; stroke: #1e3a8a; stroke-width: 2; rx: 12; }
      .decision { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .terminal { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 12; }
      .success { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 12; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.2; }
      .edge-dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 6; }
      .legend { font: 13px Arial, sans-serif; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="1120" fill="#ffffff"/>
  <text x="36" y="40" class="title">Yarn Execution Governor - State and Recovery Graph</text>

  <!-- Section 1 -->
  <text x="36" y="82" class="section">1) Phase State Machine</text>

  <rect x="40" y="120" width="120" height="56" class="node"/>
  <text x="100" y="148" class="node-text">Start</text>

  <rect x="220" y="100" width="170" height="70" class="node"/>
  <text x="305" y="132" class="node-text">Explore</text>
  <text x="305" y="150" class="small-text">investigation / discovery</text>

  <rect x="450" y="100" width="150" height="70" class="node"/>
  <text x="525" y="132" class="node-text">Edit</text>
  <text x="525" y="150" class="small-text">code changes</text>

  <rect x="660" y="100" width="170" height="70" class="node"/>
  <text x="745" y="132" class="node-text">Verify</text>
  <text x="745" y="150" class="small-text">test / build / lint</text>

  <rect x="890" y="100" width="170" height="70" class="node"/>
  <text x="975" y="132" class="node-text">Report</text>
  <text x="975" y="150" class="small-text">completion narration</text>

  <rect x="1120" y="100" width="190" height="70" class="success"/>
  <text x="1215" y="132" class="node-text">Finalize</text>
  <text x="1215" y="150" class="small-text">task update / commit / done</text>

  <line x1="160" y1="140" x2="220" y2="135" class="edge" marker-end="url(#arrow)"/>
  <path d="M160 160 C250 190, 360 160, 450 146" class="edge" marker-end="url(#arrow)"/>
  <text x="278" y="198" class="edge-label">default non-investigation start</text>

  <line x1="390" y1="135" x2="450" y2="135" class="edge" marker-end="url(#arrow)"/>
  <text x="414" y="122" class="edge-label">first successful edit</text>

  <line x1="600" y1="135" x2="660" y2="135" class="edge" marker-end="url(#arrow)"/>
  <text x="620" y="122" class="edge-label">run verification</text>

  <line x1="600" y1="150" x2="890" y2="150" class="edge" marker-end="url(#arrow)"/>
  <text x="740" y="168" class="edge-label">completion claim tail</text>

  <line x1="830" y1="160" x2="600" y2="160" class="edge" marker-end="url(#arrow)"/>
  <text x="716" y="176" class="edge-label">fix needed</text>

  <line x1="830" y1="135" x2="1120" y2="135" class="edge" marker-end="url(#arrow)"/>
  <text x="972" y="122" class="edge-label">green verification + completion claim</text>

  <line x1="1060" y1="145" x2="1120" y2="145" class="edge" marker-end="url(#arrow)"/>
  <line x1="1120" y1="182" x2="600" y2="182" class="edge" marker-end="url(#arrow)"/>
  <text x="838" y="199" class="edge-label">new requirement / follow-up change</text>

  <line x1="890" y1="160" x2="600" y2="182" class="edge" marker-end="url(#arrow)"/>

  <path d="M390 130 C430 92, 430 176, 390 140" class="edge" marker-end="url(#arrow)"/>
  <path d="M600 130 C640 92, 640 176, 600 140" class="edge" marker-end="url(#arrow)"/>
  <path d="M830 130 C870 92, 870 176, 830 140" class="edge" marker-end="url(#arrow)"/>
  <text x="450" y="86" class="edge-label">loop when no phase-changing action occurs</text>

  <!-- Divider -->
  <line x1="32" y1="260" x2="1668" y2="260" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Section 2 -->
  <text x="36" y="304" class="section">2) Per-Turn Recovery and Hard-Stop Escalation</text>

  <rect x="60" y="380" width="170" height="62" class="node"/>
  <text x="145" y="411" class="node-text">Request In</text>

  <rect x="270" y="380" width="170" height="62" class="node"/>
  <text x="355" y="411" class="node-text">Normalize</text>

  <rect x="480" y="380" width="170" height="62" class="node"/>
  <text x="565" y="411" class="node-text">Turn Scope</text>

  <rect x="690" y="380" width="170" height="62" class="node"/>
  <text x="775" y="411" class="node-text">Extract Events</text>

  <rect x="900" y="380" width="170" height="62" class="node"/>
  <text x="985" y="411" class="node-text">Infer Phase</text>

  <rect x="1110" y="380" width="170" height="62" class="node"/>
  <text x="1195" y="411" class="node-text">Evaluate Rules</text>

  <polygon points="1365,367 1450,412 1365,457 1295,412" class="decision"/>
  <text x="1365" y="407" class="node-text">Pause?</text>

  <rect x="1510" y="360" width="170" height="60" class="success"/>
  <text x="1595" y="390" class="node-text">Allow</text>

  <rect x="1510" y="470" width="170" height="60" class="success"/>
  <text x="1595" y="500" class="node-text">Model Continues</text>

  <polygon points="1365,540 1450,585 1365,630 1280,585" class="decision"/>
  <text x="1365" y="580" class="node-text">Concrete</text>
  <text x="1365" y="598" class="small-text">progress?</text>

  <rect x="1110" y="670" width="170" height="58" class="success"/>
  <text x="1195" y="699" class="node-text">Decrement</text>

  <rect x="1290" y="670" width="150" height="58" class="node"/>
  <text x="1365" y="699" class="node-text">Hold</text>

  <rect x="1470" y="670" width="170" height="58" class="node"/>
  <text x="1555" y="699" class="node-text">Increment</text>

  <polygon points="1365,760 1450,805 1365,850 1280,805" class="decision"/>
  <text x="1365" y="800" class="node-text">Terminal +</text>
  <text x="1365" y="818" class="small-text">threshold?</text>

  <polygon points="1090,760 1175,805 1090,850 1005,805" class="decision"/>
  <text x="1090" y="800" class="node-text">Grace</text>
  <text x="1090" y="818" class="small-text">available?</text>

  <rect x="1490" y="885" width="190" height="60" class="node"/>
  <text x="1585" y="915" class="node-text">Inject Recovery</text>

  <rect x="810" y="885" width="220" height="60" class="terminal"/>
  <text x="920" y="915" class="node-text">Hard Stop Pause</text>

  <rect x="810" y="980" width="220" height="60" class="terminal"/>
  <text x="920" y="1010" class="node-text">Pause Envelope Out</text>

  <line x1="230" y1="411" x2="270" y2="411" class="edge" marker-end="url(#arrow)"/>
  <line x1="440" y1="411" x2="480" y2="411" class="edge" marker-end="url(#arrow)"/>
  <line x1="650" y1="411" x2="690" y2="411" class="edge" marker-end="url(#arrow)"/>
  <line x1="860" y1="411" x2="900" y2="411" class="edge" marker-end="url(#arrow)"/>
  <line x1="1070" y1="411" x2="1110" y2="411" class="edge" marker-end="url(#arrow)"/>
  <line x1="1280" y1="411" x2="1295" y2="412" class="edge" marker-end="url(#arrow)"/>
  <line x1="1450" y1="412" x2="1510" y2="390" class="edge" marker-end="url(#arrow)"/>
  <line x1="1595" y1="420" x2="1595" y2="470" class="edge" marker-end="url(#arrow)"/>

  <line x1="1365" y1="457" x2="1365" y2="540" class="edge" marker-end="url(#arrow)"/>
  <line x1="1280" y1="585" x2="1280" y2="699" class="edge" marker-end="url(#arrow)"/>
  <line x1="1365" y1="630" x2="1365" y2="670" class="edge" marker-end="url(#arrow)"/>
  <line x1="1450" y1="585" x2="1470" y2="699" class="edge" marker-end="url(#arrow)"/>

  <line x1="1195" y1="728" x2="1280" y2="805" class="edge" marker-end="url(#arrow)"/>
  <line x1="1365" y1="728" x2="1365" y2="760" class="edge" marker-end="url(#arrow)"/>
  <line x1="1555" y1="728" x2="1450" y2="805" class="edge" marker-end="url(#arrow)"/>

  <line x1="1450" y1="805" x2="1490" y2="915" class="edge" marker-end="url(#arrow)"/>
  <line x1="1280" y1="805" x2="1175" y2="805" class="edge" marker-end="url(#arrow)"/>
  <line x1="1090" y1="850" x2="1490" y2="915" class="edge" marker-end="url(#arrow)"/>
  <line x1="1005" y1="805" x2="920" y2="915" class="edge" marker-end="url(#arrow)"/>
  <line x1="920" y1="945" x2="920" y2="980" class="edge" marker-end="url(#arrow)"/>

  <line x1="1585" y1="885" x2="1595" y2="530" class="edge" marker-end="url(#arrow)"/>
  <path d="M1595 530 C1595 560, 220 560, 145 442" class="edge-dashed" marker-end="url(#arrow)"/>
  <text x="680" y="545" class="edge-label">next turn continues</text>

  <text x="1466" y="402" class="edge-label">pause=no</text>
  <text x="1376" y="528" class="edge-label">pause=yes</text>
  <text x="1245" y="580" class="edge-label">yes</text>
  <text x="1374" y="655" class="edge-label">hold</text>
  <text x="1470" y="580" class="edge-label">no</text>
  <text x="1464" y="806" class="edge-label">no</text>
  <text x="1190" y="790" class="edge-label">yes</text>
  <text x="1165" y="858" class="edge-label">yes</text>
  <text x="972" y="858" class="edge-label">no</text>

  <!-- Legend -->
  <rect x="40" y="1040" width="16" height="16" class="node"/>
  <text x="64" y="1053" class="legend">governor state or action node</text>
  <polygon points="320,1048 330,1040 340,1048 330,1056" class="decision"/>
  <text x="350" y="1053" class="legend">decision gate</text>
  <rect x="500" y="1040" width="16" height="16" class="terminal"/>
  <text x="524" y="1053" class="legend">terminal pause output</text>
  <rect x="710" y="1040" width="16" height="16" class="success"/>
  <text x="734" y="1053" class="legend">healthy/allow path</text>
</svg>
