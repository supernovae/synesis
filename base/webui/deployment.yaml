apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: synesis-webui
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.8.10
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: OPENAI_API_BASE_URL
              value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: webui-api-key
                  key: api-key
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: webui-api-key
                  key: api-key
            - name: HOME
              value: /tmp/home
            - name: WEBUI_AUTH
              value: "true"
            - name: ENABLE_SIGNUP
              value: "false"
            # Show local email/password as well as Keycloak (signup still off).
            - name: ENABLE_LOGIN_FORM
              value: "true"
            # ── Keycloak OIDC SSO ──
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            # Link Keycloak login to an existing Open WebUI user with the same email (avoids "already registered").
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: OAUTH_PROVIDER_NAME
              value: "Keycloak"
            - name: OPENID_PROVIDER_URL
              value: "https://synesis-auth.apps.openshiftdemo.dev/realms/synesis/.well-known/openid-configuration"
            - name: OAUTH_CLIENT_ID
              value: "synesis-webui"
            - name: OAUTH_CLIENT_SECRET
              value: ""
            # Required for public OIDC clients: otherwise Open WebUI never registers the OIDC provider.
            - name: OAUTH_CODE_CHALLENGE_METHOD
              value: "S256"
            # Must match Keycloak redirect allow-list; avoid proxy-derived http://internal URLs.
            - name: OPENID_REDIRECT_URI
              value: "https://synesis.apps.openshiftdemo.dev/oauth/oidc/callback"
            - name: OAUTH_SCOPES
              value: "openid email profile"
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: "true"
            - name: OAUTH_ADMIN_ROLES
              value: "synesis-admin"
            - name: OAUTH_ALLOWED_ROLES
              value: "synesis-user,synesis-admin"
            # V3: synesis-agent = default (pipeline), synesis-thinking = R1 optional,
            # synesis-coder = IDE direct. All auto-discovered from LiteLLM /v1/models.
            - name: DEFAULT_MODELS
              value: "synesis-agent"
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: WEBUI_NAME
              value: "Synesis"
            # Required for OIDC: redirect URI + “Sign in with …” button (see Open WebUI SSO docs).
            - name: WEBUI_URL
              value: "https://synesis.apps.openshiftdemo.dev"
            # Otherwise first-boot OAuth values are frozen in SQLite and env changes (WEBUI_URL) are ignored.
            - name: ENABLE_OAUTH_PERSISTENT_CONFIG
              value: "false"
            - name: ENABLE_IMAGE_GENERATION
              value: "false"
            - name: ENABLE_RAG_WEB_SEARCH
              value: "false"
            - name: ENABLE_COMMUNITY_SHARING
              value: "false"
            - name: ENABLE_FORWARD_USER_INFO_HEADERS
              value: "true"
            - name: SAFE_MODE
              value: "true"
            - name: CODE_EXECUTION_ENGINE
              value: ""
            - name: ENABLE_CODE_AUTOCOMPLETION
              value: "false"
            - name: CONTENT_EXTRACTION_ENGINE
              value: ""
            # Agentic flow (planning→sandbox→critic) can take several minutes
            - name: AIOHTTP_CLIENT_TIMEOUT
              value: "600"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: tmp-home
              mountPath: /tmp/home
            - name: cache
              mountPath: /app/backend/.cache
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: tmp-home
          emptyDir: {}
        - name: cache
          emptyDir: {}
