# Open WebUI api-key + WEBUI_SECRET_KEY source (same value).
#
# NOT listed in kustomization.yaml — see base/webui/kustomization.yaml.
# Managed by Helm values or deploy-time secret automation. This manifest is an
# empty stub so a public repo never ships a reusable WEBUI_SECRET_KEY.
#
apiVersion: v1
kind: Secret
metadata:
  name: webui-api-key
  namespace: synesis-webui
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: synesis
type: Opaque
stringData: {}
