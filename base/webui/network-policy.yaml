apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webui-allow-ingress
  namespace: synesis-webui
  labels:
    app.kubernetes.io/part-of: synesis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    - {}
# Open WebUI needs full egress for:
#   - Planner API (default: synesis-planner-ts:8080) if not using a public route
#   - Optional: external provider endpoints are reached by planner, not WebUI
#   - HuggingFace Hub (embedding model download on first boot), plugins, avatars, etc.
# The pod still runs as non-root with restricted SCC.
