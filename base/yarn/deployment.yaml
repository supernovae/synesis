apiVersion: apps/v1
kind: Deployment
metadata:
  name: synesis-yarn
  namespace: synesis-yarn
  labels:
    app.kubernetes.io/name: synesis-yarn
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: yarn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synesis-yarn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synesis-yarn
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: yarn
    spec:
      containers:
        - name: yarn
          image: ghcr.io/supernovae/synesis/yarn:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SYNESIS_YARN_PROVIDER
              value: "deepinfra"
            - name: SYNESIS_YARN_PULSE_MODEL
              value: "Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8"
            - name: SYNESIS_YARN_CORE_MODEL
              value: "Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo"
            - name: SYNESIS_YARN_HORIZON_MODEL
              value: "deepseek-ai/DeepSeek-R1-0528"
            - name: SYNESIS_YARN_DEFAULT_TIER
              value: "synesis-core"
            - name: SYNESIS_YARN_SESSION_REDIS_URL
              value: "redis://synesis-redis.synesis-rag.svc.cluster.local:6379/3"
            - name: SYNESIS_YARN_MEMORY_REDIS_URL
              value: "redis://synesis-redis.synesis-rag.svc.cluster.local:6379/4"
            - name: SYNESIS_YARN_PLANNER_URL
              value: "http://synesis-planner.synesis-planner.svc.cluster.local:8000"
            - name: SYNESIS_YARN_MCP_URL
              value: "http://synesis-mcp.synesis-planner.svc.cluster.local:8100"
            - name: SYNESIS_YARN_ADMIN_API_URL
              value: "http://synesis-admin.synesis-admin.svc.cluster.local:8080"
            - name: SYNESIS_YARN_KEYCLOAK_ISSUER_URL
              value: ""
            - name: SYNESIS_YARN_ADMIN_DB_URL
              valueFrom:
                secretKeyRef:
                  name: synesis-admin-db-url
                  key: admin-url
                  optional: true
            - name: SYNESIS_YARN_AUTH_ALLOW_LEGACY_FALLBACK
              value: "false"
            - name: SYNESIS_YARN_ENFORCE_MCP_AUTHZ
              value: "true"
            - name: SYNESIS_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: synesis-internal-service-auth
                  key: token
                  optional: true
            - name: SYNESIS_YARN_DIAGNOSTICS_ENABLED
              value: "true"
            - name: SYNESIS_YARN_DIAGNOSTICS_BASE_SAMPLE_RATE
              value: "0.02"
            - name: SYNESIS_YARN_DIAGNOSTICS_ON_FAILURE
              value: "true"
            - name: SYNESIS_YARN_DIAGNOSTICS_TOOL_LOOP_THRESHOLD
              value: "8"
            - name: SYNESIS_YARN_DIAGNOSTICS_MAX_TOOL_EVENTS
              value: "20"
            - name: SYNESIS_YARN_DIAGNOSTICS_SNAPSHOT_TTL_SECONDS
              value: "86400"
            # Browser clients: comma-separated origins (defaults in app include localhost).
            # For legacy open CORS set to "*" (discouraged in production).
            # - name: SYNESIS_YARN_CORS_ALLOW_ORIGINS
            #   value: "https://your-console.example.com"
          envFrom:
            - secretRef:
                name: provider-api-keys
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
