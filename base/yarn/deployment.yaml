apiVersion: apps/v1
kind: Deployment
metadata:
  name: synesis-yarn
  namespace: synesis-yarn
  labels:
    app.kubernetes.io/name: synesis-yarn
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: yarn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synesis-yarn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synesis-yarn
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: yarn
    spec:
      containers:
        - name: yarn
          image: ghcr.io/supernovae/synesis/yarn:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SYNESIS_YARN_PROVIDER
              value: "deepinfra"
            - name: SYNESIS_YARN_MODEL
              value: "Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo"
            - name: SYNESIS_YARN_SESSION_REDIS_URL
              value: "redis://synesis-redis.synesis-rag.svc.cluster.local:6379/3"
            - name: SYNESIS_YARN_MEMORY_REDIS_URL
              value: "redis://synesis-redis.synesis-rag.svc.cluster.local:6379/4"
            - name: SYNESIS_YARN_PLANNER_URL
              value: "http://synesis-planner.synesis-planner.svc.cluster.local:8000"
            - name: SYNESIS_YARN_MCP_URL
              value: "http://synesis-mcp.synesis-planner.svc.cluster.local:8100"
            - name: SYNESIS_YARN_ADMIN_API_URL
              value: "http://synesis-admin-api.synesis-admin.svc.cluster.local:8000"
            - name: SYNESIS_YARN_KEYCLOAK_ISSUER_URL
              value: ""
            - name: SYNESIS_YARN_ADMIN_DB_URL
              value: ""
            - name: SYNESIS_YARN_AUTH_ALLOW_LEGACY_FALLBACK
              value: "false"
            - name: SYNESIS_YARN_ENFORCE_MCP_AUTHZ
              value: "true"
          envFrom:
            - secretRef:
                name: provider-api-keys
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
