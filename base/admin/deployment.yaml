apiVersion: apps/v1
kind: Deployment
metadata:
  name: synesis-admin
  labels:
    app.kubernetes.io/name: synesis-admin
    app.kubernetes.io/component: admin
    app.kubernetes.io/part-of: synesis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synesis-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synesis-admin
        app.kubernetes.io/component: admin
        app.kubernetes.io/part-of: synesis
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          image: synesis-admin:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: SYNESIS_LOG_LEVEL
              value: "info"
            - name: SYNESIS_MILVUS_HOST
              value: "synesis-milvus.synesis-rag.svc.cluster.local"
            - name: SYNESIS_MILVUS_PORT
              value: "19530"
            - name: SYNESIS_PLANNER_URL
              value: "http://synesis-planner-ts.synesis-planner.svc.cluster.local:8080"
            - name: SYNESIS_LITELLM_URL
              value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000"
            - name: SYNESIS_LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
                  optional: true
            - name: SYNESIS_ADMIN_ASSISTANT_MODEL
              value: "synesis-general"
            - name: SYNESIS_MCP_URL
              value: "http://synesis-mcp.synesis-planner.svc.cluster.local:8100"
            - name: SYNESIS_QUALITY_REPORT_PATH
              value: "/data/quality/corpus_audit_report.json"
            - name: SYNESIS_CURATOR_PROPOSALS_PATH
              value: "/data/quality/proposed_sources.yaml"
            - name: SYNESIS_MODELS_YAML_PATH
              value: "/etc/synesis/models.yaml"
            - name: SYNESIS_TAXONOMY_YAML_PATH
              value: "/etc/synesis/taxonomy_prompt_config.yaml"
            # Placeholder password — CloudNativePG stores the real password in secret
            # synesis-admin-db-app. scripts/deploy.sh (ensure_admin_db) patches this URL after apply.
            # DB URL sourced from Secret (deploy.sh creates synesis-admin-db-url
            # from the CNPG operator password). Immune to kustomize resets.
            - name: SYNESIS_ADMIN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: synesis-admin-db-url
                  key: admin-url
                  optional: true
            - name: SYNESIS_JWT_SECRET
              value: "synesis-dev-secret-change-me"
            # ── Keycloak OIDC ──
            # Must match Keycloak Route host + realm (see base/keycloak/keycloak.yaml).
            # If empty, admin falls back to legacy users admin/viewer only — a kustomize
            # re-apply would wipe deploy.sh patches, so the issuer is set in Git.
            - name: SYNESIS_KEYCLOAK_ISSUER_URL
              value: "https://synesis-auth.apps.openshiftdemo.dev/realms/synesis"
            # Empty: Keycloak tokens use aud=account, not client_id — verifying aud breaks login.
            # Binding to our OAuth client is done via the azp claim (see auth.py).
            - name: SYNESIS_KEYCLOAK_AUDIENCE
              value: ""
            - name: SYNESIS_KEYCLOAK_EXPECTED_AZP
              value: "synesis-admin"
            # Token exchange from the admin pod (avoids hairpin / egress issues to the public Route).
            # JWT issuer in tokens stays the public URL; only the token HTTP call uses this.
            - name: SYNESIS_KEYCLOAK_INTERNAL_ISSUER_URL
              value: "http://synesis-keycloak-service.synesis-auth.svc.cluster.local:8080/realms/synesis"
            - name: SYNESIS_EXPECTED_SCHEMA_VERSION
              value: "12"
            - name: SYNESIS_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: synesis-internal-service-auth
                  key: token
                  optional: true
            # ── Planner-TS / Yarn-TS telemetry scraping URLs ──
            - name: SYNESIS_PLANNER_TS_URL
              value: "http://synesis-planner-ts.synesis-planner.svc.cluster.local:8080"
            - name: SYNESIS_YARN_TS_URL
              value: "http://synesis-yarn.synesis-yarn.svc.cluster.local:8000"
            # ── OpenFGA authorization (required) ──
            - name: SYNESIS_OPENFGA_API_URL
              value: "http://openfga.synesis-authz.svc.cluster.local:8080"
            - name: SYNESIS_OPENFGA_STORE_ID
              valueFrom:
                secretKeyRef:
                  name: openfga-client-config
                  key: store-id
            - name: SYNESIS_OPENFGA_MODEL_ID
              valueFrom:
                secretKeyRef:
                  name: openfga-client-config
                  key: model-id
                  optional: true
            - name: SYNESIS_OPENFGA_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openfga-client-config
                  key: auth-token
            # Keep OpenAPI/docs disabled by default on public deployments.
            - name: SYNESIS_ENABLE_OPENAPI
              value: "false"
          volumeMounts:
            - name: quality-data
              mountPath: /data/quality
              readOnly: true
            - name: models-config
              mountPath: /etc/synesis/models.yaml
              subPath: models.yaml
              readOnly: true
            - name: taxonomy-config
              mountPath: /etc/synesis/taxonomy_prompt_config.yaml
              subPath: taxonomy_prompt_config.yaml
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Migrations run before uvicorn binds; without startupProbe, liveness can kill the pod
          # while alembic is still running (no listener on :8080).
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: quality-data
          configMap:
            name: quality-report
            optional: true
        - name: models-config
          configMap:
            name: synesis-models-config
            optional: true
        - name: taxonomy-config
          configMap:
            name: synesis-taxonomy-config
            optional: true
