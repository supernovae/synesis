# RBAC: allow admin service account to manage provider-api-keys
# secret in synesis-gateway namespace. Scoped to a single secret
# by resourceNames for minimal privilege.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: synesis-admin-provider-keys
  namespace: synesis-gateway
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: admin
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["provider-api-keys"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["litellm-proxy"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: synesis-admin-provider-keys
  namespace: synesis-gateway
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: synesis-admin-provider-keys
subjects:
  - kind: ServiceAccount
    name: default
    namespace: synesis-admin
