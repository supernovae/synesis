# RBAC: allow admin service account to manage provider-api-keys
# in gateway and model runtime namespaces. Scoped to the provider secret
# and the direct model runtime deployments that must restart after key changes.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: synesis-admin-provider-keys
  namespace: synesis-gateway
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: admin
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["provider-api-keys"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: synesis-admin-provider-keys
  namespace: synesis-gateway
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: synesis-admin-provider-keys
subjects:
  - kind: ServiceAccount
    name: default
    namespace: synesis-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: synesis-admin-provider-keys
  namespace: synesis-yarn
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: admin
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["provider-api-keys"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["synesis-yarn"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: synesis-admin-provider-keys
  namespace: synesis-yarn
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: synesis-admin-provider-keys
subjects:
  - kind: ServiceAccount
    name: default
    namespace: synesis-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: synesis-admin-provider-keys
  namespace: synesis-planner
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: admin
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["provider-api-keys"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["synesis-planner-ts"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: synesis-admin-provider-keys
  namespace: synesis-planner
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: synesis-admin-provider-keys
subjects:
  - kind: ServiceAccount
    name: default
    namespace: synesis-admin
