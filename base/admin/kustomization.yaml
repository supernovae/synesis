apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: synesis-admin

labels:
  - pairs:
      app.kubernetes.io/part-of: synesis
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - rbac-gateway-secrets.yaml

# Match overlays/api so `oc apply -k base/admin` does not revert to docker.io/library/synesis-admin.
images:
  - name: synesis-admin
    newName: ghcr.io/supernovae/synesis/admin
    newTag: latest
