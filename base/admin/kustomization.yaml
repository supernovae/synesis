apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: synesis-admin

labels:
  - pairs:
      app.kubernetes.io/part-of: synesis
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml

configMapGenerator:
  - name: synesis-models-config
    files:
      - ../../models.yaml
    options:
      disableNameSuffixHash: true
  - name: synesis-taxonomy-config
    files:
      - ../planner/taxonomy_prompt_config.yaml
    options:
      disableNameSuffixHash: true
