[project]
name = "synesis-ast-mcp"
version = "0.1.0"
description = "MCP server for AST-based code outlines using tree-sitter"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "python-multipart>=0.0.26",
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[project.scripts]
synesis-ast-mcp = "app.server:main"
