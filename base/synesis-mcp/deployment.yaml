apiVersion: apps/v1
kind: Deployment
metadata:
  name: synesis-mcp
  namespace: synesis-yarn
  labels:
    app: synesis-mcp
    app.kubernetes.io/part-of: synesis-coder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synesis-mcp
  template:
    metadata:
      labels:
        app: synesis-mcp
    spec:
      containers:
        - name: synesis-mcp
          image: synesis-mcp-hosted:latest
          ports:
            - containerPort: 8100
              protocol: TCP
          env:
            - name: PORT
              value: "8100"
            - name: SYNESIS_MCP_HTTP_PATH
              value: "/mcp"
            - name: SYNESIS_PLANNER_URL
              value: "http://synesis-planner-ts.synesis-planner.svc.cluster.local:8080"
            - name: SYNESIS_MCP_AUTHZ_MODE
              value: "enforce"
            - name: SYNESIS_OPENFGA_API_URL
              value: "http://openfga.synesis-authz.svc.cluster.local:8080"
            - name: SYNESIS_OPENFGA_STORE_ID
              valueFrom:
                secretKeyRef:
                  name: openfga-client-config
                  key: store-id
            - name: SYNESIS_OPENFGA_MODEL_ID
              valueFrom:
                secretKeyRef:
                  name: openfga-client-config
                  key: model-id
            - name: SYNESIS_OPENFGA_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openfga-client-config
                  key: auth-token
            - name: SYNESIS_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: synesis-internal-service-auth
                  key: token
                  optional: true
            - name: SYNESIS_ADMIN_DB_URL
              valueFrom:
                secretKeyRef:
                  name: synesis-admin-db-url
                  key: trace-url
                  optional: true
            - name: SYNESIS_OIDC_ISSUER_URL
              value: "https://auth.kybern.dev/realms/synesis"
            - name: SYNESIS_OIDC_INTERNAL_ISSUER_URL
              value: "http://synesis-keycloak-service.synesis-auth.svc.cluster.local:8080/realms/synesis"
            - name: SYNESIS_OIDC_ALLOWED_CLIENT_IDS
              value: "synesis-harness"
            - name: SYNESIS_OIDC_REQUIRED_ROLES
              value: "synesis-user,synesis-org-admin,synesis-admin"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 30
