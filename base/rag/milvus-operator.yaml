# Milvus via Operator CRD — standalone mode
#
# Managed by the Milvus Operator (Helm-installed). The operator handles
# etcd lifecycle, PVC provisioning, Service creation, and rolling updates.
#
# Milvus v2.6 uses woodpecker WAL which requires S3 object storage.
# Segments and WAL data are stored in S3 at:
#   s3://byron-ai-d8a35264-rhoai-data/milvus/
#
# Prerequisites:
#   1. Milvus Operator installed (bootstrap.sh)
#   2. S3 secret 'milvus-s3-secret' with accesskey/secretkey in synesis-rag
#      See docs/MILVUS_SCALING.md for IAM user setup.
#   3. anyuid SCC granted to default SA in synesis-rag (bootstrap.sh)
#
# Service: The operator creates a Service named "{cr-name}-milvus".
# With CR name "synesis", the Service becomes "synesis-milvus" — matching
# existing planner/indexer config.
---
apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: synesis
  namespace: synesis-rag
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: rag
spec:
  mode: standalone
  components:
    enableRollingUpdate: true
    standalone:
      serviceType: ClusterIP
      persistence:
        enabled: true
        pvcDeletion: false
        persistentVolumeClaim:
          spec:
            storageClassName: gp3-high
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 32Gi
      # Request enough CPU for concurrent fan-out: planner runs N evidence
      # requests in parallel (pool of 4 clients per planner pod). Multiple
      # users = multiple planner pods × pool size. 2 request avoids
      # throttling under load; 4–6 limit allows bursts.
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "6"
          memory: 8Gi
  dependencies:
    etcd:
      inCluster:
        deletionPolicy: Retain
        pvcDeletion: false
        values:
          replicaCount: 1
          auth:
            rbac:
              create: false
          podSecurityContext:
            enabled: true
            fsGroup: 1001
          containerSecurityContext:
            enabled: true
            runAsUser: 1001
            runAsNonRoot: true
          persistence:
            enabled: true
            storageClass: gp3-csi
            size: 2Gi
    storage:
      external: true
      type: S3
      endpoint: s3.us-east-1.amazonaws.com:443
      secretRef: milvus-s3-secret
  config:
    minio:
      address: s3.us-east-1.amazonaws.com
      port: 443
      useSSL: true
      bucketName: byron-ai-d8a35264-rhoai-data
      rootPath: milvus
      useIAM: false
      region: us-east-1
    milvus:
      log:
        level: info
      common:
        gracefulTime: 5000
      queryCoord:
        autoBalance: true
      dataCoord:
        segment:
          maxSize: 512
      queryNode:
        grouping:
          enabled: true
          maxNQ: 1000
        maxOutputSize: 104857600  # 100MB — safety net for large BM25 scans
      proxy:
        maxTaskNum: 1024
