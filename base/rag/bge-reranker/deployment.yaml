apiVersion: apps/v1
kind: Deployment
metadata:
  name: bge-reranker
  namespace: synesis-rag
  labels:
    app.kubernetes.io/name: bge-reranker
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: reranker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bge-reranker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bge-reranker
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: reranker
    spec:
      containers:
        - name: reranker
          image: synesis-bge-reranker:latest
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: BGE_RERANKER_MODEL
              value: "BAAI/bge-reranker-v2-m3"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          # Binds immediately; model loads in background — do not use /health for liveness
          # or the old pattern (load-before-bind) will restart the pod during HF download.
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Long window for first model pull + load without failing liveness (disabled until startupProbe completes).
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 15
            failureThreshold: 80
            timeoutSeconds: 5
