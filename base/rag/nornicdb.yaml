apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nornicdb-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synesis-nornicdb
  labels:
    app.kubernetes.io/name: synesis-nornicdb
    app.kubernetes.io/component: graph-rag
  annotations:
    synesis.io/upstream-release: "https://github.com/orneryd/NornicDB/releases/tag/v1.2.3"
    synesis.io/upstream-docker-docs: "https://github.com/orneryd/NornicDB/blob/v1.2.3/docs/operations/docker.md"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synesis-nornicdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synesis-nornicdb
        app.kubernetes.io/component: graph-rag
    spec:
      containers:
        - name: nornicdb
          # Upstream v1.2.3 Docker docs list this Docker Hub namespace as the
          # public AMD64 CPU production image. Override when upstream publishes
          # a GHCR/org image.
          image: docker.io/timothyswt/nornicdb-amd64-cpu:v1.2.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: bolt
              containerPort: 7687
            - name: http
              containerPort: 7474
          env:
            - name: NORNICDB_AUTH
              valueFrom:
                secretKeyRef:
                  name: synesis-nornicdb-auth
                  key: auth
            - name: NORNICDB_RUNTIME_PROFILE
              value: "cpu-bge"
            - name: NORNICDB_SEARCH_RERANK_ENABLED
              value: "true"
            - name: NORNICDB_SEARCH_RERANK_PROVIDER
              value: "http"
            - name: NORNICDB_SEARCH_RERANK_API_URL
              value: "http://bge-reranker:8000/rerank"
            - name: NORNICDB_SEARCH_RERANK_MODEL
              value: "BAAI/bge-reranker-v2-m3"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nornicdb-data
---
apiVersion: v1
kind: Service
metadata:
  name: synesis-nornicdb
  labels:
    app.kubernetes.io/name: synesis-nornicdb
    app.kubernetes.io/component: graph-rag
spec:
  selector:
    app.kubernetes.io/name: synesis-nornicdb
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
    - name: http
      port: 7474
      targetPort: http
