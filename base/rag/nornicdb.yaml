apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nornicdb-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synesis-nornicdb
  labels:
    app.kubernetes.io/name: synesis-nornicdb
    app.kubernetes.io/component: graph-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synesis-nornicdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synesis-nornicdb
        app.kubernetes.io/component: graph-rag
    spec:
      containers:
        - name: nornicdb
          image: docker.io/timothyswt/nornicdb-amd64-cpu:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: bolt
              containerPort: 7687
            - name: http
              containerPort: 7474
          env:
            - name: NORNICDB_AUTH
              valueFrom:
                secretKeyRef:
                  name: synesis-nornicdb-auth
                  key: auth
            - name: NORNICDB_RUNTIME_PROFILE
              value: "cpu-bge"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nornicdb-data
---
apiVersion: v1
kind: Service
metadata:
  name: synesis-nornicdb
  labels:
    app.kubernetes.io/name: synesis-nornicdb
    app.kubernetes.io/component: graph-rag
spec:
  selector:
    app.kubernetes.io/name: synesis-nornicdb
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
    - name: http
      port: 7474
      targetPort: http
