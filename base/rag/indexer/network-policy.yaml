# Egress for unified indexer Jobs/CronJobs (--mode queue, staged-*, yaml).
# Without this, clusters that use namespace isolation / default-deny egress can
# block: admin API (claim/status), Content graph, embedder, optional LLM, or web fetch.
#
# Pod label must match job templates: app.kubernetes.io/name=synesis-indexer
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: synesis-indexer-egress
  namespace: synesis-rag
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: rag-indexer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: synesis-indexer
  policyTypes:
    - Egress
  egress:
    # Admin — claim, PATCH status, runs, schema-sync (requires Bearer + x-synesis-service-name)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-admin
      ports:
        - port: 8080
          protocol: TCP
    # Same namespace: NornicDB (7687), TEI embedder, preprocess, spam, keyword, etc. (8080)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-rag
      ports:
        - port: 7687
          protocol: TCP
        - port: 8080
          protocol: TCP
    # Optional gatekeeper / --enrich full via planner-ts
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-planner
      ports:
        - port: 8080
          protocol: TCP
    # Cluster DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # HTTPS/HTTP fetch handlers, S3 (staged pipeline), external APIs — any destination
    - ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
