# Epistemic Band 2: broader general-purpose grounding knowledge for
# common user verticals — health, personal finance, taxes, small business,
# travel, food safety, career guidance, and consumer protection.
#
# Reads seed-corpus-band2.json as the single source of truth.  Each entry
# in the JSON carries its own domain and tags which override the
# source-level defaults below at chunk time.
#
# This layer complements the primary epistemic corpus (seed-corpus.json)
# with wider coverage of everyday topics.  All URLs are deduplicated
# against the primary corpus; no overlap exists.

sources:

  - name: "Epistemic Band 2"
    handler: seed_corpus
    origin_type: curated
    authority: vetted
    domain: generalist
    config:
      path: seed-corpus-band2.json
      doc_id_prefix: epistemic-band2
      tags: [epistemic, band2, general-purpose, reference]
