  # --- Architecture Documents (HTML) ---
  - name: "Twelve-Factor App"
    handler: html_document
    origin_type: curated
    authority: vetted
    source_type: html
    domain: architecture
    config:
      url: "https://12factor.net/"
      tags: [twelve-factor, saas, cloud-native, best-practices, software-engineering]

  # --- Architecture Documents (Markdown from GitHub) ---
