# Unified source config: documentation (runbooks, architecture, patterns, web docs)
# Used by: synesis-indexer-docs CronJob
#
# Each source specifies handler type, authority, origin_type, domain, and
# handler-specific config. The unified indexer reads this and routes to
# the appropriate handler plugin.

sources:
  # --- Domain Runbooks (GitHub Markdown) ---
  - name: "OpenShift Runbooks"
    handler: github_markdown
    origin_type: curated
    authority: community
    source_type: markdown
    domain: openshift
    config:
      repo: "openshift/runbooks"
      branch: master
      path: "alerts"
      tags: [ocp, runbooks, alerts]

  - name: "OCS/ODF Storage SOPs"
    handler: github_markdown
    origin_type: curated
    authority: community
    source_type: markdown
    domain: openshift
    config:
      repo: "red-hat-storage/ocs-sop"
      branch: main
      path: "sop"
      tags: [ods, ocs, storage, odf]

  # --- Architecture Documents (PDF) ---
  - name: "AWS Well-Architected Framework"
    handler: pdf_document
    origin_type: curated
    authority: vetted
    source_type: pdf
    domain: architecture
    config:
      url: "https://docs.aws.amazon.com/pdfs/wellarchitected/latest/framework/wellarchitected-framework.pdf"
      tags: [cloud, architecture, architecture-review, quality-attributes, tradeoffs, reliability, security, performance, cost, sustainability]

  - name: "AWS Reliability Pillar"
    handler: pdf_document
    origin_type: curated
    authority: vetted
    source_type: pdf
    domain: architecture
    config:
      url: "https://docs.aws.amazon.com/pdfs/wellarchitected/latest/reliability-pillar/wellarchitected-reliability-pillar.pdf"
