apiVersion: batch/v1
kind: CronJob
metadata:
  name: synesis-indexer-docs
  namespace: synesis-rag
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: rag-indexer
    synesis.io/indexer-group: docs
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: synesis-indexer
            app.kubernetes.io/part-of: synesis
            synesis.io/indexer-group: docs
        spec:
          restartPolicy: OnFailure
          serviceAccountName: default
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: indexer
              image: synesis-indexer:latest
              args:
                - --sources
                - /data/sources.yaml
              env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: synesis-github-token
                      key: token
                      optional: true
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              volumeMounts:
                - name: sources
                  mountPath: /data/sources.yaml
                  subPath: sources.yaml
                  readOnly: true
          volumes:
            - name: sources
              configMap:
                name: synesis-indexer-docs-sources
