# Default crawl policy for the Synesis content gate.
#
# These settings control both page-level and chunk-level quality filtering.
# Handlers and sources can override individual values.
#
# All phrase lists are case-insensitive substring matches.
# Path signals are matched anywhere in the URL path.

# ─── Page-Level Settings (Layer 1 — web fetchers only) ───────────────

max_depth: 2
min_page_quality: 0.35
follow_threshold: 0.45
allow_blog: false

# Leave empty to allow any host; populate to restrict.
allowed_hosts: []
allowed_prefixes: []
blocked_prefixes: []

allow_path_signals:
  - "/docs/"
  - "/documentation/"
  - "/guide/"
  - "/guides/"
  - "/manual/"
  - "/reference/"
  - "/api/"
  - "/spec/"
  - "/tutorial/"
  - "/learn/"
  - "/architecture/"
  - "/framework/"
  - "/book/"
  - "/resources/"
  - "/how-to/"
  - "/concepts/"
  - "/overview/"
  - "/getting-started/"
  - "/quickstart/"
  - "/best-practices/"
  - "/patterns/"

block_path_signals:
  - "/about"
  - "/contact"
  - "/careers"
  - "/jobs"
  - "/team"
  - "/company"
  - "/press"
  - "/events"
  - "/community"
  - "/forums"
  - "/login"
  - "/signup"
  - "/pricing"
  - "/partners"
  - "/newsletter"
  - "/privacy"
  - "/terms"
  - "/legal"
  - "/cookies"
  - "/support/tickets"
  - "/blog"
  - "/news"
  - "/case-study"
  - "/case-studies"
  - "/webinar"
  - "/demo"
  - "/trial"
  - "/subscribe"
  - "/unsubscribe"
  - "/account"
  - "/settings"
  - "/profile"
  - "/cart"
  - "/checkout"
  - "/shop"
  - "/store"

blocked_extensions:
  - ".png"
  - ".jpg"
  - ".jpeg"
  - ".gif"
  - ".svg"
  - ".ico"
  - ".webp"
  - ".bmp"
  - ".css"
  - ".js"
  - ".mjs"
  - ".woff"
  - ".woff2"
  - ".ttf"
  - ".eot"
  - ".otf"
  - ".zip"
  - ".tar"
  - ".gz"
  - ".rar"
  - ".exe"
  - ".dmg"
  - ".mp3"
  - ".mp4"
  - ".avi"
  - ".mov"
  - ".webm"
  - ".xml"
  - ".rss"
  - ".atom"

# ─── Chunk-Level Settings (Layer 2 — ALL handlers) ───────────────────

min_chunk_quality: 0.25
min_chunk_words: 30

