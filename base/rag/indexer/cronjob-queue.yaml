apiVersion: batch/v1
kind: CronJob
metadata:
  name: synesis-indexer-queue
  namespace: synesis-rag
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: rag-indexer
    synesis.io/indexer-group: queue
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: synesis-indexer
            app.kubernetes.io/part-of: synesis
            synesis.io/indexer-group: queue
        spec:
          restartPolicy: OnFailure
          serviceAccountName: default
          containers:
            - name: indexer
              image: synesis-indexer:latest
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                    - ALL
              args:
                - --mode
                - queue
              env:
                - name: SYNESIS_ADMIN_URL
                  value: "http://synesis-admin.synesis-admin.svc.cluster.local:8000"
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: synesis-github-token
                      key: token
                      optional: true
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: synesis-hf-token
                      key: HF_TOKEN
                      optional: true
              resources:
                requests:
                  cpu: "1"
                  memory: 3Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
