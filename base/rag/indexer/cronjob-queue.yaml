apiVersion: batch/v1
kind: CronJob
metadata:
  name: synesis-indexer-queue
  namespace: synesis-rag
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: rag-indexer
    synesis.io/indexer-group: queue
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: synesis-indexer
            app.kubernetes.io/part-of: synesis
            synesis.io/indexer-group: queue
        spec:
          restartPolicy: OnFailure
          serviceAccountName: default
          containers:
            - name: indexer
              # Resolved by Kustomize (overlays/jobs*). Do not oc apply this file alone.
              image: synesis-indexer:latest
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                    - ALL
              args:
                - --mode
                - queue
              env:
                # Optional claim filters (see admin POST /api/v1/ingestion/items/claim):
                #   SYNESIS_INDEXER_QUEUE_DOMAIN — e.g. go (matches ingestion_items.domain)
                #   SYNESIS_INDEXER_QUEUE_TAG — tag must appear in items.tags[]
                #   SYNESIS_INDEXER_QUEUE_MAX_ITEMS — stop after N successful claims (testing / batch caps)
                - name: SYNESIS_ADMIN_URL
                  value: "http://synesis-admin.synesis-admin.svc.cluster.local:8080"
                - name: SYNESIS_ADMIN_SERVICE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: synesis-internal-service-auth
                      key: token
                      optional: true
                # Optional semantic gatekeeper (OpenAI-compatible). See docs/INDEXERS.md
                # - name: SYNESIS_INDEXER_GATEKEEPER_ENABLE
                #   value: "true"
                # - name: SYNESIS_INDEXER_GATEKEEPER_URL
                #   value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
                # - name: SYNESIS_INDEXER_GATEKEEPER_MODEL
                #   value: "synesis-general"
                # - name: SYNESIS_INDEXER_GATEKEEPER_API_KEY
                #   valueFrom:
                #     secretKeyRef:
                #       name: litellm-secrets
                #       key: master-key
                #       optional: true
                # Preprocess (simhash; optional jusText clean for html_document) — see docs/INDEXERS.md
                # - name: SYNESIS_INDEXER_PREPROCESS_URL
                #   value: "http://preprocess-service.synesis-rag.svc.cluster.local:8080/v1"
                # - name: SYNESIS_INDEXER_PREPROCESS_CLEAN_HTML
                #   value: "true"
                # Spam classifier (DistilBERT microservice)
                # - name: SYNESIS_INDEXER_SPAM_URL
                #   value: "http://spam-service.synesis-rag.svc.cluster.local:8080/v1"
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: synesis-github-token
                      key: token
                      optional: true
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: synesis-hf-token
                      key: HF_TOKEN
                      optional: true
              resources:
                requests:
                  cpu: "1"
                  memory: 3Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
