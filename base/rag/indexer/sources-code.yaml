# Unified source config: code repositories (tree-sitter AST chunking)
# Used by: synesis-indexer-code CronJob

sources:
  # --- Python ---
  - name: "FastAPI Source"
    handler: github_code
    origin_type: external
    authority: external
    source_type: code
    domain: python
    config:
      repo: "tiangolo/fastapi"
      language: python
      paths: ["fastapi/"]
      tags: [python, web, async]

  - name: "Django Source"
    handler: github_code
    origin_type: external
    authority: external
    source_type: code
    domain: python
    config:
      repo: "django/django"
      language: python
      paths: ["django/"]
      tags: [python, web, orm]

  - name: "Requests Source"
