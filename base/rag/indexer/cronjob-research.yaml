apiVersion: batch/v1
kind: CronJob
metadata:
  name: synesis-indexer-research
  namespace: synesis-rag
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: rag-indexer
    synesis.io/indexer-group: research
spec:
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: synesis-indexer
            app.kubernetes.io/part-of: synesis
            synesis.io/indexer-group: research
        spec:
          restartPolicy: OnFailure
          serviceAccountName: default
          containers:
            - name: indexer
              image: synesis-indexer:latest
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                    - ALL
              args:
                - --sources
                - /data/sources.yaml
              env:
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: synesis-hf-token
                      key: HF_TOKEN
                      optional: true
              resources:
                requests:
                  cpu: "1"
                  memory: 3Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
              volumeMounts:
                - name: sources
                  mountPath: /data/sources.yaml
                  subPath: sources.yaml
                  readOnly: true
          volumes:
            - name: sources
              configMap:
                name: synesis-indexer-research-sources
