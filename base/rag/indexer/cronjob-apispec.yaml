apiVersion: batch/v1
kind: CronJob
metadata:
  name: synesis-indexer-apispec
  namespace: synesis-rag
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: rag-indexer
    synesis.io/indexer-group: apispec
spec:
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: synesis-indexer
            app.kubernetes.io/part-of: synesis
            synesis.io/indexer-group: apispec
        spec:
          restartPolicy: OnFailure
          serviceAccountName: default
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: indexer
              image: synesis-indexer:latest
              args:
                - --sources
                - /data/sources.yaml
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
              volumeMounts:
                - name: sources
                  mountPath: /data/sources.yaml
                  subPath: sources.yaml
                  readOnly: true
          volumes:
            - name: sources
              configMap:
                name: synesis-indexer-apispec-sources
