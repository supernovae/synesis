apiVersion: apps/v1
kind: Deployment
metadata:
  name: spam-service
  namespace: synesis-rag
  labels:
    app.kubernetes.io/name: spam-service
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spam-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spam-service
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: rag
    spec:
      containers:
        - name: spam-service
          image: ghcr.io/supernovae/synesis/spam-service:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPAM_MODEL
              value: "mariagrandury/distilbert-base-uncased-finetuned-sms-spam-detection"
            # HF Hub revision (git ref / tag); pin to a commit in production if required.
            - name: SPAM_MODEL_REVISION
              value: "main"
            - name: HF_HOME
              value: "/tmp/hf_home"
            - name: TRANSFORMERS_CACHE
              value: "/tmp/hf_home"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: synesis-hf-token
                  key: HF_TOKEN
                  optional: true
            - name: OMP_NUM_THREADS
              value: "6"
            - name: MKL_NUM_THREADS
              value: "6"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "6"
              memory: 4Gi
          # Model download + load runs in FastAPI lifespan before the server listens.
          # Without startupProbe, liveness fails (connection refused) and kubelet kills
          # the container long before HF weights finish loading.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
