apiVersion: apps/v1
kind: Deployment
metadata:
  name: bm25-service
  namespace: synesis-rag
  labels:
    app.kubernetes.io/name: bm25-service
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bm25-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bm25-service
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: rag
    spec:
      containers:
        - name: bm25-service
          image: ghcr.io/supernovae/synesis/bm25-service:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MILVUS_URI
              value: "http://synesis-milvus.synesis-rag.svc.cluster.local:19530"
            - name: BM25_REFRESH_INTERVAL_SECONDS
              value: "1800"
            - name: BM25_DEFAULT_COLLECTION
              value: "synesis_catalog"
            - name: MILVUS_TIMEOUT
              value: "30"
          resources:
            requests:
              cpu: "500m"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
