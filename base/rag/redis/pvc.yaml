apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synesis-redis-data
  namespace: synesis-rag
  labels:
    app.kubernetes.io/name: synesis-redis
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: shared-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 2Gi
