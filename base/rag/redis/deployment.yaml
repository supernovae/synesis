apiVersion: apps/v1
kind: Deployment
metadata:
  name: synesis-redis
  namespace: synesis-rag
  labels:
    app.kubernetes.io/name: synesis-redis
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: shared-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synesis-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synesis-redis
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: shared-cache
    spec:
      containers:
        - name: redis
          image: redis/redis-stack-server:7.4.0-v2
          env:
            - name: REDIS_ARGS
              value: "--appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy allkeys-lru"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
