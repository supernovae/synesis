language: python
doc_language: en
supported_doc_languages:
  - en
domain: python
pack_id: python-latest
repo: github.com/python/cpython
tag_strategy: latest_stable_python_semver
prompt_id: python_314_agentic_architect_v1
prompt_variable: "{{DOC_OR_SOURCE_CHUNK}}"
prompts:
  - id: python_314_agentic_architect_v1
    path: prompts/python_314_agentic_architect_v1.md
  - id: python_async_architect_v1
    path: prompts/python_async_architect_v1.md
  - id: python_packaging_env_architect_v1
    path: prompts/python_packaging_env_architect_v1.md
  - id: python_typing_architect_v1
    path: prompts/python_typing_architect_v1.md
  - id: python_repo_architect_v1
    path: prompts/python_repo_architect_v1.md
  - id: python_web_flask_architect_v1
    path: prompts/python_web_flask_architect_v1.md
  - id: python_ml_pytorch_architect_v1
    path: prompts/python_ml_pytorch_architect_v1.md
  - id: python_data_science_architect_v1
    path: prompts/python_data_science_architect_v1.md
include:
  stdlib:
    - Lib
  repo_map_paths:
    - Lib
  docs:
    - Doc
  aux_sources:
    - name: peps
      repo: github.com/python/peps
      path: .
      artifact_kind: pep
      package_name: peps
      prompt_id: python_314_agentic_architect_v1
    - name: packaging.python.org
      repo: github.com/pypa/packaging.python.org
      path: source
      artifact_kind: packaging_spec
      package_name: packaging
      prompt_id: python_packaging_env_architect_v1
    - name: uv
      repo: github.com/astral-sh/uv
      path: docs
      artifact_kind: tool_docs
      package_name: uv
      prompt_id: python_packaging_env_architect_v1
    - name: pixi
      repo: github.com/prefix-dev/pixi
      path: docs
      artifact_kind: tool_docs
      package_name: pixi
      prompt_id: python_packaging_env_architect_v1
    - name: typeshed
      repo: github.com/python/typeshed
      path: stdlib
      artifact_kind: type_stub
      package_name: typeshed
      prompt_id: python_typing_architect_v1
    - name: flask
      repo: github.com/pallets/flask
      path: docs
      artifact_kind: web_framework_docs
      package_name: flask
      prompt_id: python_web_flask_architect_v1
    - name: werkzeug
      repo: github.com/pallets/werkzeug
      path: docs
      artifact_kind: web_framework_docs
      package_name: werkzeug
      prompt_id: python_web_flask_architect_v1
    - name: jinja
      repo: github.com/pallets/jinja
      path: docs
      artifact_kind: web_framework_docs
      package_name: jinja2
      prompt_id: python_web_flask_architect_v1
    - name: click
      repo: github.com/pallets/click
      path: docs
      artifact_kind: web_framework_docs
      package_name: click
      prompt_id: python_web_flask_architect_v1
    - name: pytorch
      repo: github.com/pytorch/pytorch
      path: docs/source
      artifact_kind: ml_framework_docs
      package_name: torch
      prompt_id: python_ml_pytorch_architect_v1
    - name: pytorch-tutorials
      repo: github.com/pytorch/tutorials
      path: .
      artifact_kind: ml_tutorial
      package_name: torch
      prompt_id: python_ml_pytorch_architect_v1
    - name: numpy
      repo: github.com/numpy/numpy
      path: doc/source
      artifact_kind: data_science_docs
      package_name: numpy
      prompt_id: python_data_science_architect_v1
    - name: pandas
      repo: github.com/pandas-dev/pandas
      path: doc/source
      artifact_kind: data_science_docs
      package_name: pandas
      prompt_id: python_data_science_architect_v1
    - name: scipy
      repo: github.com/scipy/scipy
      path: doc/source
      artifact_kind: data_science_docs
      package_name: scipy
      prompt_id: python_data_science_architect_v1
    - name: scikit-learn
      repo: github.com/scikit-learn/scikit-learn
      path: doc
      artifact_kind: data_science_docs
      package_name: sklearn
      prompt_id: python_data_science_architect_v1
    - name: jupyterlab
      repo: github.com/jupyterlab/jupyterlab
      path: docs
      artifact_kind: notebook_docs
      package_name: jupyterlab
      prompt_id: python_data_science_architect_v1
