apiVersion: batch/v1
kind: Job
metadata:
  generateName: testing-labs-replay-
  namespace: synesis-validation
  labels:
    app.kubernetes.io/part-of: synesis
    synesis-component: validation-runner
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        synesis-component: validation-runner
    spec:
      serviceAccountName: validation-runner
      restartPolicy: Never
      containers:
        - name: replay
          image: registry.access.redhat.com/ubi9/python-311:latest
          command:
            - /bin/bash
            - -c
            - |
              pip install --quiet httpx pyyaml &&
              python /app/replay_runner.py \
                --run-id "$(RUN_ID)" \
                --planner-url "$(PLANNER_URL)" \
                --admin-url "$(ADMIN_URL)" \
                --api-key "$(API_KEY)"
          env:
            - name: RUN_ID
              value: ""
            - name: PLANNER_URL
              value: "http://synesis-planner-ts.synesis-planner.svc.cluster.local:8080"
            - name: ADMIN_URL
              value: "http://synesis-admin.synesis-admin.svc.cluster.local:8080"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: synesis-internal-service-auth
                  key: token
                  optional: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: runner-scripts
              mountPath: /app
      volumes:
        - name: runner-scripts
          configMap:
            name: testing-labs-runner
