apiVersion: batch/v1
kind: CronJob
metadata:
  name: synesis-quality-runner
  labels:
    app.kubernetes.io/name: quality-runner
    app.kubernetes.io/component: quality
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: quality-runner
        spec:
          restartPolicy: Never
          containers:
            - name: runner
              image: quality-runner:latest
              command: ["python", "entrypoint.py"]
              env:
                - name: SYNESIS_NORNIC_URI
                  value: "bolt://synesis-nornicdb.synesis-rag.svc.cluster.local:7687"
                - name: SYNESIS_NORNIC_USER
                  valueFrom:
                    secretKeyRef:
                      name: synesis-nornicdb-auth
                      key: username
                - name: SYNESIS_NORNIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: synesis-nornicdb-auth
                      key: password
                - name: SYNESIS_NORNIC_DATABASE
                  value: "nornic"
                - name: SYNESIS_NORNIC_VECTOR_INDEX
                  value: "embeddings"
                - name: SYNESIS_ADMIN_API_URL
                  value: "http://synesis-admin.synesis-admin.svc.cluster.local:8080"
                - name: SYNESIS_LLM_URL
                  value: "http://synesis-planner-ts.synesis-planner.svc.cluster.local:8080/v1"
                - name: SYNESIS_LLM_MODEL
                  value: "synesis-general"
                - name: SYNESIS_TAXONOMY_PATH
                  value: "/app/taxonomy_prompt_config.yaml"
                - name: SYNESIS_RUN_CURATOR
                  value: "false"
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
