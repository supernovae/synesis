apiVersion: batch/v1
kind: CronJob
metadata:
  name: quality-audit
  labels:
    app.kubernetes.io/name: quality-audit
    app.kubernetes.io/component: quality
    app.kubernetes.io/part-of: synesis
spec:
  schedule: "0 2 * * 0"  # Sunday 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: quality-audit
            app.kubernetes.io/component: quality
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: quality-runner
              image: quality-runner:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "=== Corpus Audit ==="
                  python benchmarks/corpus/audit_corpus.py \
                    --milvus-uri "$MILVUS_URI" \
                    --embedder-url "$EMBEDDER_URL" \
                    --taxonomy taxonomy_prompt_config.yaml \
                    --output /results/corpus_audit_report.json

                  echo "=== Curator Agent ==="
                  python tools/curator/curator_agent.py \
                    --audit-report /results/corpus_audit_report.json \
                    --taxonomy taxonomy_prompt_config.yaml \
                    --llm-url "$LLM_URL" \
                    --searxng-url "$SEARXNG_URL" \
                    --max-domains 10 \
                    --output /results/proposed_sources.yaml

                  echo "=== Done ==="
              env:
                - name: MILVUS_URI
                  value: "http://synesis-milvus.synesis-rag.svc.cluster.local:19530"
                - name: EMBEDDER_URL
                  value: "http://embedder.synesis-rag.svc.cluster.local:8080/v1"
                - name: LLM_URL
                  value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
                - name: SEARXNG_URL
                  value: "http://searxng.synesis-search.svc.cluster.local:8080"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: results
                  mountPath: /results
          volumes:
            - name: results
              emptyDir: {}
