apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: warm-pool-allow-yarn
  namespace: synesis-sandbox
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: sandbox
spec:
  podSelector:
    matchLabels:
      synesis-component: warm-pool
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-yarn
      ports:
        - protocol: TCP
          port: 8080
