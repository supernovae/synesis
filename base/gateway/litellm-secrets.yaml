# LiteLLM master key — self-generated passphrase for proxy auth (not a vendor license).
#
# NOT listed in kustomization.yaml: applying this manifest on every deploy
# reset the cluster secret to a placeholder and broke idempotent deploys.
#
# Created/updated by: ./scripts/deploy.sh (ensure_litellm_key)
# Manual:  oc create secret generic litellm-secrets -n synesis-gateway \
#            --from-literal=master-key="$(openssl rand -hex 32)" \
#            --dry-run=client -o yaml | oc apply -f -
#
# API mode: deployment omits LITELLM_MASTER_KEY env; secret still holds the
# shared key used to sync webui-api-key (Open WebUI → backend auth).
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: synesis-gateway
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  # SECURITY: Replace with a strong key in your overlay (openssl rand -hex 32)
  master-key: "sk-synesis-change-me"
