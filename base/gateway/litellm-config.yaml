apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: synesis-gateway
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: gateway
data:
  config.yaml: |
    # Synesis service entrypoints.
    # Provider-backed role aliases are managed by Synesis Admin Model Registry
    # and reconciled into LiteLLM from the Admin DB.
    model_list:
      - model_name: Synesis
        litellm_params:
          model: openai/Synesis
          api_base: http://synesis-planner-ts.synesis-planner.svc.cluster.local:8080/v1
          api_key: "not-needed"
          max_tokens: 32768
          temperature: 0.2

      - model_name: synesis-yarn
        litellm_params:
          model: openai/synesis-yarn
          api_base: http://synesis-yarn.synesis-yarn.svc.cluster.local:8000/v1
          api_key: "not-needed"
          max_tokens: 32768
          temperature: 0.2

      - model_name: Synesis Coder
        litellm_params:
          model: openai/synesis-yarn
          api_base: http://synesis-yarn.synesis-yarn.svc.cluster.local:8000/v1
          api_key: "not-needed"
          max_tokens: 32768
          temperature: 0.2

    litellm_settings:
      drop_params: true
      set_verbose: false
      num_retries: 2
      request_timeout: 300

    general_settings:
      master_key: "sk-synesis-change-me"
      # Do not forward inbound Authorization headers to upstream providers.
      forward_client_headers_to_llm_api: false
      background_health_checks: false
      allow_user_auth: true
