# Synesis LiteLLM Helm values — legacy service-entrypoint fallback override.
#
# Provider-backed role routes are intentionally not defined here. Synesis Admin
# seeds default ModelDeployment rows and reconciles role aliases from the Admin
# DB, so changing providers/models does not require Helm.
#
# Usage (chart version must match SYNESIS_LITELLM_CHART_VERSION in deploy.sh):
#   helm upgrade --install litellm-proxy oci://ghcr.io/berriai/litellm-helm \
#     --version 1.82.3-stable.patch.2 \
#     -n synesis-gateway \
#     -f values-synesis.yaml \
#     -f values-synesis-static.yaml \
#     --wait --timeout 5m
#
envVars:
  STORE_MODEL_IN_DB: "true"
  LITELLM_NON_ROOT: "true"
  NO_PROXY: "localhost,127.0.0.1,10.0.0.0/8,.svc,.cluster.local"
  no_proxy: "localhost,127.0.0.1,10.0.0.0/8,.svc,.cluster.local"

proxy_config:
  model_list:
    - model_name: Synesis
      litellm_params:
        model: openai/Synesis
        api_base: http://synesis-planner-ts.synesis-planner.svc.cluster.local:8080/v1
        api_key: "os.environ/SYNESIS_INTERNAL_SERVICE_TOKEN"
        max_tokens: 65536
        temperature: 0.2

    - model_name: Synesis Coder
      litellm_params:
        model: openai/synesis-yarn
        api_base: http://synesis-yarn.synesis-yarn.svc.cluster.local:8000/v1
        api_key: "os.environ/SYNESIS_INTERNAL_SERVICE_TOKEN"
        max_tokens: 32768
        temperature: 0.2

    - model_name: synesis-yarn
      litellm_params:
        model: openai/synesis-yarn
        api_base: http://synesis-yarn.synesis-yarn.svc.cluster.local:8000/v1
        api_key: "os.environ/SYNESIS_INTERNAL_SERVICE_TOKEN"
        max_tokens: 32768
        temperature: 0.2

  litellm_settings:
    drop_params: true
    set_verbose: false
    num_retries: 2
    request_timeout: 300
    callbacks: synesis_callbacks.proxy_handler_instance

  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    # Do not forward inbound Authorization headers to upstream providers.
    forward_client_headers_to_llm_api: false
    background_health_checks: false
    database_connection_pool_limit: 10
    database_connection_timeout: 60
    allow_requests_on_db_unavailable: true
