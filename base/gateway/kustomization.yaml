apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: synesis-gateway

labels:
  - pairs:
      app.kubernetes.io/part-of: synesis
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  # LiteLLM (Deployment, Service, ConfigMap, Route) is now managed by the
  # official Helm chart — see base/gateway/helm/values-synesis.yaml.
  # deploy.sh calls `helm upgrade --install` for the litellm-proxy release.
  #
  # Secrets (litellm-secrets, provider-api-keys, litellm-db-credentials) are
  # managed by deploy.sh, not checked into kustomize.
