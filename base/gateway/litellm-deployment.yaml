# LiteLLM proxy — pinned release image (not :main-stable).
#
# Production DB: use a dedicated PostgreSQL *database* for Prisma (e.g. `litellm` on the
# same CNPG cluster as admin). Do not point DATABASE_URL at `synesis_admin` (Alembic owns it).
# scripts/deploy.sh creates `litellm` and patches DATABASE_URL when the operator secret exists.
#
# OpenShift: non-root + read-only root requires writable emptyDirs (migrations, cache, tmp).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: synesis-gateway
  labels:
    app.kubernetes.io/name: litellm-proxy
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-proxy
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: litellm
          # Pinned stable proxy image — bump intentionally when upgrading LiteLLM.
          image: ghcr.io/berriai/litellm:v1.82.3-stable
          securityContext:
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem breaks Prisma's query-engine startup on this image
            # (NotConnectedError after migrate) and UI population under /var/lib/litellm.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
            - --config
            - /app/config.yaml
            - --port
            - "4000"
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - secretRef:
                name: provider-api-keys
                optional: true
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
            - name: DATABASE_URL
              value: ""
            - name: LITELLM_NON_ROOT
              value: "true"
            # Writable mount — Prisma baseline / migrations (OpenShift no local write on root FS).
            - name: LITELLM_MIGRATION_DIR
              value: "/app/migrations"
            # Prisma/npm cache under the emptyDir-backed HOME.
            - name: HOME
              value: "/.cache"
            - name: NPM_CONFIG_CACHE
              value: "/.cache/npm"
            # Prisma query engine localhost traffic must not use cluster HTTP proxy.
            - name: NO_PROXY
              value: "localhost,127.0.0.1,10.0.0.0/8,.svc,.cluster.local"
            - name: no_proxy
              value: "localhost,127.0.0.1,10.0.0.0/8,.svc,.cluster.local"
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: litellm-migrations
              mountPath: /app/migrations
            - name: prisma-cache
              mountPath: /.cache
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: litellm-migrations
          emptyDir: {}
        - name: prisma-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}