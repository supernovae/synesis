# LiteLLM proxy — production-hardened for OpenShift + Prisma/Postgres.
#
# DB: dedicated PostgreSQL database `litellm` on the CNPG cluster (not synesis_admin).
# deploy.sh creates the DB, syncs DATABASE_URL secret, and generates LITELLM_SALT_KEY.
#
# Prisma: USE_PRISMA_MIGRATE runs schema migrations at startup. Writable emptyDir
# volumes satisfy the read-only-root-compatible paths documented by LiteLLM.
# initContainer copies bundled UI/assets into emptyDir so readOnlyRootFilesystem works.
#
# Workers: --num_workers matches CPU limit (2 during test phase).
# Connection pool: general_settings in ConfigMap; total conns = pool_limit * workers * replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: synesis-gateway
  labels:
    app.kubernetes.io/name: litellm-proxy
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-proxy
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: setup-ui
          image: ghcr.io/berriai/litellm:main-stable
          command:
            - sh
            - -c
            - |
              cp -r /var/lib/litellm/ui/* /mnt/ui/ 2>/dev/null || true
              cp -r /var/lib/litellm/assets/* /mnt/assets/ 2>/dev/null || true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: litellm-ui
              mountPath: /mnt/ui
            - name: litellm-assets
              mountPath: /mnt/assets
        - name: fetch-prisma-engine
          image: ghcr.io/berriai/litellm:main-stable
          command:
            - sh
            - -c
            - |
              prisma py fetch 2>&1 || true
              SRC=$(find /mnt/cache/prisma-python -name "query-engine-debian-openssl-*" -type f 2>/dev/null | head -1)
              if [ -n "$SRC" ]; then
                cp "$SRC" /mnt/cache/prisma-python/prisma-query-engine-debian-openssl-3.0.x
                chmod +x /mnt/cache/prisma-python/prisma-query-engine-debian-openssl-3.0.x
                echo "Prisma query engine ready at /mnt/cache/prisma-python/prisma-query-engine-debian-openssl-3.0.x"
              else
                echo "WARNING: Prisma query engine binary not found; migrations will download it"
              fi
          env:
            - name: PRISMA_BINARY_CACHE_DIR
              value: "/mnt/cache/prisma-python"
            - name: HOME
              value: "/mnt/cache"
            - name: XDG_CACHE_HOME
              value: "/mnt/cache"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: litellm-cache
              mountPath: /mnt/cache
            - name: tmp
              mountPath: /tmp
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
            - --config
            - /app/config.yaml
            - --port
            - "4000"
            - --num_workers
            - "2"
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - secretRef:
                name: provider-api-keys
                optional: true
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-database-url
                  key: database-url
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: salt-key
                  optional: true
            - name: LITELLM_NON_ROOT
              value: "true"
            - name: USE_PRISMA_MIGRATE
              value: "True"
            - name: DISABLE_PRISMA_HEALTH_CHECK_ON_STARTUP
              value: "true"
            - name: LITELLM_UI_PATH
              value: "/app/var/litellm/ui"
            - name: LITELLM_ASSETS_PATH
              value: "/app/var/litellm/assets"
            - name: LITELLM_MIGRATION_DIR
              value: "/app/migrations"
            - name: HOME
              value: "/app/cache"
            - name: XDG_CACHE_HOME
              value: "/app/cache"
            - name: NPM_CONFIG_CACHE
              value: "/app/cache/npm"
            - name: PRISMA_BINARY_CACHE_DIR
              value: "/app/cache/prisma-python"
            - name: PRISMA_QUERY_ENGINE_BINARY
              value: "/app/cache/prisma-python/prisma-query-engine-debian-openssl-3.0.x"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,10.0.0.0/8,.svc,.cluster.local"
            - name: no_proxy
              value: "localhost,127.0.0.1,10.0.0.0/8,.svc,.cluster.local"
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: litellm-migrations
              mountPath: /app/migrations
            - name: litellm-cache
              mountPath: /app/cache
            - name: litellm-ui
              mountPath: /app/var/litellm/ui
            - name: litellm-assets
              mountPath: /app/var/litellm/assets
            - name: tmp
              mountPath: /tmp
            - name: root-home
              mountPath: /root
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            failureThreshold: 30
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: litellm-migrations
          emptyDir:
            sizeLimit: 64Mi
        - name: litellm-cache
          emptyDir:
            sizeLimit: 500Mi
        - name: litellm-ui
          emptyDir:
            sizeLimit: 100Mi
        - name: litellm-assets
          emptyDir:
            sizeLimit: 10Mi
        - name: tmp
          emptyDir: {}
        - name: root-home
          emptyDir: {}