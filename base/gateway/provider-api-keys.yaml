# Provider API keys — all LLM provider credentials in one secret.
#
# NOT listed in kustomization.yaml: applying an empty Secret would clear
# existing keys on every `oc apply`. Yarn and Planner consume synced
# copies with envFrom optional: true.
#
# Create/update via:
#   Admin UI → Providers & API keys
#   oc create secret generic provider-api-keys \
#     --from-literal=PROVIDER_API_KEY=... \
#     -n synesis-gateway --dry-run=client -o yaml | oc apply -f -
#
# Model configs reference keys by environment variable name. Helm values under
# secrets.providerApiKeys are supported only for initial bootstrap or operators
# who intentionally want provider keys reconciled by Helm.
apiVersion: v1
kind: Secret
metadata:
  name: provider-api-keys
  namespace: synesis-gateway
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: gateway
type: Opaque
