# Provider API keys — all LLM provider credentials in one secret.
#
# NOT listed in kustomization.yaml: applying an empty Secret would clear
# existing keys on every `oc apply`. LiteLLM uses envFrom with optional: true.
#
# Create/update via:
#   ./scripts/deploy.sh api   (prompts for OPENROUTER_API_KEY)
#   Admin UI → Settings → Provider Keys
#   oc create secret generic provider-api-keys \
#     --from-literal=OPENROUTER_API_KEY=sk-or-v1-... \
#     -n synesis-gateway --dry-run=client -o yaml | oc apply -f -
#
# Model configs reference keys as "os.environ/OPENROUTER_API_KEY", etc.
apiVersion: v1
kind: Secret
metadata:
  name: provider-api-keys
  namespace: synesis-gateway
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: gateway
type: Opaque
