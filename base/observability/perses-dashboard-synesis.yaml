# Synesis LLM Assistant dashboard for Cluster Observability Operator (COO) + Perses.
# Deploy with: oc apply -f base/observability/perses-dashboard-synesis.yaml
#
# Prerequisites:
# - COO installed with Perses enabled (Observe > Dashboards (Perses) in OpenShift console)
# - PersesDatasource named "prometheus-datasource" pointing to Thanos/Prometheus
#   (COO or user workload monitoring). Create in same namespace as this dashboard.
# - ServiceMonitors for synesis-planner-ts, synesis-yarn, synesis-health-monitor, synesis-gateway
#
# Metrics source: planner-ts and yarn-ts use @synesis/telemetry (packages/synesis-telemetry)
# which registers synesis_planner_* and synesis_yarn_* metrics via prom-client.
#
# Namespace: synesis-admin (same as admin UI). COO Perses must watch this namespace.
apiVersion: perses.dev/v1alpha1
kind: PersesDashboard
metadata:
  name: synesis-overview
  namespace: synesis-admin
  labels:
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: synesis
spec:
  display:
    name: Synesis - LLM Assistant Overview
    description: Planner-ts, Yarn, sandbox, and model serving metrics
  duration: 1h
  refreshInterval: 30s
  layouts:
    - kind: Grid
      spec:
        display:
          title: Planner
        items:
          - x: 0
            y: 0
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/planner-latency"
          - x: 8
            y: 0
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/planner-request-rate"
          - x: 16
            y: 0
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/planner-cache-hit"
          - x: 0
            y: 6
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/planner-tokens"
          - x: 8
            y: 6
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/planner-cost"
          - x: 16
            y: 6
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/planner-compaction"
    - kind: Grid
      spec:
        display:
          title: Yarn
        items:
          - x: 0
            y: 0
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/yarn-latency"
          - x: 8
            y: 0
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/yarn-request-rate"
          - x: 16
            y: 0
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/yarn-cache-hit"
          - x: 0
            y: 6
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/yarn-tokens"
          - x: 8
            y: 6
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/yarn-cost"
    - kind: Grid
      spec:
        display:
          title: Health & Infrastructure
        items:
          - x: 0
            y: 0
            width: 12
            height: 6
            content:
              $ref: "#/spec/panels/service-health"
          - x: 12
            y: 0
            width: 12
            height: 6
            content:
              $ref: "#/spec/panels/circuit-breaker"
    - kind: Grid
      spec:
        display:
          title: Sandbox
        items:
          - x: 0
            y: 0
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/sandbox-executions"
          - x: 8
            y: 0
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/sandbox-latency"
          - x: 16
            y: 0
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/sandbox-failures"
    - kind: Grid
      spec:
        display:
          title: Model Serving (vLLM)
        items:
          - x: 0
            y: 0
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/model-ttft"
          - x: 8
            y: 0
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/model-throughput"
          - x: 16
            y: 0
            width: 8
            height: 6
            content:
              $ref: "#/spec/panels/model-gpu-cache"
  panels:
    # ── Planner (synesis_planner_* from @synesis/telemetry) ──────────────
    planner-latency:
      kind: Panel
      spec:
        display:
          name: Planner Request Latency (p95/p50)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            unit: s
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: histogram_quantile(0.95, rate(synesis_planner_request_duration_seconds_bucket[5m]))
                  seriesNameFormat: p95
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: histogram_quantile(0.50, rate(synesis_planner_request_duration_seconds_bucket[5m]))
                  seriesNameFormat: p50
    planner-request-rate:
      kind: Panel
      spec:
        display:
          name: Planner Request Rate
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: sum(rate(synesis_planner_request_total[5m])) by (status)
                  seriesNameFormat: "{{status}}"
    planner-tokens:
      kind: Panel
      spec:
        display:
          name: Planner Token Throughput
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: sum(rate(synesis_planner_token_total[5m])) by (direction)
                  seriesNameFormat: "{{direction}} tokens/sec"
    planner-cost:
      kind: Panel
      spec:
        display:
          name: Planner Estimated Cost (USD)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: sum(rate(synesis_planner_cost_estimated_usd_total[5m])) by (model)
                  seriesNameFormat: "{{model}} $/sec"
    planner-cache-hit:
      kind: Panel
      spec:
        display:
          name: Planner Prefix Cache Hit Ratio
        plugin:
          kind: GaugeChart
          spec:
            calculation: last
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: synesis_planner_cache_hit_ratio
                  seriesNameFormat: "{{model}}"
    planner-compaction:
      kind: Panel
      spec:
        display:
          name: Planner Compaction Events
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: sum(rate(synesis_planner_compaction_total[5m])) by (type)
                  seriesNameFormat: "{{type}}"
    # ── Yarn (synesis_yarn_* from @synesis/telemetry) ────────────────────
    yarn-latency:
      kind: Panel
      spec:
        display:
          name: Yarn Request Latency (p95/p50)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            unit: s
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: histogram_quantile(0.95, rate(synesis_yarn_request_duration_seconds_bucket[5m]))
                  seriesNameFormat: p95
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: histogram_quantile(0.50, rate(synesis_yarn_request_duration_seconds_bucket[5m]))
                  seriesNameFormat: p50
    yarn-request-rate:
      kind: Panel
      spec:
        display:
          name: Yarn Request Rate
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: sum(rate(synesis_yarn_request_total[5m])) by (status)
                  seriesNameFormat: "{{status}}"
    yarn-tokens:
      kind: Panel
      spec:
        display:
          name: Yarn Token Throughput
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: sum(rate(synesis_yarn_token_total[5m])) by (direction)
                  seriesNameFormat: "{{direction}} tokens/sec"
    yarn-cost:
      kind: Panel
      spec:
        display:
          name: Yarn Estimated Cost (USD)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: sum(rate(synesis_yarn_cost_estimated_usd_total[5m])) by (model)
                  seriesNameFormat: "{{model}} $/sec"
    yarn-cache-hit:
      kind: Panel
      spec:
        display:
          name: Yarn Prefix Cache Hit Ratio
        plugin:
          kind: GaugeChart
          spec:
            calculation: last
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: synesis_yarn_cache_hit_ratio
                  seriesNameFormat: "{{model}}"
    # ── Health & Infrastructure (from health-monitor, unchanged) ─────────
    service-health:
      kind: Panel
      spec:
        display:
          name: Service Health
        plugin:
          kind: StatChart
          spec:
            calculation: last
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: synesis_service_health
                  seriesNameFormat: "{{service}}"
    circuit-breaker:
      kind: Panel
      spec:
        display:
          name: Circuit Breaker State
        plugin:
          kind: StatChart
          spec:
            calculation: last
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: synesis_circuit_breaker_state
                  seriesNameFormat: "{{service}}"
    # ── Sandbox (unchanged) ──────────────────────────────────────────────
    sandbox-executions:
      kind: Panel
      spec:
        display:
          name: Sandbox Execution Success/Failure
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: rate(synesis_sandbox_executions_total{outcome="success"}[5m])
                  seriesNameFormat: success/sec
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: rate(synesis_sandbox_executions_total{outcome="failure"}[5m])
                  seriesNameFormat: failure/sec
    sandbox-latency:
      kind: Panel
      spec:
        display:
          name: Sandbox Latency by Language (p95)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            unit: s
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: histogram_quantile(0.95, rate(synesis_sandbox_duration_seconds_bucket[5m]))
                  seriesNameFormat: "{{language}} p95"
    sandbox-failures:
      kind: Panel
      spec:
        display:
          name: Sandbox Failure Types
        plugin:
          kind: StatChart
          spec:
            calculation: last
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: sum(synesis_sandbox_failures_by_type_total) by (error_type)
                  seriesNameFormat: "{{error_type}}"
    # ── Model Serving / vLLM (unchanged) ─────────────────────────────────
    model-ttft:
      kind: Panel
      spec:
        display:
          name: "vLLM Time to First Token (p95)"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            unit: s
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: histogram_quantile(0.95, rate(vllm:time_to_first_token_seconds_bucket[5m]))
                  seriesNameFormat: "{{model_name}} p95"
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: histogram_quantile(0.50, rate(vllm:time_to_first_token_seconds_bucket[5m]))
                  seriesNameFormat: "{{model_name}} p50"
    model-throughput:
      kind: Panel
      spec:
        display:
          name: "vLLM Request Throughput"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: rate(vllm:request_success_total[5m])
                  seriesNameFormat: "{{model_name}} req/sec"
    model-gpu-cache:
      kind: Panel
      spec:
        display:
          name: "vLLM GPU KV Cache Utilization"
        plugin:
          kind: GaugeChart
          spec:
            calculation: last
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                      query: vllm:gpu_cache_usage_perc
                  seriesNameFormat: "{{model_name}}"
