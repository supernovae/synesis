apiVersion: v1
kind: ConfigMap
metadata:
  name: synesis-grafana-dashboard
  namespace: synesis-admin
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: observability
    grafana_dashboard: "1"
data:
  synesis-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Planner Request Latency (p95/p50)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(synesis_planner_request_duration_seconds_bucket[5m]))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.50, rate(synesis_planner_request_duration_seconds_bucket[5m]))",
              "legendFormat": "p50"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "title": "Planner Request Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(synesis_planner_request_total[5m])) by (status)",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "title": "Planner Token Throughput",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(synesis_planner_token_total[5m])) by (direction)",
              "legendFormat": "{{direction}} tokens/sec"
            }
          ]
        },
        {
          "title": "Planner Estimated Cost (USD)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(synesis_planner_cost_estimated_usd_total[5m])) by (model)",
              "legendFormat": "{{model}} $/sec"
            }
          ]
        },
        {
          "title": "Planner Prefix Cache Hit Ratio",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "synesis_planner_cache_hit_ratio",
              "legendFormat": "{{model}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "thresholds": {
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "orange", "value": 0.3 },
                  { "color": "green", "value": 0.6 }
                ]
              }
            }
          }
        },
        {
          "title": "Planner Compaction Events",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 16 },
          "targets": [
            {
              "expr": "sum(rate(synesis_planner_compaction_total[5m])) by (type)",
              "legendFormat": "{{type}}"
            }
          ]
        },
        {
          "title": "Service Health",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 16 },
          "targets": [
            {
              "expr": "synesis_service_health",
              "legendFormat": "{{service}}"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto"
          }
        },
        {
          "title": "Circuit Breaker State",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 20 },
          "targets": [
            {
              "expr": "synesis_circuit_breaker_state",
              "legendFormat": "{{service}}"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "options": { "0": { "text": "CLOSED" } }, "type": "value" },
                { "options": { "1": { "text": "HALF-OPEN" } }, "type": "value" },
                { "options": { "2": { "text": "OPEN" } }, "type": "value" }
              ]
            }
          }
        },
        {
          "title": "Yarn Request Latency (p95/p50)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(synesis_yarn_request_duration_seconds_bucket[5m]))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.50, rate(synesis_yarn_request_duration_seconds_bucket[5m]))",
              "legendFormat": "p50"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "title": "Yarn Request Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "targets": [
            {
              "expr": "sum(rate(synesis_yarn_request_total[5m])) by (status)",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "title": "Yarn Token Throughput",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "targets": [
            {
              "expr": "sum(rate(synesis_yarn_token_total[5m])) by (direction)",
              "legendFormat": "{{direction}} tokens/sec"
            }
          ]
        },
        {
          "title": "Yarn Estimated Cost (USD)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "targets": [
            {
              "expr": "sum(rate(synesis_yarn_cost_estimated_usd_total[5m])) by (model)",
              "legendFormat": "{{model}} $/sec"
            }
          ]
        },
        {
          "title": "Yarn Prefix Cache Hit Ratio",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 40 },
          "targets": [
            {
              "expr": "synesis_yarn_cache_hit_ratio",
              "legendFormat": "{{model}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "thresholds": {
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "orange", "value": 0.3 },
                  { "color": "green", "value": 0.6 }
                ]
              }
            }
          }
        },
        {
          "title": "Sandbox Execution Success/Failure",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 48 },
          "targets": [
            {
              "expr": "rate(synesis_sandbox_executions_total{outcome=\"success\"}[5m])",
              "legendFormat": "success/sec"
            },
            {
              "expr": "rate(synesis_sandbox_executions_total{outcome=\"failure\"}[5m])",
              "legendFormat": "failure/sec"
            }
          ]
        },
        {
          "title": "Sandbox Latency by Language (p95)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 48 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(synesis_sandbox_duration_seconds_bucket[5m]))",
              "legendFormat": "{{language}} p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "title": "Sandbox Failure Types",
          "type": "piechart",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 48 },
          "targets": [
            {
              "expr": "sum(synesis_sandbox_failures_by_type_total) by (error_type)",
              "legendFormat": "{{error_type}}"
            }
          ]
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["synesis", "llm", "safety-ii"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "title": "Synesis - LLM Assistant Overview",
      "uid": "synesis-overview"
    }
