apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: synesis-rag-alerts
  namespace: synesis-rag
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: observability
spec:
  groups:
    - name: synesis-nornicdb
      rules:
        - alert: NornicDBPodNotReady
          expr: |
            kube_pod_status_ready{namespace="synesis-rag", pod=~"synesis-nornicdb.*", condition="true"} == 0
          for: 5m
          labels:
            severity: critical
            team: synesis
          annotations:
            summary: "NornicDB pod not ready for >5 minutes"
            description: "The graph/vector database is unavailable. RAG retrieval and indexing will fail."

    - name: synesis-embedder
      rules:
        - alert: EmbedderNotReady
          expr: |
            kube_pod_status_ready{namespace="synesis-rag", pod=~"embedder.*", condition="true"} == 0
          for: 5m
          labels:
            severity: critical
            team: synesis
          annotations:
            summary: "Embedder pod not ready for >5 minutes"
            description: "The TEI embedder pod is not ready. Pack builds and explicit embedding flows will fail."
