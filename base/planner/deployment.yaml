apiVersion: apps/v1
kind: Deployment
metadata:
  name: synesis-planner
  namespace: synesis-planner
  labels:
    app.kubernetes.io/name: synesis-planner
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: planner
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: synesis-planner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synesis-planner
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: planner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: planner
          image: ghcr.io/supernovae/synesis/planner:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # Model Endpoints — all route through LiteLLM proxy → OpenRouter
            # See base/gateway/litellm-config.yaml for model mappings
            - name: SYNESIS_ROUTER_MODEL_URL
              value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
            - name: SYNESIS_ROUTER_MODEL_NAME
              value: "synesis-router"
            - name: SYNESIS_PLANNER_MODEL_URL
              value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
            - name: SYNESIS_PLANNER_MODEL_NAME
              value: "synesis-router"
            - name: SYNESIS_ADVISOR_MODEL_URL
              value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
            - name: SYNESIS_ADVISOR_MODEL_NAME
              value: "synesis-router"
            - name: SYNESIS_GENERAL_MODEL_URL
              value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
            - name: SYNESIS_GENERAL_MODEL_NAME
              value: "synesis-general"
            - name: SYNESIS_CRITIC_MODEL_URL
              value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
            - name: SYNESIS_CRITIC_MODEL_NAME
              value: "synesis-critic"
            - name: SYNESIS_SUMMARIZER_MODEL_URL
              value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
            - name: SYNESIS_SUMMARIZER_MODEL_NAME
              value: "synesis-summarizer"
            - name: SYNESIS_MILVUS_HOST
              value: "synesis-milvus.synesis-rag.svc.cluster.local"
            - name: SYNESIS_MILVUS_PORT
              value: "19530"
            - name: SYNESIS_EMBEDDER_URL
              value: "http://embedder.synesis-rag.svc.cluster.local:8080/v1"
            - name: SYNESIS_KEYWORD_SERVICE_URL
              value: "http://keyword-service.synesis-rag.svc.cluster.local:8080/v1"
            - name: SYNESIS_GLINER_SERVICE_URL
              value: "http://gliner-service.synesis-rag.svc.cluster.local:8080/v1"
            - name: SYNESIS_RAG_RETRIEVAL_STRATEGY
              value: "hybrid"
            - name: SYNESIS_RAG_RERANKER
              value: "flashrank"
            - name: SYNESIS_RAG_RERANKER_MODEL
              value: "ms-marco-MiniLM-L-12-v2"
            - name: SYNESIS_RAG_RRF_K
              value: "60"
            - name: SYNESIS_RAG_BGE_RERANKER_URL
              value: ""
            - name: SYNESIS_RAG_CRITIC_ARCH_ENABLED
              value: "true"
            - name: SYNESIS_RAG_CRITIC_LICENSE_ENABLED
              value: "true"
            - name: SYNESIS_MAX_ITERATIONS
              value: "3"
            - name: SYNESIS_SANDBOX_ENABLED
              value: "true"
            - name: SYNESIS_SANDBOX_NAMESPACE
              value: "synesis-sandbox"
            - name: SYNESIS_SANDBOX_IMAGE
              value: "synesis-sandbox:latest"
            - name: SYNESIS_SANDBOX_TIMEOUT_SECONDS
              value: "30"
            - name: SYNESIS_SANDBOX_CPU_LIMIT
              value: "2"
            - name: SYNESIS_SANDBOX_MEMORY_LIMIT
              value: "1Gi"
            - name: SYNESIS_SANDBOX_WARM_POOL_ENABLED
              value: "true"
            - name: SYNESIS_SANDBOX_WARM_POOL_URL
              value: "http://synesis-warm-pool.synesis-sandbox.svc.cluster.local:8080"
            - name: SYNESIS_FAILURE_STORE_ENABLED
              value: "true"
            - name: SYNESIS_FAILFAST_CACHE_MAX_SIZE
              value: "1000"
            - name: SYNESIS_FAILFAST_CACHE_TTL_SECONDS
              value: "86400"
            - name: SYNESIS_MEMORY_ENABLED
              value: "true"
            - name: SYNESIS_MEMORY_MAX_TURNS_PER_USER
              value: "20"
            - name: SYNESIS_MEMORY_MAX_USERS
              value: "5000"
            - name: SYNESIS_MEMORY_TTL_SECONDS
              value: "14400"
            - name: SYNESIS_WEB_SEARCH_ENABLED
              value: "true"
            - name: SYNESIS_WEB_SEARCH_URL
              value: "http://searxng.synesis-search.svc.cluster.local:8080"
            - name: SYNESIS_WEB_SEARCH_TIMEOUT_SECONDS
              value: "5"
            - name: SYNESIS_WEB_SEARCH_MAX_RESULTS
              value: "5"
            - name: SYNESIS_WEB_SEARCH_CRITIC_ENABLED
              value: "false"
            - name: SYNESIS_LSP_ENABLED
              value: "true"
            - name: SYNESIS_LSP_MODE
              value: "on_failure"
            - name: SYNESIS_LSP_GATEWAY_URL
              value: "http://lsp-gateway.synesis-lsp.svc:8000"
            - name: SYNESIS_LSP_TIMEOUT_SECONDS
              value: "30"
            - name: SYNESIS_NODE_TIMEOUT_SECONDS
              value: "180"
            - name: SYNESIS_CRITIC_BACKGROUND
              value: "false"
            - name: SYNESIS_OPIK_ENABLED
              value: "false"
            - name: SYNESIS_OPIK_URL
              value: "http://opik-backend.synesis-opik.svc.cluster.local:8080"
            - name: OPIK_URL_OVERRIDE
              value: "http://opik-backend.synesis-opik.svc.cluster.local:8080"
            - name: OPIK_WORKSPACE
              value: "default"
            - name: OPIK_PROJECT_NAME
              value: "synesis"
            - name: SYNESIS_LOG_LEVEL
              value: "info"
            # Semantic cache — shared Redis for cross-replica cache, sessions, and L2 archive
            - name: SYNESIS_RETRIEVAL_CACHE_BACKEND
              value: "redis"
            - name: SYNESIS_RETRIEVAL_CACHE_REDIS_URL
              value: "redis://synesis-redis.synesis-rag.svc.cluster.local:6379/0"
            - name: SYNESIS_RETRIEVAL_CACHE_REDIS_PREFIX
              value: "synesis:cache:"
            # Session persistence (LangGraph checkpointer)
            - name: SYNESIS_SESSION_CHECKPOINTER_BACKEND
              value: "redis"
            - name: SYNESIS_SESSION_REDIS_URL
              value: "redis://synesis-redis.synesis-rag.svc.cluster.local:6379/1"
            # L2 conversation archive
            - name: SYNESIS_L2_ARCHIVE_REDIS_URL
              value: "redis://synesis-redis.synesis-rag.svc.cluster.local:6379/2"
            - name: SYNESIS_L2_ARCHIVE_TTL_SECONDS
              value: "604800"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
