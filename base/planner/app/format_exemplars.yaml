# Golden before/after exemplars for the FormatRewriter.
# Each entry: { input: "...", output: "..." }
# The rewriter's few-shot prompt shows these pairs so it learns the
# target aesthetic by example, not by an ever-growing list of rules.
#
# Guidelines for adding exemplars:
#   - Keep each pair short (<600 words per side) to save context tokens.
#   - Show ONE formatting transformation per exemplar, not everything at once.
#   - Preserve all semantic content — never add or remove meaning.

- id: comparison
  description: "Technical comparison → table + mermaid architecture diagram"
  input: |
    ## Model Selection

    For the routing layer we chose Mistral-7B over Phi-3 Mini because Mistral has better tool-call support and lower latency at comparable accuracy. For the generation layer we chose Qwen3-32B over Llama-3-70B because Qwen fits on a single A100 with 4-bit quantization while Llama-3-70B requires two GPUs, doubling inference cost. The critic role uses DeepSeek-R1-Distill-32B because it supports extended thinking via think tags, which is important for nuanced code review.

    ## Request Flow

    The user sends a message to the API gateway. The gateway routes it to the supervisor, which classifies the request and decides whether to plan. The planner breaks complex tasks into sections. Section workers generate content in parallel. The critic reviews the assembled output. If approved, the response goes through the writer pipeline and back to the user.
  output: |
    ## Model Selection

    | Role | Model | Why chosen | Rejected alternative | Rejection reason |
    |------|-------|-----------|---------------------|-----------------|
    | Router | Mistral-7B | Better tool-call support, lower latency | Phi-3 Mini | Weaker tool-call handling |
    | Generator | Qwen3-32B | Single A100 with 4-bit quant | Llama-3-70B | Requires 2 GPUs, 2x cost |
    | Critic | DeepSeek-R1-Distill-32B | Extended thinking via think tags | — | No comparable alternative evaluated |

    ## Request Flow

    ```mermaid
    flowchart LR
        User --> Gateway --> Supervisor
        Supervisor --> Planner
        Planner --> W1[Worker 1] & W2[Worker 2] & W3[Worker 3]
        W1 & W2 & W3 --> Critic
        Critic --> Writer --> User
    ```

- id: process
  description: "Step-by-step deployment → numbered list + code block"
  input: |
    ## Deployment

    First create the namespace for the models. Then apply the InferenceService manifest for each model. After the pods are running, verify health by hitting the health endpoint. Finally update the gateway config to point at the new service URLs and restart the gateway pod.
  output: |
    ## Deployment

    1. Create the namespace:
       ```bash
       kubectl create namespace synesis-models
       ```
    2. Apply the InferenceService manifests:
       ```bash
       kubectl apply -f manifests/inference-services/ -n synesis-models
       ```
    3. Verify pods are healthy:
       ```bash
       kubectl wait --for=condition=ready pod -l app=synesis --timeout=300s -n synesis-models
       curl http://synesis-general.synesis-models.svc.cluster.local:8080/health
       ```
    4. Update the gateway config with the new service URLs and restart:
       ```bash
       kubectl rollout restart deployment/synesis-gateway -n synesis
       ```

- id: analysis
  description: "Narrative analysis → flowing prose with inline code + bullet summary"
  input: |
    ## Retrieval Strategy

    The retrieval system uses a hybrid approach combining BM25 keyword search with dense vector search using BGE-M3 embeddings. Results from both are merged using reciprocal rank fusion. This handles the common failure mode where pure vector search misses exact terminology like specific error codes or CLI flag names, while pure keyword search misses semantic similarity. The system indexes internal documentation, code repositories, and architecture decision records. Each source is tagged with an authority tier so that canonical internal docs outweigh community blog posts in the final ranking. Re-ranking is handled by FlashRank to keep latency under 200ms.
  output: |
    ## Retrieval Strategy

    The retrieval system uses a hybrid approach: BM25 for keyword matching and BGE-M3 dense vectors for semantic similarity, merged via reciprocal rank fusion. This matters because pure vector search misses exact terminology (error codes, CLI flags like `--tensor-parallel-size`) while pure keyword search misses semantic similarity.

    Each indexed source carries an authority tier — canonical internal docs outrank community blog posts in the final ranking. `FlashRank` handles re-ranking to keep latency under 200ms.

    Indexed sources:
    - Internal documentation and architecture decision records (canonical)
    - Code repositories (vetted)
    - External references (community/external, lower authority)
