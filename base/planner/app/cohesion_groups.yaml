# Cohesion conflict groups — data-driven mutual-exclusion definitions.
#
# Each group defines a set of entities that are mutually exclusive in
# the same decision dimension.  When a user mentions one member, the
# OutputCohesion system will exclude the others from the response.
#
# This file replaces the hardcoded _ENTITY_EXCLUSION_MAP so that domain
# experts can extend it without touching Python code.  LLM-discovered
# groups (from the anchor fallback) supplement but don't override these.
#
# Format:
#   group_name:
#     members: [list of lowercase entity names]
#     aliases: {entity: [alias1, alias2]}  # optional

cloud_provider:
  members: [aws, amazon, gcp, google cloud, azure, microsoft azure]
  aliases:
    aws: [amazon web services]
    gcp: [google cloud platform]
    azure: [microsoft azure]

container_orchestration:
  members: [kubernetes, openshift, docker swarm, nomad]
  aliases:
    kubernetes: [k8s]
    openshift: [okd]

ml_framework:
  members: [pytorch, tensorflow, jax]
  aliases:
    pytorch: [torch]

frontend_framework:
  members: [react, angular, vue, svelte, solid]
  aliases:
    react: [reactjs]
    angular: [angularjs]
    vue: [vuejs]

automotive_brand:
  members: [ford, chevy, chevrolet, toyota, honda, bmw]
  aliases:
    chevy: [chevrolet]

programming_language:
  members: [python, java, go, rust, typescript, csharp]
  aliases:
    csharp: ["c#", dotnet]
    typescript: [ts]
    go: [golang]

database:
  members: [postgresql, mysql, mongodb, redis, cassandra, dynamodb]
  aliases:
    postgresql: [postgres]

cloud_compute:
  members: [ec2, compute engine, azure vm, fargate, cloud run, azure functions, lambda]

llm_provider:
  members: [openai, anthropic, google, mistral, meta, cohere]
  aliases:
    openai: [gpt, chatgpt]
    anthropic: [claude]
    google: [gemini]
    meta: [llama]
