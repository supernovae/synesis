[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
markers =
    online: test requires a running planner, embedder, or LLM service
    container: test requires container-only deps (langgraph, fastapi, etc.)
    asyncio: mark test as async (pytest-asyncio)
    integration: live HTTP tests (set SYNESIS_TEST_AUTH and base URLs; optional SYNESIS_LIVE_CHAT=1)
