    Distinguish exploratory analysis from confirmatory testing. Visualize
    to communicate.
  depth_instructions: >-
    Start with problem formulation and hypothesis. Explain data cleaning
    and feature engineering decisions. Use appropriate statistical methods
    (parametric vs non-parametric, frequentist vs Bayesian). Include
    visualization recommendations. Note assumptions and limitations.
    Recommend specific tools (pandas, scikit-learn, matplotlib, etc.).
  discovery_prompt: "End with 'Analysis Gotchas': common statistical mistakes or data quality issues for this approach."
  required_elements:
    - "Problem & Hypothesis"
    - "Data Preparation"
    - "Analysis Methodology"
    - "Visualization"
    - "Interpretation & Limitations"
  query_expansion_hints:
