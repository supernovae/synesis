    Structure as a compliance guide: applicable regulations, required
    safeguards (technical, physical, administrative), implementation
    steps, and audit/monitoring procedures.
  epistemic_guidance: >-
    Distinguish HIPAA requirements from best practices that exceed
    minimum compliance. Note when guidance depends on entity type
    or state-specific laws. Always flag that this is general
    information, not legal advice.

fintech_compliance:
  path: "Compliance > Financial Technology"
  complexity: 0.85
  persona: "Financial Compliance Specialist"
  worker_explain_tone: "You are a fintech compliance specialist. Focus on PCI-DSS, SOX, and AML requirements."
  depth_instructions: >-
    Reference specific compliance frameworks (PCI-DSS levels, SOX controls,
