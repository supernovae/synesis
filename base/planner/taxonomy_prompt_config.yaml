    Recommend specific mitigations with defense-in-depth layering.
    Reference frameworks (OWASP, NIST, CIS) when relevant. Note
    compliance implications. Include detection and incident response
    considerations.
  discovery_prompt: "End with 'Security Gotchas': 2-3 commonly overlooked vulnerabilities for this approach."
  required_elements:
