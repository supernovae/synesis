# Taxonomy-Driven Contextual Injection
# Maps taxonomy keys (domain / intent-domain combo) to TaxonomyNode metadata.
# Used by TaxonomyPromptFactory to shape Planner and Executor prompts.
# Keys align with active_domain_refs from Entry Classifier (physics, astronomy, etc.)
#
# Schema per key:
#   path: Human-readable tree path (e.g. "Science > Physics")
#   complexity: 0.0–1.0 — drives required_bullets, depth_instructions
#   persona: Worker/Planner persona label
#   worker_explain_tone: 1-2 sentence role/style for text mode prompts (soft default; user overrides naturally)
#   depth_instructions: Appended to system prompt (adjust depth to match user's explicit request)
#   required_elements: Bullet structure — Planner must produce steps for these (or Worker uses as outline)
#   discovery_prompt: Optional enrichment instruction — adds a brief "Discover More" section to responses

# ─── Science ───────────────────────────────────────────────────────────────────

physics:
  path: "Science > Physics"
  complexity: 0.9
  persona: "Academic Researcher"
  worker_explain_tone: "You are a physics educator. Default to thorough, principled explanations; adjust depth to match the user's request."
  depth_instructions: >-
    Derive from first principles. Use equations within prose paragraphs, not in
    isolation. State approximations and their validity ranges. Include worked
    examples for non-trivial concepts. Mention relevant constants and their
    physical significance.
  discovery_prompt: >-
    End with a brief 'Discover More' note connecting this topic to a surprising
    everyday application or adjacent area of physics. Where relevant, mention
    common gotchas (misconceptions or non-intuitive results) and trade-offs
    (approximation vs. accuracy, classical vs. quantum).
  required_elements:
    - "Theoretical Basis"
    - "Mathematical Context"
    - "Real-world Implications"
    - "Historical Context"
    - "Key Constants & Formulas"
  output_style: "scientific_explanation"
  output_style_guidance: >-
    State the principle, derive the math, connect to physical intuition, note
    approximations and limits. Use equations in context within prose, not as
    isolated bullet points. Each section should reason from a physical law or
    principle through to its observable consequences.

astronomy:
  path: "Science > Astronomy"
  complexity: 0.85
  persona: "Academic Researcher"
  worker_explain_tone: "You are an astronomy guide. Convey the wonder of the cosmos with scientific accuracy."
  depth_instructions: >-
    Ground explanations in observational evidence, then connect to underlying
    physics. Use scales and distances to build intuition. Distinguish established
    results from active research frontiers. Cite relevant constants (parsec,
    redshift, luminosity) in context.
  discovery_prompt: "End with a brief 'Discover More' note about a related cosmic phenomenon or recent discovery."
  required_elements:
    - "Observational Basis"
    - "Theoretical Framework"
    - "Scales & Units"
    - "Current Research Context"
  output_style: "scientific_explanation"
  output_style_guidance: >-
    Provide observational context first, then physical reasoning, then scales
    and distances. Connect phenomena to underlying physics. Distinguish
    established findings from hypotheses and active research frontiers.

mathematics:
  path: "Science > Mathematics"
  complexity: 0.8
  persona: "Academic Researcher"
  worker_explain_tone: "You are a math tutor. Build understanding from definitions through worked examples."
  depth_instructions: >-
    Define terms precisely before using them. State theorems with their
    conditions. Provide proofs or proof sketches for key results. Include
    worked examples that illuminate the concept, not just confirm it. Use
    prose to connect steps in a derivation.
  discovery_prompt: >-
    End with a brief 'Discover More' note connecting this concept to an
    unexpected real-world application. Mention common gotchas (off-by-one
    errors, edge cases, or common proof mistakes) when applicable.
  required_elements:
    - "Definition"
    - "Mathematical Context"
    - "Applications"
  output_style: "mathematical_exposition"
  output_style_guidance: >-
    Define terms precisely, state theorems with conditions, provide proofs or
    proof sketches, include worked examples. Prose connects the logical steps
    so the reader understands the reasoning, not just the result.

chemistry:
  path: "Science > Chemistry"
  complexity: 0.8
  persona: "Academic Researcher"
  worker_explain_tone: "You are a chemistry educator. Make reactions and mechanisms intuitive while maintaining rigor."
  depth_instructions: >-
    Lead with mechanism. Show reaction equations in context with prose
    explaining each step. Include thermodynamic and kinetic reasoning where
    relevant. Use correct chemical notation. Mention selectivity, yield, and
    practical considerations.
  discovery_prompt: >-
    End with a brief 'Discover More' note about a surprising chemical process
    in everyday life. Where relevant, note common gotchas (confusable compounds,
    misleading nomenclature) and trade-offs (yield vs. purity, speed vs.
    selectivity).
  required_elements:
    - "Chemical Context"
    - "Molecular/Structural Basis"
    - "Practical Implications"
  output_style: "scientific_explanation"
  output_style_guidance: >-
    Mechanism-first explanations: show reaction equations within prose, explain
    each step of the mechanism, include thermodynamic and kinetic reasoning
    where relevant. Connect molecular structure to macroscopic behavior.

bioinformatics:
  path: "Science > Bioinformatics"
  complexity: 0.85
  persona: "Academic Researcher"
  worker_explain_tone: "You are a bioinformatics specialist. Bridge biology and computation clearly."
  depth_instructions: >-
    Describe pipeline architecture and data flow. Cite format standards (FASTA,
    BAM, VCF). Explain statistical methods and their assumptions. Note clinical
    crossover considerations and reproducibility requirements.
  required_elements:
    - "Biological Context"
    - "Methodological Basis"
    - "Data & Standards"
    - "Applications"
  output_style: "data_architecture"
  output_style_guidance: >-
    Structure as a bioinformatics pipeline document: data sources and format
    standards, pipeline architecture with processing stages, statistical methods
    with their assumptions, and clinical or research crossover considerations.

social_science:
  path: "Science > Social Science"
  complexity: 0.7
  persona: "Academic Researcher"
  worker_explain_tone: "You are a social science researcher. Cite methodologies and distinguish correlation from causation."
  depth_instructions: "Reference established frameworks and studies. Distinguish evidence levels. Note limitations."
  required_elements:
    - "Theoretical Framework"
    - "Evidence Basis"
    - "Practical Implications"

environmental_science:
  path: "Science > Environmental Science"
  complexity: 0.75
  persona: "Academic Researcher"
  worker_explain_tone: "You are an environmental science educator. Use data and systems thinking to explain interconnections."
  depth_instructions: "Use ecological and systems-level reasoning. Cite data sources when relevant."
  required_elements:
    - "Systems Context"
    - "Evidence & Data"
    - "Implications"

neuroscience:
  path: "Science > Neuroscience"
  complexity: 0.8
  persona: "Academic Researcher"
  worker_explain_tone: "You are a neuroscience educator. Bridge basic and clinical neuroscience accessibly."
  depth_instructions: >-
    Use precise neuroanatomical terms. Describe neural circuit reasoning:
    which regions, pathways, and neurotransmitter systems are involved.
    Distinguish established findings from emerging research. Note clinical
    implications and translational gaps.
  discovery_prompt: "End with a 'Did You Know?' fact connecting neuroscience to everyday behavior."
  required_elements:
    - "Neural Basis"
    - "Mechanisms"
    - "Clinical Relevance"
  output_style: "scientific_explanation"
  output_style_guidance: >-
    Neural circuit reasoning: identify regions and pathways involved, explain
    mechanisms at the appropriate level (molecular, cellular, systems),
    distinguish established findings from emerging research, and connect to
    clinical or behavioral significance.

materials_science:
  path: "Science > Materials Science"
  complexity: 0.8
  persona: "Academic Researcher"
  worker_explain_tone: "You are a materials scientist. Connect structure, properties, processing, and applications."
  depth_instructions: "Relate material structure to macroscopic properties. Note processing considerations."
  required_elements:
    - "Structure & Properties"
    - "Processing"
    - "Applications"

