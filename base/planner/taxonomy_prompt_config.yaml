# ─── Protocol Integration ──────────────────────────────────────────────────────

protocols:
  path: "Engineering > Protocols"
  complexity: 0.85
  persona: "Protocol Engineer"
  worker_explain_tone: "You are a protocol integration specialist. Focus on standards compliance and interoperability."
  depth_instructions: >-
    Describe protocol state machine explicitly. Show message formats with field
    definitions. Detail error handling and recovery procedures. Build
    incrementally: discovery and handshake first, then core operations. Include
    sequence diagrams for multi-step exchanges.
  planner_decomposition_rules: |
    For protocol tasks (ActivityPub, Fediverse, WebFinger, OAuth, SAML):
    - FIRST step = discovery/handshake only (e.g. WebFinger, .well-known).
    - Do NOT plan the full app in one step.
    - Each step must verify protocol compliance before proceeding.
  required_elements:
    - "Protocol Discovery"
    - "Core Operations"
    - "Error Handling"
    - "Standards Compliance"
  output_style: "protocol_specification"
  output_style_guidance: >-
    Protocol state machine, message format with field definitions, error
    handling and recovery. Use mermaid sequence diagrams for multi-step
    exchanges. Build incrementally: discovery then operations. Reference
    RFC or spec section numbers where applicable.

# ─── Engineering: Software Architecture ───────────────────────────────────────

software_architecture:
  path: "Engineering > Software Architecture"
  complexity: 0.85
  persona: "Principal Engineer"
  worker_explain_tone: "You are a principal engineer who has shipped production systems. Make concrete choices and justify them. Scope to the user's stated constraints."
  depth_instructions: >-
    Reason from first principles. Justify key choices with a rejected
    alternative. Separate what you know from what you assume. Quantify where
    you can — rough ranges with stated assumptions beat precise-sounding
    fabrications. Scope ruthlessly to the user's constraints; defer the rest
    to future work. When describing component relationships or data flow,
    include a mermaid diagram to visualize the architecture.
  discovery_prompt: "End with a brief 'Key Risks' section: the top 2-3 ways this design could fail and how to detect it early."
  planner_decomposition_rules: |
    For architecture/design tasks:
    - Map each user-requested section to a plan step.
    - If the user listed specific deliverables, each becomes a step.
    - Do NOT invent requirements the user did not ask for.
  required_elements:
    - "Design Goals & Constraints"
    - "Architecture & Components"
    - "Technology Choices & Rationale"
    - "Implementation Path"
    - "Key Risks"
  query_expansion_hints:
    - "ADR"
    - "architecture decision record"
    - "system design"
    - "component diagram"
    - "design proposal"
    - "tradeoff analysis"
    - "failure modes"
    - "microservices"
    - "event-driven"
  preferred_web_scopes:
    - "site:martinfowler.com"
    - "site:microservices.io"
  output_style: "architecture_document"
  output_style_guidance: >-
    Structure like a technical architecture document: start with design goals
    and constraints, then components and their interactions, then technology
    choices with rationale (chosen approach + why alternatives were rejected),
    then implementation path with concrete milestones, then key risks with
    detection strategies. Every recommendation must be concrete and justified.
    Include a mermaid architecture diagram.

