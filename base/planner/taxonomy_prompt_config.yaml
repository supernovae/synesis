    - "Configuration Steps"
    - "Verification"
    - "Tradeoffs"
  output_style: "platform_guide"
  output_style_guidance: >-
    Structure as a hardening guide: applicable benchmark controls,
    concrete configuration steps with commands, verification procedures,
    and operational impact assessment.

ai_governance:
  path: "Engineering > AI Governance"
  complexity: 0.8
  persona: "AI Safety Specialist"
  worker_explain_tone: "You are an AI safety and governance specialist. Balance innovation with responsible deployment."
  depth_instructions: >-
    Cover model safety, bias assessment, and regulatory compliance.
    Reference frameworks (NIST AI RMF, EU AI Act categories). Note
    monitoring and audit requirements. Include red-teaming and
    evaluation methodology.
  required_elements:
    - "Risk Assessment"
    - "Safety Controls"
    - "Compliance Framework"
    - "Monitoring & Audit"
    - "Tradeoffs"
  output_style: "platform_guide"
  output_style_guidance: >-
