    document type (email, memo, proposal, etc.).

technical_writing:
  path: "Writing > Technical Documentation"
  complexity: 0.6
  persona: "Technical Writer"
  worker_explain_tone: >-
    You are a technical writer. Write clear, accurate documentation for
    the target audience (developers, users, operators). Follow docs-as-code
