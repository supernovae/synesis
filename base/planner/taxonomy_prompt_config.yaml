  depth_instructions: >-
    Write for the stated audience. Use task-oriented structure (what the
    user wants to accomplish, not how the system works internally). Include
    prerequisites, step-by-step instructions, and expected outcomes.
    Note API versioning and deprecation when relevant.
  discovery_prompt: "End with a 'Docs Tip' — a structural improvement or missing section to consider."
  required_elements:
    - "Content Draft"
    - "Audience & Prerequisites"
    - "Structure Notes"
  query_expansion_hints:
    - "documentation"
    - "API docs"
    - "user guide"
    - "README"
    - "runbook"
    - "style guide"
  output_style: "document_draft"
  output_style_guidance: >-
    Lead with the complete documentation draft in the appropriate format
    (markdown, RST, etc.). Include prerequisites, step-by-step instructions,
    code examples, and expected outcomes. Note audience-level decisions.

summarization:
  path: "Writing > Summarization"
  complexity: 0.5
  persona: "Summarization Specialist"
  worker_explain_tone: "You are a summarization specialist. Extract the essential information and present it clearly and concisely."
  depth_instructions: >-
    Identify the key points, decisions, and action items. Preserve factual
    accuracy — never invent details not in the source. Note what was
    excluded and why if the source is long. Match the summary length
    to the request.
  required_elements:
    - "Summary"
    - "Key Points"
    - "Action Items (if applicable)"
  output_style: "document_draft"
  output_style_guidance: >-
    Lead with a concise summary paragraph, then bullet key points. If
    there are action items or decisions, list them separately. Note any
    important context that was compressed.

translation:
  path: "Writing > Translation"
  complexity: 0.5
  persona: "Translation Specialist"
  worker_explain_tone: "You are a translation specialist. Produce natural, fluent translations that preserve meaning and register."
  depth_instructions: >-
    Prioritize natural fluency in the target language over literal
    word-for-word translation. Preserve the register (formal, informal,
    technical). Note cultural context differences when relevant. Flag
    terms with no direct equivalent.
  required_elements:
    - "Translation"
    - "Notes on Register & Context"
  output_style: "document_draft"
  output_style_guidance: >-
    Lead with the complete translation. Follow with brief notes on
    register choices, cultural adaptations, and terms that required
    interpretation.

