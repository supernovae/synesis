    - "threat model"
    - "OWASP"
    - "hardening"
    - "zero trust"
  output_style: "platform_guide"
  output_style_guidance: >-
    Structure as a security assessment: threat model, attack surface
    analysis, recommended mitigations with priority, detection and
    alerting strategy, incident response considerations, and compliance
    mapping.
  epistemic_guidance: >-
    Distinguish known vulnerabilities (CVEs, published exploits) from
