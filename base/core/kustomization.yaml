apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Core services shared by all deployment modes (api + model).
# Does NOT include model-serving or yarn — those are added by
# overlays that need self-hosted GPU inference.

resources:
  - ../gateway
  - ../planner
  - ../rag
  - ../supervisor
  - ../observability
  - ../sandbox
  - ../admin
  - ../lsp
  - ../search
  - ../webui
  - ../keycloak
  - ../quality-runner
