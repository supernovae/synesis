apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Core services shared by all deployment modes (api + model).
# Does NOT include model-serving, MCP agent, or Yarn — overlays add those
# (model: GPU + yarn + mcp; api: mcp + yarn for IDE path).

resources:
  - ../gateway
  - ../planner-ts
  - ../rag
  - ../observability
  - ../sandbox
  - ../admin
  - ../search
  - ../webui
  - ../keycloak
  - ../quality-runner
