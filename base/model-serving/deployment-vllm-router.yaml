# Synesis Router — Qwen2.5-14B-Instruct with on-the-fly FP8 quantization
#
# Serves router, planner, advisor, and critic roles from a single model instance.
# Qwen2.5-14B-Instruct provides stronger instruction-following and evaluation
# quality than the previous Qwen3-8B, with ~14GB FP8 weights fitting easily
# on a single L40S (~29GB KV cache headroom).
#
# In compact 3-GPU layouts, this can eliminate the need for a separate R1 critic
# deployment, keeping GPUs available for router+critic, general, and coder.
# Larger footprints typically deploy a dedicated R1 via synesis-critic deployment.
#
# Critic reasoning is prompt-driven (detailed system prompt) — no native
# thinking mode. This avoids the "people-pleaser" equivocation that smaller
# models exhibit with chain-of-thought.
#
# Prerequisites: synesis-models-efs PVC, model via run-model-pipeline.sh --role=router
---
apiVersion: v1
kind: Service
metadata:
  name: synesis-router
  namespace: synesis-models
  labels:
    app.kubernetes.io/name: synesis-router
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: model-serving
spec:
  selector:
    app: synesis-router
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synesis-router
  namespace: synesis-models
  labels:
    app.kubernetes.io/name: synesis-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synesis-router
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: synesis-router
    spec:
      securityContext:
        runAsNonRoot: true
      imagePullPolicy: IfNotPresent
      volumes:
        - name: model-store
          persistentVolumeClaim:
            claimName: synesis-models-efs
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      containers:
        - name: vllm-router
          image: registry.redhat.io/rhaiis/vllm-cuda-rhel9@sha256:094db84a1da5e8a575d0c9eade114fa30f4a2061064a338e3e032f3578f8082a
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --port=8080
            - --model=/mnt/models
            - --served-model-name
            - synesis-router
            - synesis-critic
            - --tensor-parallel-size=1
            - --quantization=fp8
            - --max-model-len=32768
            - --gpu-memory-utilization=0.90
            - --generation-config=vllm
            - --enable-prefix-caching
            - --enable-chunked-prefill
          resources:
            limits:
              cpu: "4"
              memory: 24Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: model-store
              mountPath: /mnt/models
              subPath: router-model
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      nodeSelector:
        node-role.autonode/gpu: ""
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Equal
          value: "true"
