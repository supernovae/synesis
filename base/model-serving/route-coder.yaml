# Public HTTPS route for coder model access (Cursor, Claude Code, etc.).
#
# Routes through LiteLLM gateway for authentication.  Users must
# provide a valid API key (master key or personal access token).
# Use model "synesis-coder" in your IDE configuration.
#
# Override spec.host via overlay to match your cluster ingress domain.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: synesis-coder-api
  namespace: synesis-gateway
  labels:
    app.kubernetes.io/name: synesis-coder
    app.kubernetes.io/part-of: synesis
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  host: synesis-coder.apps.openshiftdemo.dev
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: litellm-proxy
    weight: 100
  port:
    targetPort: http
