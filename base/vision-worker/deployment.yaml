apiVersion: apps/v1
kind: Deployment
metadata:
  name: synesis-vision-worker
  namespace: synesis-yarn
  labels:
    app: synesis-vision-worker
    app.kubernetes.io/part-of: synesis-coder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synesis-vision-worker
  template:
    metadata:
      labels:
        app: synesis-vision-worker
    spec:
      containers:
        - name: vision-worker
          image: synesis-vision-worker:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi