apiVersion: apps/v1
kind: Deployment
metadata:
  name: opik-frontend
  namespace: synesis-opik
  labels:
    app.kubernetes.io/name: opik-frontend
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: opik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opik-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opik-frontend
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: opik
    spec:
      containers:
        - name: opik-frontend
          image: ghcr.io/comet-ml/opik/opik-frontend:latest
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
          env:
            - name: BACKEND_URL
              value: "http://opik-backend:5173"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
