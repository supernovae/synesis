apiVersion: apps/v1
kind: Deployment
metadata:
  name: opik-frontend
  namespace: synesis-opik
  labels:
    app.kubernetes.io/name: opik-frontend
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: opik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opik-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opik-frontend
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: opik
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: opik-frontend
          image: ghcr.io/comet-ml/opik/opik-frontend:latest
          securityContext:
            runAsNonRoot: false
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: opik-frontend-nginx
