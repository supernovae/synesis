    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: opik-storage
data:
  macros.xml: |
    <clickhouse>
      <macros>
        <shard>1</shard>
        <replica>1</replica>
      </macros>
    </clickhouse>
