apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: synesis-opik
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: opik-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: opik-storage
    spec:
      containers:
        - name: zookeeper
          image: zookeeper:3.9-jre-17
          ports:
            - name: client
              containerPort: 2181
              protocol: TCP
          env:
            - name: ZOO_4LW_COMMANDS_WHITELIST
              value: "mntr,conf,ruok"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'echo ruok | nc localhost 2181 | grep imok'
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'echo ruok | nc localhost 2181 | grep imok'
            initialDelaySeconds: 10
            periodSeconds: 5
