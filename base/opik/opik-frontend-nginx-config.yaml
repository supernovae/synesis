apiVersion: v1
kind: ConfigMap
metadata:
  name: opik-frontend-nginx
  namespace: synesis-opik
  labels:
    app.kubernetes.io/name: opik-frontend
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: opik
data:
  default.conf: |
    upstream opik_backend {
        server opik-backend:8080;
    }

    server {
        listen       80;
        listen  [::]:80;
        server_name  localhost;

    # API calls → backend (frontend uses /api/v1/, backend serves /v1/)
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://opik_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /v1/ {
        proxy_pass http://opik_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /is-alive/ {
        proxy_pass http://opik_backend;
        proxy_set_header Host $host;
    }

    location /health-check {
        proxy_pass http://opik_backend;
        proxy_set_header Host $host;
    }

        # SPA static files
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
