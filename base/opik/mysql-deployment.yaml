apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: synesis-opik
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: opik-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: opik-storage
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: opik
            - name: MYSQL_DATABASE
              value: opik
            - name: MYSQL_USER
              value: opik
            - name: MYSQL_PASSWORD
              value: opik
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -uopik
                - -popik
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -uopik
                - -popik
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
