apiVersion: apps/v1
kind: Deployment
metadata:
  name: opik-backend
  namespace: synesis-opik
  labels:
    app.kubernetes.io/name: opik-backend
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: opik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opik-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opik-backend
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: opik
    spec:
      initContainers:
        - name: migrate-mysql
          image: ghcr.io/comet-ml/opik/opik-backend:latest
          command: ["java", "-jar", "/opt/opik/opik-backend-1.10.37.jar", "db", "migrate", "/opt/opik/config.yml"]
          env:
            - name: STATE_DB_PROTOCOL
              value: "jdbc:mysql://"
            - name: STATE_DB_URL
              value: "mysql:3306/opik?rewriteBatchedStatements=true"
            - name: STATE_DB_DATABASE_NAME
              value: "opik"
            - name: STATE_DB_USER
              value: "opik"
            - name: STATE_DB_PASS
              value: "opik"
            - name: ANALYTICS_DB_PROTOCOL
              value: "HTTP"
            - name: ANALYTICS_DB_HOST
              value: "clickhouse"
            - name: ANALYTICS_DB_PORT
              value: "8123"
            - name: ANALYTICS_DB_DATABASE_NAME
              value: "opik"
            - name: ANALYTICS_DB_USERNAME
              value: "opik"
            - name: ANALYTICS_DB_PASS
              value: "opik"
            - name: ANALYTICS_DB_MIGRATIONS_URL
              value: "jdbc:clickhouse://clickhouse:8123"
            - name: ANALYTICS_DB_MIGRATIONS_USER
              value: "opik"
            - name: ANALYTICS_DB_MIGRATIONS_PASS
              value: "opik"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: JAVA_OPTS
              value: "-Dliquibase.propertySubstitutionEnabled=true -Xms256m -Xmx512m"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
        - name: migrate-clickhouse
          image: ghcr.io/comet-ml/opik/opik-backend:latest
          command: ["java", "-jar", "/opt/opik/opik-backend-1.10.37.jar", "dbAnalytics", "migrate", "/opt/opik/config.yml"]
          env:
            - name: STATE_DB_PROTOCOL
              value: "jdbc:mysql://"
            - name: STATE_DB_URL
              value: "mysql:3306/opik?rewriteBatchedStatements=true"
            - name: STATE_DB_DATABASE_NAME
              value: "opik"
            - name: STATE_DB_USER
              value: "opik"
            - name: STATE_DB_PASS
              value: "opik"
            - name: ANALYTICS_DB_PROTOCOL
              value: "HTTP"
            - name: ANALYTICS_DB_HOST
              value: "clickhouse"
            - name: ANALYTICS_DB_PORT
              value: "8123"
            - name: ANALYTICS_DB_DATABASE_NAME
              value: "opik"
            - name: ANALYTICS_DB_USERNAME
              value: "opik"
            - name: ANALYTICS_DB_PASS
              value: "opik"
            - name: ANALYTICS_DB_MIGRATIONS_URL
              value: "jdbc:clickhouse://clickhouse:8123"
            - name: ANALYTICS_DB_MIGRATIONS_USER
              value: "opik"
            - name: ANALYTICS_DB_MIGRATIONS_PASS
              value: "opik"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: JAVA_OPTS
              value: "-Dliquibase.propertySubstitutionEnabled=true -Xms256m -Xmx512m"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      containers:
        - name: opik-backend
          image: ghcr.io/comet-ml/opik/opik-backend:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ANALYTICS_DB_PROTOCOL
              value: "HTTP"
            - name: ANALYTICS_DB_HOST
              value: "clickhouse"
            - name: ANALYTICS_DB_PORT
              value: "8123"
            - name: ANALYTICS_DB_DATABASE_NAME
              value: "opik"
            - name: ANALYTICS_DB_USERNAME
              value: "opik"
            - name: ANALYTICS_DB_PASS
              value: "opik"
            - name: ANALYTICS_DB_MIGRATIONS_URL
              value: "jdbc:clickhouse://clickhouse:8123"
            - name: ANALYTICS_DB_MIGRATIONS_USER
              value: "opik"
            - name: ANALYTICS_DB_MIGRATIONS_PASS
              value: "opik"
            - name: STATE_DB_PROTOCOL
              value: "jdbc:mysql://"
            - name: STATE_DB_URL
              value: "mysql:3306/opik?rewriteBatchedStatements=true"
            - name: STATE_DB_DATABASE_NAME
              value: "opik"
            - name: STATE_DB_USER
              value: "opik"
            - name: STATE_DB_PASS
              value: "opik"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: JAVA_OPTS
              value: "-Dliquibase.propertySubstitutionEnabled=true -Xms256m -Xmx512m"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health-check?name=all&type=alive
              port: http
              httpHeaders:
                - name: Accept
                  value: application/json
            initialDelaySeconds: 45
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health-check?name=all&type=ready
              port: http
              httpHeaders:
                - name: Accept
                  value: application/json
            initialDelaySeconds: 20
            periodSeconds: 10
