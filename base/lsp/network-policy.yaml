apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lsp-allow-planner-only
  namespace: synesis-lsp
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: lsp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-planner
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS — allow cluster service discovery.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Fail-safe: keep cluster service discovery available even if CNI matching
    # behavior changes for specific peer selectors.
    - {}
