# KeycloakRealmImport — operator-supported mechanism for initial realm creation.
#
# Creates a one-time Job that imports the synesis realm. Idempotent: if
# the realm already exists, the import is skipped. Override spec.realm
# in overlays when deploying to a different cluster domain.
#
# Once imported, the CR and its Job can be safely deleted:
#   oc delete keycloakrealmimport synesis-realm-import -n synesis-auth
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: synesis-realm-import
  namespace: synesis-auth
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: identity-provider
spec:
  keycloakCRName: synesis-keycloak
  realm:
    realm: synesis
    enabled: true
    organizationsEnabled: true
    registrationAllowed: true
    registrationEmailAsUsername: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    resetPasswordAllowed: true
    editUsernameAllowed: false
    bruteForceProtected: true
    permanentLockout: false
    maxFailureWaitSeconds: 900
    minimumQuickLoginWaitSeconds: 60
    waitIncrementSeconds: 60
    quickLoginCheckMilliSeconds: 1000
    maxDeltaTimeSeconds: 43200
    failureFactor: 5
    sslRequired: external
    accessTokenLifespan: 300
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 36000
    roles:
      realm:
        - name: synesis-user
          description: "Standard Synesis user — chat, generate tokens, view own history"
        - name: synesis-admin
          description: "Platform administrator — full access to admin dashboard and APIs"
        - name: synesis-org-admin
          description: "Organization administrator — manage members and settings for own org"
    defaultRoles:
      - synesis-user
    scopeMappings: []
    # Built-in OIDC scopes must exist in the realm when clients list them in
    # defaultClientScopes; otherwise Keycloak returns "Invalid scopes: openid profile email".
    clientScopes:
      - name: openid
        description: "OpenID Connect scope for subject identifier"
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "true"
        protocolMappers:
          - name: sub
            protocol: openid-connect
            protocolMapper: oidc-sub-mapper
            consentRequired: false
            config:
              access.token.claim: "true"
              id.token.claim: "true"
      - name: profile
        description: "OpenID Connect built-in scope: profile"
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "true"
        protocolMappers:
          - name: username
            protocol: openid-connect
            protocolMapper: oidc-usermodel-property-mapper
            consentRequired: false
            config:
              user.attribute: username
              claim.name: preferred_username
              jsonType.label: "String"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
          - name: full-name
            protocol: openid-connect
            protocolMapper: oidc-full-name-mapper
            consentRequired: false
            config:
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
      - name: email
        description: "OpenID Connect built-in scope: email"
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "true"
        protocolMappers:
          - name: email
            protocol: openid-connect
            protocolMapper: oidc-usermodel-property-mapper
            consentRequired: false
            config:
              user.attribute: email
              claim.name: email
              jsonType.label: "String"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
          - name: email-verified
            protocol: openid-connect
            protocolMapper: oidc-usermodel-property-mapper
            consentRequired: false
            config:
              user.attribute: emailVerified
              claim.name: email_verified
              jsonType.label: "boolean"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
      - name: synesis-roles
        description: "Include realm roles in access and ID tokens"
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: realm-roles
            protocol: openid-connect
            protocolMapper: oidc-usermodel-realm-role-mapper
            consentRequired: false
            config:
              multivalued: "true"
              userinfo.token.claim: "true"
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: realm_access.roles
              jsonType.label: "String"
      - name: synesis-organization
        description: "Include organization membership in access and ID tokens"
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: organization
            protocol: openid-connect
            protocolMapper: oidc-organization-membership-mapper
            consentRequired: false
            config:
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: organization
              userinfo.token.claim: "true"
    clients:
      - clientId: synesis-webui
        name: "Synesis Web UI (OpenWebUI)"
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris:
          - "https://synesis.apps.openshiftdemo.dev/*"
        webOrigins:
          - "https://synesis.apps.openshiftdemo.dev"
        defaultClientScopes:
          - openid
          - profile
          - email
          - synesis-roles
          - synesis-organization
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: "https://synesis.apps.openshiftdemo.dev/*"
      - clientId: synesis-admin
        name: "Synesis Admin Dashboard"
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris:
          - "https://synesis-admin.apps.openshiftdemo.dev/*"
        webOrigins:
          - "https://synesis-admin.apps.openshiftdemo.dev"
        defaultClientScopes:
          - openid
          - profile
          - email
          - synesis-roles
          - synesis-organization
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: "https://synesis-admin.apps.openshiftdemo.dev/*"
      - clientId: synesis-api
        name: "Synesis API (service-to-service)"
        enabled: true
        publicClient: false
        standardFlowEnabled: false
        serviceAccountsEnabled: true
        directAccessGrantsEnabled: false
        defaultClientScopes:
          - openid
          - profile
          - email
          - synesis-roles
          - synesis-organization
