# Separate admin-console route for Keycloak.
# Keep this hostname less discoverable than the public auth route when possible.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: synesis-auth-admin
  namespace: synesis-auth
  labels:
    app.kubernetes.io/name: synesis-keycloak
    app.kubernetes.io/part-of: synesis
  annotations:
    haproxy.router.openshift.io/timeout: 60s
spec:
  host: auth-admin.kybern.dev
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: synesis-keycloak-service
    weight: 100
  port:
    targetPort: http
