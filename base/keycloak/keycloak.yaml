# Red Hat Build of Keycloak — central IdP for all Synesis services.
#
# Requires the RHBK operator installed from OperatorHub.
# TLS is terminated at the OpenShift Route; Keycloak listens on HTTP.
#
# Override spec.hostname.hostname via overlay for your cluster domain.
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: synesis-keycloak
  namespace: synesis-auth
  labels:
    app.kubernetes.io/name: synesis-keycloak
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: identity-provider
spec:
  instances: 1

  additionalOptions:
    - name: features
      value: organization

  db:
    vendor: postgres
    host: synesis-auth-db-rw.synesis-auth.svc
    port: 5432
    database: keycloak
    usernameSecret:
      name: synesis-auth-db-app
      key: username
    passwordSecret:
      name: synesis-auth-db-app
      key: password

  hostname:
    hostname: synesis-auth.apps.openshiftdemo.dev

  http:
    httpEnabled: true

  proxy:
    headers: xforwarded

  unsupported:
    podTemplate:
      spec:
        containers:
          - volumeMounts:
              - name: realm-import
                mountPath: /opt/keycloak/data/import
                readOnly: true
        volumes:
          - name: realm-import
            configMap:
              name: synesis-realm-import

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
