apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: synesis-search
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: search
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: search
    spec:
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - "1.1.1.1"
          - "8.8.8.8"
        searches:
          - "synesis-search.svc.cluster.local"
          - "svc.cluster.local"
          - "cluster.local"
        options:
          - name: ndots
            value: "3"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # Do not set fsGroup/runAsUser here: OpenShift assigns UID/GID from the
        # namespace range (see base/gateway/helm/values-synesis.yaml). Fixed 977
        # would often fail scheduling. EmptyDir remains group-writable; entrypoint
        # may still warn about searxng:searxng — harmless on restricted SCC.
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Override K8s service-link injection: a Service named "searxng" sets
            # SEARXNG_PORT=tcp://<clusterIP>:8080 which Granian cannot parse (see searxng#5934).
            - name: SEARXNG_PORT
              value: "8080"
            - name: GRANIAN_PORT
              value: "8080"
            - name: SEARXNG_SETTINGS_PATH
              value: "/etc/searxng-config/settings.yml"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: X-Forwarded-For
                  value: "127.0.0.1"
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: X-Forwarded-For
                  value: "127.0.0.1"
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng-config
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
            - name: tmp-etc
              mountPath: /etc/searxng
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
        - name: cache
          emptyDir:
            sizeLimit: 100Mi
        - name: tmp-etc
          emptyDir:
            sizeLimit: 10Mi
