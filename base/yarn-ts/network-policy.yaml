apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yarn-ts-network-policy
  namespace: synesis-yarn
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: yarn
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: synesis-yarn
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # OpenShift router (edge-terminated routes for external IDE/coder clients)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
      ports:
        - port: 8000
          protocol: TCP
    # WebUI and admin call yarn chat endpoints
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-webui
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-admin
      ports:
        - port: 8000
          protocol: TCP
    # Cloudflared tunnel ingress (edge namespace)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-edge
      ports:
        - port: 8000
          protocol: TCP
    # Prometheus scrape
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - port: 8000
          protocol: TCP
  egress:
    # Admin API (PAT auth, tier registry, usage persistence)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-admin
      ports:
        - port: 8080
          protocol: TCP
    # Admin DB (Postgres — PAT verification, usage writes)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-admin
      ports:
        - port: 5432
          protocol: TCP
    # Redis (sessions, buffers — synesis-rag namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-rag
      ports:
        - port: 6379
          protocol: TCP
    # OpenFGA authorization
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-authz
      ports:
        - port: 8080
          protocol: TCP
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # HTTPS egress for model providers (OpenRouter, OpenAI, Anthropic, etc.)
    - ports:
        - port: 443
          protocol: TCP
    # OTEL collector (if deployed in-cluster)
    - ports:
        - port: 4318
          protocol: TCP
        - port: 4317
          protocol: TCP
    # Sandbox warm pool (run_in_sandbox tool + governor worker live mode)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-sandbox
      ports:
        - port: 8080
          protocol: TCP
    # Vision worker for bounded public-HTTPS screenshots.
    - to:
        - podSelector:
            matchLabels:
              app: synesis-vision-worker
      ports:
        - port: 8080
          protocol: TCP
