apiVersion: apps/v1
kind: Deployment
metadata:
  name: synesis-yarn
  labels:
    app.kubernetes.io/name: synesis-yarn
    app.kubernetes.io/component: yarn
    app.kubernetes.io/part-of: synesis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synesis-yarn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synesis-yarn
        app.kubernetes.io/component: yarn
        app.kubernetes.io/part-of: synesis
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: yarn
          image: ghcr.io/supernovae/synesis/yarn-ts:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
            - name: SYNESIS_YARN_ADMIN_API_URL
              value: http://synesis-admin.synesis-admin.svc.cluster.local:8080
            - name: SYNESIS_YARN_SESSION_REDIS_URL
              value: redis://synesis-redis.synesis-rag.svc.cluster.local:6379/3
            - name: SYNESIS_YARN_ADMIN_DB_URL
              valueFrom:
                secretKeyRef:
                  name: synesis-admin-db-url
                  key: admin-url
                  optional: true
            - name: SYNESIS_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: synesis-internal-service-auth
                  key: token
                  optional: true
            - name: SYNESIS_YARN_DEFAULT_TIER
              value: synesis-core
            - name: SYNESIS_YARN_PERSIST_USAGE_TO_DB
              value: "true"
            - name: SYNESIS_YARN_POLICY_HARD_REJECT_AFTER
              value: "6"
            - name: SYNESIS_YARN_SESSION_MAX_INPUT_TOKENS
              value: "2000000"
            - name: SYNESIS_YARN_CONSECUTIVE_TOOL_CALLS_LIMIT
              value: "15"
            - name: SYNESIS_YARN_STAGNANT_TOOL_CYCLES_LIMIT
              value: "4"
            - name: SYNESIS_YARN_TOOL_LOOP_NO_USER_ACK_LIMIT
              value: "2"
            - name: SYNESIS_YARN_TOOL_LOOP_SOFT_FAIL_ENABLED
              value: "true"
            - name: SYNESIS_YARN_ARTIFACT_RETRIEVAL_ENABLED
              value: "false"
            # ── Rate limiting ──
            - name: SYNESIS_YARN_RATE_LIMIT_WINDOW_MS
              value: "60000"
            - name: SYNESIS_YARN_RATE_LIMIT_MAX_REQUESTS
              value: "30"
            # ── Circuit breaker ──
            - name: SYNESIS_YARN_BREAKER_FAILURE_THRESHOLD
              value: "5"
            - name: SYNESIS_YARN_BREAKER_RECOVERY_TIMEOUT_MS
              value: "60000"
            # ── Diagnostics ──
            - name: SYNESIS_YARN_DIAGNOSTIC_RING_MAX
              value: "100"
            # ── Stream admission ──
            - name: SYNESIS_YARN_MAX_CONCURRENT_STREAMS
              value: "50"
            - name: SYNESIS_YARN_STREAM_QUEUE_MAX_DEPTH
              value: "100"
            - name: SYNESIS_YARN_STREAM_QUEUE_WAIT_TIMEOUT_MS
              value: "30000"
            # ── Debug protocol ──
            - name: SYNESIS_YARN_DEBUG_PROTOCOL
              value: "true"
            - name: SYNESIS_YARN_VERIFICATION_PLAN_ENABLED
              value: "true"
            - name: SYNESIS_YARN_COMPLETION_GATE_ENABLED
              value: "true"
            - name: SYNESIS_YARN_COMPLETION_GATE_HARD_FAIL
              value: "false"
            # ── Path governance (strict fix-forward defaults) ──
            - name: SYNESIS_YARN_FILE_TOOL_PROJECT_ROOT_ENFORCE
              value: "true"
            - name: SYNESIS_YARN_BASH_PATH_DRIFT_BLOCK_ENABLED
              value: "true"
            - name: SYNESIS_YARN_SESSION_PATH_HINTS_IN_WORKING_FRAME
              value: "true"
            # ── Tool call collapsing (API always useful; rewrite is opt-in per client headers) ──
            - name: SYNESIS_YARN_TOOL_COLLAPSE_ENABLED
              value: "true"
            - name: SYNESIS_YARN_TOOL_COLLAPSE_REWRITE_NON_STREAM
              value: "false"
            - name: SYNESIS_YARN_TOOL_COLLAPSE_DEBOUNCE_MS
              value: "100"
            - name: SYNESIS_YARN_DEDUPE_ENABLED
              value: "true"
            - name: SYNESIS_YARN_DEDUPE_CACHE_MAX
              value: "512"
            - name: SYNESIS_YARN_DEDUPE_MAX_SEARCH_QUERY_CHARS
              value: "4096"
            - name: SYNESIS_YARN_TOOL_PREFIX_CACHE_ENABLED
              value: "true"
            - name: SYNESIS_YARN_TOOL_PREFIX_CACHE_MAX_ENTRIES
              value: "512"
            - name: SYNESIS_YARN_TOOL_PREFIX_CACHE_MAX_ENTRY_BYTES
              value: "262144"
            # ── OTEL (optional — no-op until endpoint is set) ──
            - name: SYNESIS_YARN_OTEL_ENABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: ""
            - name: OTEL_SERVICE_NAME
              value: "synesis-yarn-ts"
            # ── OpenFGA authorization (required) ──
            - name: SYNESIS_OPENFGA_API_URL
              value: "http://openfga.synesis-authz.svc.cluster.local:8080"
            - name: SYNESIS_OPENFGA_STORE_ID
              valueFrom:
                secretKeyRef:
                  name: openfga-client-config
                  key: store-id
            - name: SYNESIS_OPENFGA_MODEL_ID
              valueFrom:
                secretKeyRef:
                  name: openfga-client-config
                  key: model-id
                  optional: true
            - name: SYNESIS_OPENFGA_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openfga-client-config
                  key: auth-token
          envFrom:
            - secretRef:
                name: provider-api-keys
                optional: true
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
