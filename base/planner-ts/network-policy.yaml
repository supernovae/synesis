apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: planner-ts-network-policy
  namespace: synesis-planner
  labels:
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: planner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: synesis-planner-ts
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-admin
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-yarn
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-webui
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synesis-edge
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: synesis-mcp
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # OVN-Kubernetes on OCP 4.21 drops egress when port-level rules or
    # multiple egress blocks are specified for these pods. Work around by
    # allowing all cluster-internal traffic in a single rule. Ingress
    # rules still enforce who can reach planner-ts.
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 172.30.0.0/16
        - ipBlock:
            cidr: 10.128.0.0/14
