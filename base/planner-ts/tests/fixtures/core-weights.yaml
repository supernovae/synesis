thresholds:
  easy_max: 4
  medium_max: 15
  density_threshold: 3
  density_tax: 10
  risk_high: 15
  max_easy_message_length: 200

routing_thresholds:
  bypass_supervisor_below: 0.2
  plan_required_above: 0.7
  critic_required_above: 0.6
  trivial_below: 0.15

complexity_weights:
  logic_basic:
    weight: 2
    keywords: [math, sum, count]
  networking:
    weight: 8
    keywords: [http, request, api]

risk_weights:
  destructive:
    weight: 20
    keywords: [delete all, wipe]

domain_keywords:
  cloud_infra:
    domain: cloud
    keywords: [aws, s3, lambda]
  orchestration:
    domain: kubernetes
    min_hits: 2
    keywords: [k8s, kubernetes, helm]

brevity_weights:
  brevity_cue:
    weight: -3
    keywords: [brief, quick]

risk_veto_triggers:
  - "rm -rf"

intent_classes:
  code:
    keywords: [code, implement, function]
  knowledge:
    keywords: [explain, what is]

pairings:
  - keywords: [kubernetes, migration]
    extra_weight: 8
    axis: risk
    domain: kubernetes
  - keywords: [api, database]
    extra_weight: 5
    axis: complexity
    domain: web_backend

overrides:
  plan_session: ["[STRICT]", "/plan"]
