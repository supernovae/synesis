apiVersion: apps/v1
kind: Deployment
metadata:
  name: synesis-planner-ts
  namespace: synesis-planner
  labels:
    app.kubernetes.io/name: synesis-planner-ts
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: planner
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: synesis-planner-ts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synesis-planner-ts
        app.kubernetes.io/part-of: synesis
        app.kubernetes.io/component: planner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: planner-ts
          image: ghcr.io/supernovae/synesis/planner-ts:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: LOG_LEVEL
              value: "info"
            - name: SYNESIS_PLANNER_TS_OTEL_ENABLED
              value: "false"
            - name: OTEL_SERVICE_NAME
              value: "synesis-planner-ts"
            - name: SYNESIS_PLANNER_TS_MODEL_ID
              value: "Synesis Auto"
            - name: SYNESIS_PLANNER_TS_MODEL_IDS
              value: "Synesis Auto,Synesis Pulse,Synesis Core,Synesis Horizon"
            - name: SYNESIS_PLANNER_TS_LLM_ENABLED
              value: "true"
            - name: SYNESIS_PLANNER_TS_LLM_BASE_URL
              value: "http://litellm-proxy.synesis-gateway.svc.cluster.local:4000/v1"
            - name: SYNESIS_PLANNER_TS_PLANNER_MODEL
              value: "synesis-planner"
            - name: SYNESIS_PLANNER_TS_WRITER_MODEL
              value: "synesis-writer"
            - name: SYNESIS_PLANNER_TS_CRITIC_MODEL
              value: "synesis-critic"
            - name: SYNESIS_PLANNER_TS_AMBIGUITY_SCORER_MODEL
              value: "synesis-ambiguity-scorer"
            - name: SYNESIS_PLANNER_TS_LLM_TIMEOUT_MS
              value: "300000"
            - name: SYNESIS_PLANNER_TS_LLM_RETRY_MAX_ATTEMPTS
              value: "3"
            - name: SYNESIS_PLANNER_TS_LLM_RETRY_BASE_DELAY_MS
              value: "1000"
            - name: SYNESIS_PLANNER_TS_LLM_CIRCUIT_BREAKER_FAILURE_THRESHOLD
              value: "5"
            - name: SYNESIS_PLANNER_TS_LLM_CIRCUIT_BREAKER_RECOVERY_TIMEOUT_MS
              value: "60000"
            - name: SYNESIS_PLANNER_TS_LLM_CIRCUIT_BREAKER_HALF_OPEN_MAX
              value: "1"
            - name: SYNESIS_PLANNER_TS_NODE_TIMEOUT_MS
              value: "60000"
            - name: SYNESIS_PLANNER_TS_RATE_LIMIT_WINDOW_MS
              value: "60000"
            - name: SYNESIS_PLANNER_TS_RATE_LIMIT_MAX_REQUESTS
              value: "30"
            - name: SYNESIS_PLANNER_TS_STREAM_MAX_CONCURRENT
              value: "50"
            - name: SYNESIS_PLANNER_TS_STREAM_QUEUE_MAX
              value: "100"
            - name: SYNESIS_PLANNER_TS_STREAM_QUEUE_WAIT_MS
              value: "30000"
            - name: SYNESIS_PLANNER_TS_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
                  optional: true
            - name: SYNESIS_PLANNER_TS_REQUIRE_BEARER_AUTH
              value: "true"
            - name: SYNESIS_PLANNER_TS_TRUST_FORWARDED_IDENTITY_HEADERS
              value: "true"
            - name: SYNESIS_PLANNER_TS_STRICT_FORWARDED_IDENTITY_MODE
              value: "true"
            - name: SYNESIS_PLANNER_TS_PREFIX_CACHE_MODE
              value: "auto"
            - name: SYNESIS_PLANNER_TS_WRITER_BUDGET_MODE
              value: "audit"
            - name: SYNESIS_PLANNER_TS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: synesis-redis
                  key: url
                  optional: true
            - name: SYNESIS_PLANNER_TS_REDIS_KEY_PREFIX
              value: "synesis:planner:session:"
            - name: SYNESIS_PLANNER_TS_REDIS_SESSION_TTL_S
              value: "14400"
            - name: SYNESIS_PLANNER_TS_SESSION_MAX_SESSIONS
              value: "5000"
            - name: SYNESIS_PLANNER_TS_REDIS_CAS_MAX_RETRIES
              value: "5"
            - name: SYNESIS_PLANNER_TS_HEALTH_MONITOR_ENABLED
              value: "true"
            - name: SYNESIS_PLANNER_TS_HEALTH_MONITOR_INTERVAL_MS
              value: "15000"
            - name: SYNESIS_PLANNER_TS_HEALTH_MONITOR_TIMEOUT_MS
              value: "2000"
            - name: SYNESIS_PLANNER_TS_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: synesis-internal-service-auth
                  key: token
                  optional: true
            - name: SYNESIS_ADMIN_URL
              value: "http://synesis-admin.synesis-admin.svc.cluster.local:8080"
            - name: SYNESIS_ADMIN_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: synesis-internal-service-auth
                  key: token
                  optional: true
            # RAG + web (router retrieveUnified). NornicDB serves graph/vector retrieval; web can use defaults when unset.
            - name: SYNESIS_EMBEDDER_URL
              value: "http://embedder.synesis-rag.svc.cluster.local:8080/v1"
            - name: SYNESIS_NORNIC_URI
              value: "bolt://synesis-nornicdb.synesis-rag.svc.cluster.local:7687"
            - name: SYNESIS_NORNIC_DATABASE
              value: "nornic"
            - name: SYNESIS_RAG_AUTHZ_MODE
              value: "audit"
            - name: SYNESIS_WEB_SEARCH_ENABLED
              value: "true"
            - name: SYNESIS_WEB_SEARCH_URL
              value: "http://searxng.synesis-search.svc.cluster.local:8080"
            # Postgres DSN for PAT resolution + web_search_log rows (Admin Integrations → Web Search).
            - name: SYNESIS_PLANNER_TS_ADMIN_DB_URL
              valueFrom:
                secretKeyRef:
                  name: synesis-admin-db-url
                  key: trace-url
                  optional: true
            - name: SYNESIS_CACHED_INPUT_PRICE_MULTIPLIER
              value: "0.1"
            # ── OpenFGA authorization (required) ──
            - name: SYNESIS_OPENFGA_API_URL
              value: "http://openfga.synesis-authz.svc.cluster.local:8080"
            - name: SYNESIS_OPENFGA_STORE_ID
              valueFrom:
                secretKeyRef:
                  name: openfga-client-config
                  key: store-id
            - name: SYNESIS_OPENFGA_MODEL_ID
              valueFrom:
                secretKeyRef:
                  name: openfga-client-config
                  key: model-id
                  optional: true
            - name: SYNESIS_OPENFGA_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openfga-client-config
                  key: auth-token
          envFrom:
            - secretRef:
                name: provider-api-keys
                optional: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
