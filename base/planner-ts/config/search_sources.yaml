# Planner-ts search source catalog. Keep in sync with repo root search_sources.yaml.
# ============================================================================
# Synesis Search Source Catalog — Single Source of Truth
# ============================================================================
#
# Defines all search sources available to the retrieval pipeline. Each source
# maps to one or more SearXNG engines/categories and carries trust metadata
# used for authority-weighted fusion (RRF + boost).
#
# Search integrations can mount this file or use the repo root catalog and
# derive engine_authority_map entries automatically. Sources with enabled: false
# are ignored unless explicitly requested via prompt aliases.
#
# See docs/WEB_SEARCH.md and the search federation plan for context.
# ============================================================================

# ---------------------------------------------------------------------------
# Source definitions
# ---------------------------------------------------------------------------
#
# Each source declares:
#   id             — unique identifier used in logs, metrics, and evidence metadata
#   label          — human-readable display name (shown in admin UI and citations)
#   description    — what this source covers
#   enabled        — whether to include by default in every retrieval fan-out
#   searxng_params — dict passed to SearXNG (engines, categories, etc.)
#   trust          — authority and origin_type for scoring/fusion
#     authority    — "canonical" | "vetted" | "community" | "external"
#     origin_type  — "internal" | "curated" | "external"
#   weight         — RRF fusion weight multiplier (1.0 = neutral)
#   max_results    — cap results from this source per query
#   fetch_pages    — whether to follow URLs and extract page content
#   domain_policy  — how taxonomy preferred_web_scopes are applied to this source
#     mode         — "prefer" (boost matching domains, default) or "restrict" (allowlist-only)
#     domains      — static list of preferred/allowed domains for this source
#   routing        — when/how this source is selected
#     tags         — domain taxonomy tags that trigger this source
#     task_types   — task type labels that trigger this source
#     prompt_aliases — user-facing keywords that explicitly request this source
#     always       — if true, included in every fan-out regardless of routing
# ---------------------------------------------------------------------------

sources:
  - id: web_general
    label: "Web Search"
    description: "General web search via Google, Bing, DuckDuckGo"
    enabled: true
    searxng_params:
      categories: "general"
    trust:
      authority: "external"
      origin_type: "external"
    weight: 1.0
    max_results: 5
    fetch_pages: true
    domain_policy:
      mode: prefer
      domains: []
    routing:
      tags: []
      task_types: []
      prompt_aliases: ["web", "internet", "search"]
      always: true

  - id: code_general
    label: "Code Search"
    description: "Code-focused search via GitHub and StackOverflow"
    enabled: true
    searxng_params:
      engines: "github,stackoverflow"
    trust:
      authority: "community"
      origin_type: "external"
    weight: 1.1
    max_results: 5
    fetch_pages: false
    domain_policy:
      mode: prefer
      domains: []
    routing:
      tags: ["software-engineering", "programming", "devops"]
      task_types: ["code", "debug", "architecture"]
      prompt_aliases: ["code", "github", "stackoverflow"]
      always: false
      # Internal source examples (GitHub Enterprise, Jira, helpdesk, Confluence) lived here as
      # commented YAML; removed for yamllint comments-indentation. Restore from git history or
      # copy from docs/WEB_SEARCH.md when adding vetted internal engines.
