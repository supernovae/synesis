apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: synesis-planner-ts
  namespace: synesis-planner
  labels:
    app.kubernetes.io/name: synesis-planner-ts
    app.kubernetes.io/part-of: synesis
    app.kubernetes.io/component: planner
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: synesis-planner-ts
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
