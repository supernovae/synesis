# Native Hybrid Retrieval Benchmark Query Set
#
# Covers the major domains in the NornicDB content graph: architecture, kubernetes,
# code (Python/Go/Rust/TypeScript/Java), arXiv/LLM papers and blogs,
# runbooks, licenses, and cross-domain foundations / lifestyle bootstrap YAML.
#
# Relevance labels are generated via pooling: both retrievers run, top-20
# results are unioned, and an LLM judge scores relevance (0/1/2).
# The `auto_judge: true` flag triggers this at benchmark time.
#
# Difficulty levels:
#   easy   — single clear keyword match expected
#   medium — needs term overlap across metadata + text
#   hard   — ambiguous terms, polysemous, or requires multi-field signal

auto_judge: true
judge_model: "synesis-general"

queries:
  # --- Architecture & Cloud ---
  - id: arch-01
    query: "twelve-factor app methodology"
    domain: architecture
    difficulty: easy

