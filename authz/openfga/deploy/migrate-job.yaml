apiVersion: batch/v1
kind: Job
metadata:
  name: openfga-migrate
  namespace: synesis-authz
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: openfga/openfga:v1.8.5
          args: ["migrate"]
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: openfga-config
                  key: OPENFGA_DATASTORE_URI
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
