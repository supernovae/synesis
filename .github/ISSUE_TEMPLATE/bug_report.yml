name: Bug Report
description: Report a problem with the local source-pack tools
labels: [bug, triage]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Include commands and a small public or synthetic example. Do not attach private source packs or libraries.
      placeholder: |
        1. Build/import a source pack
        2. Run a CLI command or call an MCP tool
        3. Observe the error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Repository commit, OS, Node version, and MCP client/version if relevant.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Pack build or validation
        - Library or search
        - MCP integration
        - Saved HTML preparation
        - Documentation or development tools
