version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # npm was added after axios supply-chain work; the first weekly run opens many PRs
  # because versions were never previously tracked—not a Node/npm regression.
  # Groups bundle minor+patch to cut noise; majors stay separate for review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 8
    groups:
      npm-root-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/base/admin/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 8
    groups:
      admin-frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/base/mcp-ts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 8
    groups:
      mcp-ts-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/base/admin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "pip"
    directory: "/base/lsp/gateway"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "pip"
    directory: "/base/rag/indexer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/base/sandbox/image"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "python"
        versions: [">=3.14"]

  - package-ecosystem: "docker"
    directory: "/base/lsp/gateway"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "python"
        versions: [">=3.14"]

  - package-ecosystem: "docker"
    directory: "/base/admin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "python"
        versions: [">=3.14"]

  - package-ecosystem: "docker"
    directory: "/base/planner/bge-reranker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "python"
        versions: [">=3.14"]

  - package-ecosystem: "docker"
    directory: "/base/rag/indexer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "python"
        versions: [">=3.14"]
