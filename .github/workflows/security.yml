name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ---------------------------------------------------------------------------
  # IaC misconfiguration scanning (Checkov — replaces Trivy config scan)
  # Trivy was removed after supply-chain compromise GHSA-69fq-xp46-6x23.
  # ---------------------------------------------------------------------------
  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Checkov (SARIF report)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yml
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: 'checkov-iac'

      - name: Run Checkov (gate — hard fail)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yml
          output_format: cli
          soft_fail: false

  # ---------------------------------------------------------------------------
  # Filesystem vulnerability scanning (Grype — replaces Trivy vuln scan)
  # ---------------------------------------------------------------------------
  grype:
    name: Grype Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Scan filesystem for vulnerabilities
        uses: anchore/scan-action@v7
        id: grype-scan
        with:
          path: .
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
          category: 'grype-vuln'

  bandit:
    name: Bandit (Python Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Run Bandit (report)
        run: |
          uvx "bandit[toml]" -c pyproject.toml -r base/ \
            -x "**/.test-venv/**,**/.venv/**" \
            --severity-level medium \
            --confidence-level medium \
            -f json -o bandit-report.json || true

      - name: Run Bandit (gate)
        run: |
          uvx "bandit[toml]" -c pyproject.toml -r base/ \
            -x "**/.test-venv/**,**/.venv/**" \
            --severity-level medium \
            --confidence-level medium

      - name: Upload Bandit report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  pip-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base-api
            dir: base/images/base-api
          - name: base-ml
            dir: base/images/base-ml
          - name: planner
            dir: base/planner
          - name: admin
            dir: base/admin
          - name: indexer
            dir: base/rag/indexer
          - name: preprocess-service
            dir: base/rag/preprocess-service
          - name: gliner-service
            dir: base/rag/gliner-service
          - name: lsp-gateway
            dir: base/lsp/gateway
          - name: yarn
            dir: base/yarn
          - name: mcp
            dir: base/mcp
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Audit ${{ matrix.name }}
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          # All services now use uv-compiled lockfiles with pinned versions.
          # pip-audit reads the pre-resolved lockfile, bypassing pip's resolver.
          inputs: ${{ matrix.dir }}/requirements.lock
          vulnerability-service: osv
          # Indexer: nltk is transitive via crawl4ai; OSV lists no fixed PyPI version yet (last nltk 3.9.3).
          # See .github/SECURITY.md — remove when nltk publishes a fix.
          ignore-vulns: ${{ matrix.name == 'indexer' && 'CVE-2026-33230 CVE-2026-33231 GHSA-rf74-v2fm-23pw' || '' }}

  semgrep:
    name: Semgrep (Python/OWASP Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Run Semgrep (report)
        run: |
          uvx semgrep scan \
            --config "https://semgrep.dev/p/python" \
            --config "https://semgrep.dev/p/owasp-top-ten" \
            --error --include "*.py" \
            --json --json-output=semgrep-results.json \
            base/planner/app/ base/planner/bge-reranker/app/ base/rag/indexer/app/ base/rag/keyword-service/app/ base/rag/preprocess-service/app/ base/rag/spam-service/app/ base/rag/gliner-service/app/ base/admin/app/ base/mcp/app/ base/lsp/gateway/app/ base/yarn/app/ || true

      - name: Run Semgrep (gate)
        run: |
          uvx semgrep scan \
            --config "https://semgrep.dev/p/python" \
            --config "https://semgrep.dev/p/owasp-top-ten" \
            --error --include "*.py" \
            base/planner/app/ base/planner/bge-reranker/app/ base/rag/indexer/app/ base/rag/keyword-service/app/ base/rag/preprocess-service/app/ base/rag/spam-service/app/ base/rag/gliner-service/app/ base/admin/app/ base/mcp/app/ base/lsp/gateway/app/ base/yarn/app/

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json

  # ---------------------------------------------------------------------------
  # Frontend (JavaScript/TypeScript/React) security
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm Audit (Admin Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: base/admin/frontend
        run: npm ci --ignore-scripts 2>/dev/null || npm install

      - name: npm audit (report)
        working-directory: base/admin/frontend
        run: npm audit --json > npm-audit-report.json || true

      - name: npm audit (gate — high/critical)
        working-directory: base/admin/frontend
        run: npm audit --audit-level=high

      - name: Upload npm audit report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: npm-audit-report
          path: base/admin/frontend/npm-audit-report.json

  semgrep-js:
    name: Semgrep (JS/TS/React Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Run Semgrep on frontend (report)
        run: |
          uvx semgrep scan \
            --config "https://semgrep.dev/p/typescript" \
            --config "https://semgrep.dev/p/react" \
            --config "https://semgrep.dev/p/owasp-top-ten" \
            --config "https://semgrep.dev/p/xss" \
            --error \
            --include "*.ts" --include "*.tsx" --include "*.js" --include "*.jsx" \
            --json --json-output=semgrep-js-results.json \
            base/admin/frontend/src/ || true

      - name: Run Semgrep on frontend (gate)
        run: |
          uvx semgrep scan \
            --config "https://semgrep.dev/p/typescript" \
            --config "https://semgrep.dev/p/react" \
            --config "https://semgrep.dev/p/owasp-top-ten" \
            --config "https://semgrep.dev/p/xss" \
            --error \
            --include "*.ts" --include "*.tsx" --include "*.js" --include "*.jsx" \
            base/admin/frontend/src/

      - name: Upload Semgrep JS results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: semgrep-js-results
          path: semgrep-js-results.json

  # ---------------------------------------------------------------------------
  # Supply-chain guardrails
  # ---------------------------------------------------------------------------
  supply-chain-guard:
    name: Supply-Chain IOC Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for compromised LiteLLM PyPI versions
        run: |
          echo "=== Scanning for compromised LiteLLM versions (1.82.7, 1.82.8) ==="
          FOUND=0
          for pattern in 'litellm==1\.82\.7' 'litellm==1\.82\.8' 'litellm>=1\.82\.7' 'litellm_init\.pth' 'models\.litellm\.cloud'; do
            if grep -rn --include='*.txt' --include='*.lock' --include='*.toml' --include='*.cfg' \
                 --include='*.yaml' --include='*.yml' --include='*.json' \
                 -E "$pattern" . 2>/dev/null; then
              echo "::error::Compromised LiteLLM IOC detected: $pattern"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Supply-chain IOC check FAILED — see above."
            exit 1
          fi
          echo "No compromised LiteLLM indicators found."

      - name: Check for mutable LiteLLM image tags
        run: |
          echo "=== Scanning gateway manifests for floating LiteLLM image tags ==="
          FOUND=0
          for f in base/gateway/helm/values-synesis.yaml base/gateway/litellm-deployment.yaml; do
            if [ -f "$f" ]; then
              if grep -nE 'tag:\s*"?main-stable"?' "$f" || \
                 grep -nE 'image:.*litellm[^:]*:(main-stable|latest)\b' "$f"; then
                echo "::error file=$f::Mutable LiteLLM image tag detected — pin to a versioned tag."
                FOUND=1
              fi
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "All LiteLLM image references are pinned."

      - name: Check for residual Trivy references
        run: |
          echo "=== Scanning for residual Trivy/Aqua Security references ==="
          FOUND=0
          if grep -rnE 'aquasecurity/trivy' .github/workflows/ | grep -v 'grep.*aquasecurity'; then
            echo "::error::Trivy reference detected — removed after supply-chain compromise. Use Checkov + Grype."
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "No Trivy references found in CI workflows."

  # ---------------------------------------------------------------------------
  # Lockfile freshness — ensures committed requirements.lock files match
  # their source requirements.txt. Prevents stale lockfiles from silently
  # drifting from declared dependencies.
  # ---------------------------------------------------------------------------
  lockfile-freshness:
    name: Lockfile Freshness Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Verify lockfiles are up to date
        run: ./scripts/lock-deps.sh --check
