name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  trivy:
    name: Trivy Config Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          trivyignores: '.trivyignore'
          exit-code: '0'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-config'

      - name: Fail on HIGH/CRITICAL misconfigurations
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '1'
          trivyignores: '.trivyignore'

  bandit:
    name: Bandit (Python Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Run Bandit (report)
        run: |
          uvx "bandit[toml]" -r base/ \
            --severity-level medium \
            --confidence-level medium \
            -f json -o bandit-report.json || true

      - name: Run Bandit (gate)
        run: |
          uvx "bandit[toml]" -r base/ \
            --severity-level medium \
            --confidence-level medium

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  pip-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: planner
            dir: base/planner
          - name: admin
            dir: base/admin
          - name: indexer
            dir: base/rag/indexer
          - name: preprocess-service
            dir: base/rag/preprocess-service
          - name: spam-service
            dir: base/rag/spam-service
          - name: lsp-gateway
            dir: base/lsp/gateway
          - name: mcp
            dir: base/mcp
          - name: bge-reranker
            dir: base/planner/bge-reranker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Audit ${{ matrix.name }}
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: ${{ matrix.dir }}/requirements.txt
          vulnerability-service: osv

  semgrep:
    name: Semgrep (Python/OWASP Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Run Semgrep (report)
        run: |
          uvx semgrep scan \
            --config "https://semgrep.dev/p/python" \
            --config "https://semgrep.dev/p/owasp-top-ten" \
            --error --include "*.py" \
            --json --json-output=semgrep-results.json \
            base/planner/app/ base/rag/indexer/app/ base/rag/preprocess-service/app/ base/rag/spam-service/app/ base/admin/app/ base/mcp/app/ || true

      - name: Run Semgrep (gate)
        run: |
          uvx semgrep scan \
            --config "https://semgrep.dev/p/python" \
            --config "https://semgrep.dev/p/owasp-top-ten" \
            --error --include "*.py" \
            base/planner/app/ base/rag/indexer/app/ base/rag/preprocess-service/app/ base/rag/spam-service/app/ base/admin/app/ base/mcp/app/

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json

  # ---------------------------------------------------------------------------
  # Frontend (JavaScript/TypeScript/React) security
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm Audit (Admin Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: base/admin/frontend
        run: npm ci --ignore-scripts 2>/dev/null || npm install

      - name: npm audit (report)
        working-directory: base/admin/frontend
        run: npm audit --json > npm-audit-report.json || true

      - name: npm audit (gate — high/critical)
        working-directory: base/admin/frontend
        run: npm audit --audit-level=high

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: base/admin/frontend/npm-audit-report.json

  semgrep-js:
    name: Semgrep (JS/TS/React Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Run Semgrep on frontend (report)
        run: |
          uvx semgrep scan \
            --config "https://semgrep.dev/p/typescript" \
            --config "https://semgrep.dev/p/react" \
            --config "https://semgrep.dev/p/owasp-top-ten" \
            --config "https://semgrep.dev/p/xss" \
            --error \
            --include "*.ts" --include "*.tsx" --include "*.js" --include "*.jsx" \
            --json --json-output=semgrep-js-results.json \
            base/admin/frontend/src/ || true

      - name: Run Semgrep on frontend (gate)
        run: |
          uvx semgrep scan \
            --config "https://semgrep.dev/p/typescript" \
            --config "https://semgrep.dev/p/react" \
            --config "https://semgrep.dev/p/owasp-top-ten" \
            --config "https://semgrep.dev/p/xss" \
            --error \
            --include "*.ts" --include "*.tsx" --include "*.js" --include "*.jsx" \
            base/admin/frontend/src/

      - name: Upload Semgrep JS results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-js-results
          path: semgrep-js-results.json
