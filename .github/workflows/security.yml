name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  grype:
    name: Grype Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan filesystem for vulnerabilities
        uses: anchore/scan-action@v7
        id: grype-scan
        with:
          path: .
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
          category: 'grype-vuln'

  bandit:
    name: Bandit (Python Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Run Bandit (report)
        run: |
          uvx "bandit[toml]" -c pyproject.toml -r tools/ \
            -x "**/.test-venv/**,**/.venv/**,**/.work/**" \
            --severity-level medium \
            --confidence-level medium \
            -f json -o bandit-report.json || true

      - name: Run Bandit (gate)
        run: |
          uvx "bandit[toml]" -c pyproject.toml -r tools/ \
            -x "**/.test-venv/**,**/.venv/**,**/.work/**" \
            --severity-level medium \
            --confidence-level medium

      - name: Upload Bandit report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  pip-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7

      - name: Audit preparation dependencies
        run: |
          uvx pip-audit \
            -r tools/prepare-html/requirements.lock \
            --disable-pip \
            --require-hashes \
            --vulnerability-service osv \
            --progress-spinner off

  semgrep:
    name: Semgrep (Python/OWASP Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Run Semgrep (report)
        run: |
          uvx semgrep scan \
            --config "https://semgrep.dev/p/python" \
            --config "https://semgrep.dev/p/owasp-top-ten" \
            --error --include "*.py" \
            --json --json-output=semgrep-results.json \
            tools/prepare-html/ || true

      - name: Run Semgrep (gate)
        run: |
          uvx semgrep scan \
            --config "https://semgrep.dev/p/python" \
            --config "https://semgrep.dev/p/owasp-top-ten" \
            --error --include "*.py" \
            tools/prepare-html/

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: npm audit (report)
        run: npm audit --json > npm-audit-report.json || true

      - name: npm audit (gate — high/critical)
        run: npm audit --audit-level=high

      - name: Upload npm audit report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit-report.json

  semgrep-ts-services:
    name: Semgrep (knowledge TypeScript Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Run Semgrep on knowledge TypeScript (report)
        run: |
          uvx semgrep scan \
            --config "https://semgrep.dev/p/typescript" \
            --config "https://semgrep.dev/p/owasp-top-ten" \
            --config "https://semgrep.dev/p/xss" \
            --include "*.ts" --include "*.tsx" --include "*.js" --include "*.jsx" --include "*.mjs" \
            --json --json-output=semgrep-ts-services-results.json \
            packages/synesis-mcp/src/ scripts/ || true

      - name: Run Semgrep on knowledge TypeScript (gate)
        run: |
          uvx semgrep scan \
            --config "https://semgrep.dev/p/typescript" \
            --config "https://semgrep.dev/p/owasp-top-ten" \
            --config "https://semgrep.dev/p/xss" \
            --severity ERROR \
            --error \
            --include "*.ts" --include "*.tsx" --include "*.js" --include "*.jsx" --include "*.mjs" \
            packages/synesis-mcp/src/ scripts/

      - name: Upload Semgrep knowledge results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: semgrep-ts-services-results
          path: semgrep-ts-services-results.json

  lockfile-freshness:
    name: Lockfile Freshness Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.20"

      - name: Verify lockfile checker against local package fixtures
        run: python3 -m unittest discover -s tests/dependencies -v

      - name: Verify declared requirements at locked versions
        run: ./scripts/lock-deps.sh --check
