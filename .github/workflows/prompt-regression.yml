name: Prompt & Citation Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "base/planner-ts/src/**"
      - "tests/prompts/**"

  workflow_dispatch:
    inputs:
      categories:
        description: "Space-separated categories (default: all live categories)"
        type: string
        default: "adversarial retrieval_quality node_routing grounding"
      model:
        description: "Model name to test against"
        type: string
        default: "Synesis"

  release:
    types: [published]

permissions:
  contents: read

# Live suite (user-space chat): planner URL + PAT:
#   Variable SYNESIS_PLANNER_EVAL_URL
#   Secret   SYNESIS_TEST_PAT_TOKEN

jobs:
  prompt-suite-offline:
    name: Prompt Suite Validation (Offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system pyyaml

      - name: Validate prompt suite YAML
        run: |
          python -c "
          import yaml, sys
          with open('tests/prompts/test_prompts.yaml') as f:
              prompts = yaml.safe_load(f)
          ids = [p['id'] for p in prompts]
          dupes = [i for i in ids if ids.count(i) > 1]
          if dupes:
              print(f'Duplicate IDs: {set(dupes)}')
              sys.exit(1)
          required_cats = {'adversarial', 'retrieval_quality', 'node_routing', 'grounding'}
          cats = {p.get('category','') for p in prompts}
          missing = required_cats - cats
          if missing:
              print(f'Missing required categories: {missing}')
              sys.exit(1)
          print(f'Suite OK: {len(prompts)} prompts, {len(cats)} categories')
          print(f'Required categories present: {required_cats}')
          "

      - name: Validate test harness loads
        run: |
          python -c "
          import sys; sys.path.insert(0, 'tests/prompts')
          from run_test_suite import load_suite, group_sequences, CATEGORY_DEFAULTS
          from pathlib import Path
          suite = load_suite(Path('tests/prompts/test_prompts.yaml'))
          batches = group_sequences(suite)
          print(f'Loaded {len(suite)} prompts in {len(batches)} batches')
          assert len(suite) > 0, 'Empty suite'
          "

  prompt-suite-live:
    name: Prompt Regression (Live)
    needs: [prompt-suite-offline]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'pull_request' && vars.SYNESIS_VALIDATION_ENABLED == 'true')
    runs-on: self-hosted
    timeout-minutes: 30
    environment: validation
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system httpx pyyaml

      - name: Run prompt regression suite
        env:
          SYNESIS_API_URL: ${{ vars.SYNESIS_PLANNER_EVAL_URL }}
          SYNESIS_TEST_PAT_TOKEN: ${{ secrets.SYNESIS_TEST_PAT_TOKEN }}
        run: |
          if [ -z "${SYNESIS_API_URL}" ]; then
            echo "Missing repository variable SYNESIS_PLANNER_EVAL_URL."
            exit 1
          fi
          if [ -z "${SYNESIS_TEST_PAT_TOKEN:-}" ]; then
            echo "Missing secret SYNESIS_TEST_PAT_TOKEN."
            exit 1
          fi
          CATS="${{ inputs.categories || 'adversarial retrieval_quality node_routing grounding' }}"
          python tests/prompts/run_test_suite.py \
            --api-url "$SYNESIS_API_URL" \
            --api-key "$SYNESIS_TEST_PAT_TOKEN" \
            --model "${{ inputs.model || 'Synesis' }}" \
            --category $CATS \
            --output prompt-regression-report.yaml

      - name: Check for failures
        run: |
          python -c "
          import yaml, sys
          with open('prompt-regression-report.yaml') as f:
              report = yaml.safe_load(f)
          fails = report['summary']['fail']
          if fails > 0:
              print(f'REGRESSION: {fails} prompt(s) failed')
              for r in report['failures']:
                  print(f'  - {r[\"id\"]}: {r[\"verdict\"]}')
                  for c in r['checks']:
                      if c['status'] == 'fail':
                          print(f'      {c[\"check\"]}: {c[\"detail\"]}')
              sys.exit(1)
          print(f'All {report[\"summary\"][\"pass\"]} prompts passed')
          "

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prompt-regression-report
          path: prompt-regression-report.yaml
          retention-days: 30
