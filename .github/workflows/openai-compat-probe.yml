# Manual / scheduled gap report — never blocks merge.
#
# GitHub configuration:
#   Variable SYNESIS_PLANNER_EVAL_URL — planner base URL (e.g. https://api.kybern.dev).
#   Secret   SYNESIS_TEST_PAT_TOKEN — PAT for user-space /v1 (models + chat probe).
# Optional:
#   Variable SYNESIS_YARN_EVAL_URL — Yarn OpenAI-compatible base URL (if you probe Yarn too).

name: OpenAI compat probe (optional)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 0" # weekly Sunday 12:00 UTC

jobs:
  probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Run synesis_openai_capability_probe
        env:
          SYNESIS_PROBE_PLANNER_URL: ${{ vars.SYNESIS_PLANNER_EVAL_URL }}
          SYNESIS_PROBE_YARN_URL: ${{ vars.SYNESIS_YARN_EVAL_URL }}
          SYNESIS_TEST_PAT_TOKEN: ${{ secrets.SYNESIS_TEST_PAT_TOKEN }}
        run: |
          if [ -z "${SYNESIS_PROBE_PLANNER_URL}" ] && [ -z "${SYNESIS_PROBE_YARN_URL}" ]; then
            echo "Set repository variable SYNESIS_PLANNER_EVAL_URL and/or SYNESIS_YARN_EVAL_URL — skipping probe."
            exit 0
          fi
          python3 scripts/synesis_openai_capability_probe.py -o probe-report.json || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openai-probe-report
          path: probe-report.json
          if-no-files-found: ignore
