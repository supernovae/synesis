name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on all shell scripts
        run: |
          find scripts/ -name '*.sh' -type f | xargs shellcheck --severity=warning --shell=bash
          find base/ -name '*.sh' -type f | xargs shellcheck --severity=warning --shell=bash || true

  python:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Ruff check
        run: uvx ruff check base/ --output-format=github

      - name: Ruff format check
        run: uvx ruff format --check base/

  dead-code:
    name: Dead code (vulture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Sync dev group (vulture)
        run: uv sync --group dev

      - name: Vulture
        run: ./scripts/check-dead-code.sh

  yaml:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Run yamllint
        run: uvx yamllint -c .yamllint.yml base/ overlays/ models.yaml

  kustomize:
    name: Kustomize Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        overlay: [api, model, dev-models, dev-webui, jobs, jobs-prod, jobs-staging]
    steps:
      - uses: actions/checkout@v6

      - name: Install kustomize
        run: |
          curl -sL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Validate kustomize build (${{ matrix.overlay }})
        run: kustomize build overlays/${{ matrix.overlay }} > /dev/null

  admin-tests:
    name: Admin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv pip install --system -r base/images/base-api/requirements.lock
          uv pip install --system -r base/admin/requirements.lock
          uv pip install --system "pytest>=8"

      - name: Admin pytest
        working-directory: base/admin
        run: PYTHONPATH=. python -m pytest tests/ -q --tb=short

  yarn-ts-tests:
    name: Yarn-TS typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: base/yarn-ts
        run: npm ci

      - name: Typecheck
        working-directory: base/yarn-ts
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: base/yarn-ts
        run: npx vitest run

  mcp-ts-tests:
    name: MCP-TS typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: base/mcp-ts
        run: npm ci

      - name: Typecheck
        working-directory: base/mcp-ts
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: base/mcp-ts
        run: npx vitest run

  planner-ts-tests:
    name: Planner-TS typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install root workspace dependencies
        run: npm ci

      - name: Install planner-ts dependencies
        working-directory: base/planner-ts
        run: npm ci

      - name: Unit tests
        working-directory: base/planner-ts
        run: npx vitest run

  hadolint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install hadolint
        run: |
          curl -sL -o hadolint "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64"
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/

      - name: Lint Dockerfiles and Containerfiles
        run: |
          status=0
          for df in $(find base/ \( -name 'Dockerfile' -o -name 'Containerfile' \) -type f | sort); do
            echo "--- $df ---"
            hadolint \
              --ignore DL3008 --ignore DL3013 --ignore DL3018 \
              --ignore DL3016 --ignore DL3042 \
              --failure-threshold error \
              "$df" || status=1
          done
          exit "$status"
