name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on all shell scripts
        run: |
          find scripts base \
            -path '*/.venv/*' -prune -o \
            -path '*/.test-venv/*' -prune -o \
            -path '*/node_modules/*' -prune -o \
            -path '*/.work/*' -prune -o \
            -name '*.sh' -type f -print |
            xargs shellcheck --severity=warning --shell=bash

  python:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Ruff check
        run: uvx ruff check base/ --output-format=github

      - name: Ruff format check
        run: uvx ruff format --check base/

  yaml:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Run yamllint
        run: uvx yamllint -c .yamllint.yml base/ overlays/

  docs-reference-integrity:
    name: Docs Reference Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate doc and rule references
        run: python3 scripts/check-doc-reference-integrity.py

  authz-coverage:
    name: Auth/Authz Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify admin and MCP routes declare auth
        run: python3 scripts/check-authz-coverage.py

  kustomize:
    name: Kustomize Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        overlay: [api, model, dev-models, dev-webui, jobs, jobs-prod, jobs-staging]
    steps:
      - uses: actions/checkout@v7

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=v5.7.1
          curl -fsSL -o /tmp/kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp kustomize
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize

      - name: Validate kustomize build (${{ matrix.overlay }})
        run: kustomize build overlays/${{ matrix.overlay }} > /dev/null

  admin-tests:
    name: Admin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv pip install --system -r base/images/base-api/requirements.lock
          uv pip install --system -r base/admin/requirements.lock
          uv pip install --system "pytest>=8" "pytest-asyncio>=0.23" "pytest-cov>=7"

      - name: Admin pytest
        working-directory: base/admin
        run: >-
          PYTHONPATH=.:../images/base-api/synesis-telemetry
          python -m pytest tests/ -q --tb=short
          --cov=app --cov-branch --cov-report=term --cov-fail-under=44

  indexer-tests:
    name: Indexer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          uv pip install --system -r base/images/base-api/requirements.lock
          uv pip install --system -r base/rag/indexer/requirements.lock
          uv pip install --system "pytest>=8" "pytest-asyncio>=0.23"
      - name: Indexer pytest
        working-directory: base/rag/indexer
        run: PYTHONPATH=.:../../images/base-api/synesis-telemetry python -m pytest tests/ -q --tb=short

  ast-mcp-tests:
    name: AST MCP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          uv pip install --system -r base/ast-mcp/requirements.lock
          uv pip install --system "pytest>=8"
      - name: AST MCP pytest
        working-directory: base/ast-mcp
        run: python -m pytest tests/ -q --tb=short

  webui-tests:
    name: WebUI override tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv pip install --system "pytest>=8"
      - name: WebUI pytest
        run: python -m pytest base/webui/tests -q --tb=short

  yarn-ts-tests:
    name: Yarn-TS typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Root workspace install — matches base/yarn-ts/Containerfile + catches missing workspace builds (e.g. synesis-mcp-tools).
      - name: Install root workspace dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace packages (same order as yarn-ts Containerfile)
        run: |
          npm run build -w packages/synesis-telemetry
          npm run build -w packages/synesis-context-trust
          npm run build -w packages/synesis-auth-contracts
          npm run build -w packages/synesis-oidc-auth
          npm run build -w packages/synesis-mcp-tools
          npm run build -w packages/synesis-upper-harness

      - name: Typecheck
        working-directory: base/yarn-ts
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        working-directory: base/yarn-ts
        run: npx vitest run

  synesis-mcp-tests:
    name: Synesis MCP typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Root install + build shared packages so workspace/file dependencies resolve with dist/*.d.ts.
      - name: Install root workspace dependencies
        run: npm ci --ignore-scripts

      - name: Build Synesis MCP workspace dependencies
        run: |
          npm run build -w packages/synesis-auth-contracts
          npm run build -w packages/synesis-oidc-auth
          npm run build -w packages/synesis-mcp-tools

      - name: Install dependencies
        working-directory: base/synesis-mcp
        run: npm ci

      - name: Typecheck
        working-directory: base/synesis-mcp
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: base/synesis-mcp
        run: npx vitest run

  admin-mcp-ts-tests:
    name: Admin MCP-TS typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: base/admin-mcp-ts
        run: npm install

      - name: Typecheck
        working-directory: base/admin-mcp-ts
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: base/admin-mcp-ts
        run: npx vitest run

  admin-frontend:
    name: Admin frontend lint + build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: base/admin/frontend
        run: npm ci

      - name: ESLint
        working-directory: base/admin/frontend
        run: npm run lint

      - name: Build
        working-directory: base/admin/frontend
        run: npm run build

      - name: Unit tests
        working-directory: base/admin/frontend
        run: npm test

  planner-ts-tests:
    name: Planner-TS typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install root workspace dependencies
        run: npm ci

      - name: Build workspace packages
        run: |
          npm run build -w packages/synesis-telemetry
          npm run build -w packages/synesis-context-trust
          npm run build -w packages/synesis-auth-contracts
          npm run build -w packages/synesis-upper-harness

      - name: Unit tests
        working-directory: base/planner-ts
        run: npx vitest run

      - name: Context-trust shared fixtures + package tests
        run: npm run test -w packages/synesis-context-trust

  hadolint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install hadolint
        run: |
          curl -sL -o hadolint "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64"
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/

      - name: Lint Dockerfiles and Containerfiles
        run: |
          status=0
          for df in $(find base/ \( -name 'Dockerfile' -o -name 'Containerfile' \) -type f | sort); do
            echo "--- $df ---"
            hadolint \
              --ignore DL3008 --ignore DL3013 --ignore DL3018 \
              --ignore DL3016 --ignore DL3042 \
              --failure-threshold error \
              "$df" || status=1
          done
          exit "$status"
