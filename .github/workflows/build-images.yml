name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - 'base/**/Dockerfile'
      - 'base/**/Containerfile'
      - 'base/**/requirements.txt'
      - 'base/**/requirements.lock'
      - 'base/**/app/**'
      - 'base/**/frontend/**'
      - 'base/**/plugins/**'
      - 'base/**/alembic/**'
      - 'base/**/*.sh'
      - 'base/**/*.yaml'
      - 'base/images/**'
      - 'base/sandbox/image/**'
      - 'base/rag/indexer/**'
      - 'base/rag/preprocess-service/**'
      - 'base/rag/spam-service/**'
      - 'base/rag/knowledge-base/**'
      - 'base/synesis-mcp/**'
      - 'base/ast-mcp/**'
      - 'base/admin-mcp-ts/**'
      - 'base/yarn-ts/**'
      - 'base/planner-ts/**'
      - 'base/security/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'base/quality-runner/**'
      - 'base/webui/**'
      - 'benchmarks/corpus/**'
      - 'tools/curator/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., v0.1.0). Defaults to sha-<commit>.'
        required: false
        type: string
      images:
        description: 'Comma-separated list of images to build (empty = all)'
        required: false
        type: string
      platforms:
        description: 'Override build platforms (e.g., linux/amd64 or linux/amd64,linux/arm64)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/synesis

permissions:
  contents: read
  packages: write

jobs:
  # -----------------------------------------------------------------------
  # Detect which paths changed so we only rebuild affected images.
  # workflow_dispatch bypasses detection and builds everything (or --images).
  # -----------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      base-api: ${{ steps.filter.outputs.base-api }}
      base-ml: ${{ steps.filter.outputs.base-ml }}
      base-devtools: ${{ steps.filter.outputs.base-devtools }}
      admin: ${{ steps.filter.outputs.admin }}
      sandbox: ${{ steps.filter.outputs.sandbox }}
      bge-reranker: ${{ steps.filter.outputs.bge-reranker }}
      indexer: ${{ steps.filter.outputs.indexer }}
      keyword-service: ${{ steps.filter.outputs.keyword-service }}
      gliner-service: ${{ steps.filter.outputs.gliner-service }}
      preprocess-service: ${{ steps.filter.outputs.preprocess-service }}
      spam-service: ${{ steps.filter.outputs.spam-service }}
      quality-runner: ${{ steps.filter.outputs.quality-runner }}
      open-webui: ${{ steps.filter.outputs.open-webui }}
      synesis-mcp: ${{ steps.filter.outputs.synesis-mcp }}
      ast-mcp: ${{ steps.filter.outputs.ast-mcp }}
      vision-worker: ${{ steps.filter.outputs.vision-worker }}
      admin-mcp-ts: ${{ steps.filter.outputs.admin-mcp-ts }}
      yarn-ts: ${{ steps.filter.outputs.yarn-ts }}
      planner-ts: ${{ steps.filter.outputs.planner-ts }}
      any-base: ${{ steps.aggregate.outputs.any-base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            base-api:
              - 'base/images/base-api/**'
            base-ml:
              - 'base/images/base-ml/**'
            base-devtools:
              - 'base/images/base-devtools/**'
              - 'base/images/base-api/synesis-telemetry/**'
            admin:
              - 'base/admin/**'
            sandbox:
              - 'base/sandbox/image/**'
            bge-reranker:
              - 'base/planner/bge-reranker/**'
            indexer:
              - 'base/rag/indexer/**'
              - 'base/images/base-api/synesis-telemetry/**'
            keyword-service:
              - 'base/rag/keyword-service/**'
            gliner-service:
              - 'base/rag/gliner-service/**'
            preprocess-service:
              - 'base/rag/preprocess-service/**'
            spam-service:
              - 'base/rag/spam-service/**'
            quality-runner:
              - 'base/quality-runner/**'
              - 'benchmarks/corpus/**'
              - 'tools/curator/**'
            open-webui:
              - 'base/webui/**'
            synesis-mcp:
              - 'base/synesis-mcp/**'
              - 'packages/synesis-mcp-tools/**'
            ast-mcp:
              - 'base/ast-mcp/**'
            vision-worker:
              - 'base/vision-worker/**'
            admin-mcp-ts:
              - 'base/admin-mcp-ts/**'
              - 'base/admin/kustomization.yaml'
            yarn-ts:
              - 'base/yarn-ts/**'
              - 'packages/synesis-telemetry/**'
              - 'packages/synesis-agent-orchestration/**'
              - 'package.json'
              - 'package-lock.json'
            planner-ts:
              - 'base/planner-ts/**'
              - 'packages/synesis-telemetry/**'
              - 'package.json'
              - 'package-lock.json'

      - name: Aggregate base changes
        id: aggregate
        run: |
          if [[ "${{ steps.filter.outputs.base-api }}" == "true" \
             || "${{ steps.filter.outputs.base-ml }}" == "true" \
             || "${{ steps.filter.outputs.base-devtools }}" == "true" ]]; then
            echo "any-base=true" >> "$GITHUB_OUTPUT"
          else
            echo "any-base=false" >> "$GITHUB_OUTPUT"
          fi

  determine-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      timestamp: ${{ steps.meta.outputs.timestamp }}
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Get build metadata
        id: meta
        run: |
          echo "timestamp=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Stage 1: Base images — only rebuilt when their files change.
  # -----------------------------------------------------------------------
  build-base-api:
    needs: [determine-tag, detect-changes]
    if: >-
      needs.detect-changes.outputs.base-api == 'true'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Filter by input
        id: filter
        if: inputs.images != ''
        run: |
          if ! echo ",${{ inputs.images }}," | grep -qi ",synesis-base-api,"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.filter.outputs.skip != 'true'
      - uses: docker/setup-qemu-action@v4
        if: steps.filter.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.filter.outputs.skip != 'true'
      - uses: docker/login-action@v4
        if: steps.filter.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.filter.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: base/images/base-api
          file: base/images/base-api/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/synesis-base-api:${{ needs.determine-tag.outputs.tag }}
            ${{ env.REGISTRY }}/synesis-base-api:latest
          cache-from: type=gha,scope=synesis-base-api
          cache-to: type=gha,mode=max,scope=synesis-base-api

      - name: Generate SBOM (Syft)
        if: steps.filter.outputs.skip != 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/synesis-base-api:${{ needs.determine-tag.outputs.tag }}
          artifact-name: sbom-synesis-base-api
          output-file: sbom-synesis-base-api.cyclonedx.json
          format: cyclonedx-json

      - name: Scan image (Grype)
        if: steps.filter.outputs.skip != 'true'
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.REGISTRY }}/synesis-base-api:${{ needs.determine-tag.outputs.tag }}
          fail-build: false
          severity-cutoff: critical
          output-format: table

  build-base-devtools:
    needs: [determine-tag, detect-changes]
    if: >-
      needs.detect-changes.outputs.base-devtools == 'true'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Filter by input
        id: filter
        if: inputs.images != ''
        run: |
          if ! echo ",${{ inputs.images }}," | grep -qi ",synesis-base-devtools,"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.filter.outputs.skip != 'true'
      - uses: docker/setup-qemu-action@v4
        if: steps.filter.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.filter.outputs.skip != 'true'
      - uses: docker/login-action@v4
        if: steps.filter.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.filter.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          # Context must be base/images so COPY base-api/synesis-telemetry/ resolves
          # (matches scripts/build-images.sh synesis-base-devtools entry).
          context: base/images
          file: base/images/base-devtools/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/synesis-base-devtools:${{ needs.determine-tag.outputs.tag }}
            ${{ env.REGISTRY }}/synesis-base-devtools:latest
          cache-from: type=gha,scope=synesis-base-devtools
          cache-to: type=gha,mode=max,scope=synesis-base-devtools

      - name: Generate SBOM (Syft)
        if: steps.filter.outputs.skip != 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/synesis-base-devtools:${{ needs.determine-tag.outputs.tag }}
          artifact-name: sbom-synesis-base-devtools
          output-file: sbom-synesis-base-devtools.cyclonedx.json
          format: cyclonedx-json

      - name: Scan image (Grype)
        if: steps.filter.outputs.skip != 'true'
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.REGISTRY }}/synesis-base-devtools:${{ needs.determine-tag.outputs.tag }}
          fail-build: false
          severity-cutoff: critical
          output-format: table

  build-base-ml:
    needs: [determine-tag, detect-changes, build-base-api]
    if: >-
      !cancelled()
      && needs.determine-tag.result == 'success'
      && needs.detect-changes.result == 'success'
      && (needs.detect-changes.outputs.base-ml == 'true'
      || needs.detect-changes.outputs.base-api == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Filter by input
        id: filter
        if: inputs.images != ''
        run: |
          if ! echo ",${{ inputs.images }}," | grep -qi ",synesis-base-ml,"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.filter.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.filter.outputs.skip != 'true'
      - uses: docker/login-action@v4
        if: steps.filter.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve base-api tag
        if: steps.filter.outputs.skip != 'true'
        id: base
        run: |
          if [[ "${{ needs.detect-changes.outputs.base-api }}" == "true" ]]; then
            echo "tag=${{ needs.determine-tag.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.filter.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: base/images/base-ml
          file: base/images/base-ml/Dockerfile
          # ML base: amd64-only (torch/CUDA wheels not validated for arm64 yet)
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/synesis-base-api:${{ steps.base.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/synesis-base-ml:${{ needs.determine-tag.outputs.tag }}
            ${{ env.REGISTRY }}/synesis-base-ml:latest
          cache-from: type=gha,scope=synesis-base-ml
          cache-to: type=gha,mode=max,scope=synesis-base-ml

      - name: Generate SBOM (Syft)
        if: steps.filter.outputs.skip != 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/synesis-base-ml:${{ needs.determine-tag.outputs.tag }}
          artifact-name: sbom-synesis-base-ml
          output-file: sbom-synesis-base-ml.cyclonedx.json
          format: cyclonedx-json

      - name: Scan image (Grype)
        if: steps.filter.outputs.skip != 'true'
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.REGISTRY }}/synesis-base-ml:${{ needs.determine-tag.outputs.tag }}
          fail-build: false
          severity-cutoff: critical
          output-format: table

  # -----------------------------------------------------------------------
  # Stage 2: Service images — only rebuilt when their files (or base) change.
  # When base images are unchanged, services reference :latest from GHCR.
  # -----------------------------------------------------------------------
  build-services:
    needs: [determine-tag, detect-changes, build-base-api, build-base-devtools, build-base-ml]
    if: always() && needs.determine-tag.result == 'success' && needs.detect-changes.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ------- Multi-arch (amd64 + arm64) -------
          - name: admin
            dockerfile: base/admin/Dockerfile
            context: base/admin
            base_arg: synesis-base-api
            change_key: admin
            base_change_key: base-api
            platforms: linux/amd64,linux/arm64
          - name: sandbox
            dockerfile: base/sandbox/image/Dockerfile
            context: base/sandbox/image
            base_arg: synesis-base-devtools
            change_key: sandbox
            base_change_key: base-devtools
            platforms: linux/amd64,linux/arm64
          - name: keyword-service
            dockerfile: base/rag/keyword-service/Dockerfile
            context: base/rag/keyword-service
            base_arg: synesis-base-api
            change_key: keyword-service
            base_change_key: base-api
            platforms: linux/amd64,linux/arm64
          - name: preprocess-service
            dockerfile: base/rag/preprocess-service/Dockerfile
            context: base/rag/preprocess-service
            base_arg: synesis-base-api
            change_key: preprocess-service
            base_change_key: base-api
            platforms: linux/amd64,linux/arm64
          - name: quality-runner
            dockerfile: base/quality-runner/Dockerfile
            context: .
            base_arg: synesis-base-api
            change_key: quality-runner
            base_change_key: base-api
            platforms: linux/amd64,linux/arm64
          - name: synesis-mcp
            dockerfile: base/synesis-mcp/Containerfile
            context: .
            base_arg: ""
            change_key: synesis-mcp
            base_change_key: ""
            platforms: linux/amd64,linux/arm64
          # GHCR image name synesis-ast-mcp (ast-mcp push failed with write_package in CI).
          - name: synesis-ast-mcp
            dockerfile: base/ast-mcp/Dockerfile
            context: base/ast-mcp
            base_arg: synesis-base-api
            change_key: ast-mcp
            base_change_key: base-api
            platforms: linux/amd64,linux/arm64
          - name: admin-mcp-ts
            dockerfile: base/admin-mcp-ts/Containerfile
            context: .
            base_arg: ""
            change_key: admin-mcp-ts
            base_change_key: ""
            platforms: linux/amd64,linux/arm64
          - name: yarn-ts
            dockerfile: base/yarn-ts/Containerfile
            context: .
            base_arg: ""
            change_key: yarn-ts
            base_change_key: ""
            platforms: linux/amd64,linux/arm64
          - name: planner-ts
            dockerfile: base/planner-ts/Containerfile
            context: .
            base_arg: ""
            change_key: planner-ts
            base_change_key: ""
            platforms: linux/amd64,linux/arm64
          # ------- amd64-only (ML/torch/Playwright — arm64 not yet validated) -------
          - name: bge-reranker
            dockerfile: base/planner/bge-reranker/Dockerfile
            context: base/planner/bge-reranker
            base_arg: synesis-base-ml
            change_key: bge-reranker
            base_change_key: base-ml
            platforms: linux/amd64
          - name: indexer
            dockerfile: base/rag/indexer/Dockerfile
            context: base
            base_arg: ""
            change_key: indexer
            base_change_key: ""
            platforms: linux/amd64
          - name: gliner-service
            dockerfile: base/rag/gliner-service/Dockerfile
            context: base/rag/gliner-service
            base_arg: synesis-base-ml
            change_key: gliner-service
            base_change_key: base-ml
            platforms: linux/amd64
          - name: spam-service
            dockerfile: base/rag/spam-service/Dockerfile
            context: base/rag/spam-service
            base_arg: synesis-base-ml
            change_key: spam-service
            base_change_key: base-ml
            platforms: linux/amd64
          - name: open-webui
            dockerfile: base/webui/Dockerfile
            context: base/webui
            base_arg: ""
            change_key: open-webui
            base_change_key: ""
            platforms: linux/amd64
          - name: vision-worker
            dockerfile: base/vision-worker/Dockerfile
            context: base/vision-worker
            base_arg: ""
            change_key: vision-worker
            base_change_key: ""
            platforms: linux/amd64

    steps:
      - name: Check if build needed
        id: check
        run: |
          DISPATCH="${{ github.event_name == 'workflow_dispatch' }}"
          INPUT_FILTER="${{ inputs.images }}"
          SELF_CHANGED='${{ toJSON(needs.detect-changes.outputs) }}'
          CHANGE_KEY="${{ matrix.change_key }}"
          BASE_KEY="${{ matrix.base_change_key }}"

          # workflow_dispatch with no filter -> build all
          if [[ "$DISPATCH" == "true" && -z "$INPUT_FILTER" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # workflow_dispatch with filter -> check if this image is in the list
          if [[ "$DISPATCH" == "true" && -n "$INPUT_FILTER" ]]; then
            if echo ",$INPUT_FILTER," | grep -qi ",${{ matrix.name }},"; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
            elif [[ "$CHANGE_KEY" == "ast-mcp" ]] && echo ",$INPUT_FILTER," | grep -qi ",ast-mcp,"; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # push event -> check if service or its base changed
          SELF=$(echo "$SELF_CHANGED" | python3 -c "import sys,json; print(json.load(sys.stdin).get('$CHANGE_KEY','false'))")
          BASE="false"
          if [[ -n "$BASE_KEY" ]]; then
            BASE=$(echo "$SELF_CHANGED" | python3 -c "import sys,json; print(json.load(sys.stdin).get('$BASE_KEY','false'))")
          fi

          if [[ "$SELF" == "true" || "$BASE" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.check.outputs.skip != 'true'
      - uses: docker/setup-qemu-action@v4
        if: steps.check.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.skip != 'true'
      - uses: docker/login-action@v4
        if: steps.check.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve base image tag
        if: steps.check.outputs.skip != 'true' && matrix.base_arg != ''
        id: base
        run: |
          BASE_KEY="${{ matrix.base_change_key }}"
          SELF_CHANGED='${{ toJSON(needs.detect-changes.outputs) }}'
          BASE_CHANGED=$(echo "$SELF_CHANGED" | python3 -c "import sys,json; print(json.load(sys.stdin).get('$BASE_KEY','false'))")
          BASE_REBUILDING="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT_FILTER="${{ inputs.images }}"
            if [[ -z "$INPUT_FILTER" ]]; then
              BASE_REBUILDING="true"
            elif echo ",$INPUT_FILTER," | grep -qi ",${{ matrix.base_arg }},"; then
              BASE_REBUILDING="true"
            fi
          elif [[ "$BASE_CHANGED" == "true" ]]; then
            BASE_REBUILDING="true"
          fi
          if [[ "$BASE_REBUILDING" == "true" ]]; then
            REF="${{ env.REGISTRY }}/${{ matrix.base_arg }}:${{ needs.determine-tag.outputs.tag }}"
          else
            REF="${{ env.REGISTRY }}/${{ matrix.base_arg }}:latest"
          fi
          echo "arg=BASE_IMAGE=$REF" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "rebuilding=$BASE_REBUILDING" >> "$GITHUB_OUTPUT"

      - name: Verify base image platform support
        if: steps.check.outputs.skip != 'true' && matrix.base_arg != '' && steps.base.outputs.rebuilding != 'true'
        id: platform-check
        run: |
          REQUESTED="${{ inputs.platforms || matrix.platforms }}"
          if [[ "$REQUESTED" != *"arm64"* ]]; then
            exit 0
          fi
          BASE_REF="${{ steps.base.outputs.ref }}"
          if docker buildx imagetools inspect "$BASE_REF" 2>&1 | grep -q 'linux/arm64'; then
            echo "Base image $BASE_REF supports arm64"
          else
            echo "::warning::Base image $BASE_REF lacks arm64 manifest — building ${{ matrix.name }} as amd64-only"
            echo "override=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image tags
        if: steps.check.outputs.skip != 'true'
        id: tags
        env:
          IMAGE_NAME: ${{ matrix.name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          PRIMARY_TAG: ${{ needs.determine-tag.outputs.tag }}
        run: |
          VERSION_TAG=""
          if [[ "$IMAGE_NAME" == "open-webui" ]]; then
            VERSION_TAG="$(sed -nE 's/^FROM ghcr\.io\/open-webui\/open-webui:([^[:space:]]+).*/\1/p' "$DOCKERFILE" | head -n 1)"
          fi
          {
            echo "tags<<EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:${PRIMARY_TAG}"
            echo "${REGISTRY}/${IMAGE_NAME}:latest"
            if [[ -n "$VERSION_TAG" ]]; then
              echo "${REGISTRY}/${IMAGE_NAME}:${VERSION_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ steps.platform-check.outputs.override || inputs.platforms || matrix.platforms }}
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIMESTAMP=${{ needs.determine-tag.outputs.timestamp }}
            ${{ steps.base.outputs.arg }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Generate SBOM (Syft)
        if: steps.check.outputs.skip != 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ needs.determine-tag.outputs.tag }}
          artifact-name: sbom-${{ matrix.name }}
          output-file: sbom-${{ matrix.name }}.cyclonedx.json
          format: cyclonedx-json

      - name: Scan image (Grype)
        if: steps.check.outputs.skip != 'true'
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ needs.determine-tag.outputs.tag }}
          fail-build: false
          severity-cutoff: critical
          output-format: table
