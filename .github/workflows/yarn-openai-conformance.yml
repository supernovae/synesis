name: Yarn OpenAI conformance

on:
  pull_request:
    branches: [main]
    paths:
      - "base/yarn-ts/**"
      - "packages/synesis-telemetry/**"
      - "packages/synesis-context-trust/**"
      - "packages/synesis-auth-contracts/**"
      - "packages/synesis-oidc-auth/**"
      - "packages/synesis-manifest/**"
      - "packages/synesis-mcp-tools/**"
      - "packages/synesis-agent-orchestration/**"
      - "packages/synesis-upper-harness/**"
      - ".github/workflows/yarn-openai-conformance.yml"
  push:
    branches: [main]
    paths:
      - "base/yarn-ts/**"
      - "packages/synesis-telemetry/**"
      - "packages/synesis-context-trust/**"
      - "packages/synesis-auth-contracts/**"
      - "packages/synesis-oidc-auth/**"
      - "packages/synesis-manifest/**"
      - "packages/synesis-mcp-tools/**"
      - "packages/synesis-agent-orchestration/**"
      - "packages/synesis-upper-harness/**"
      - ".github/workflows/yarn-openai-conformance.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"

permissions:
  contents: read

jobs:
  openai-conformance-static:
    name: OpenAI conformance (static contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Root workspace install + package builds mirror the yarn-ts runtime build graph.
      - name: Install root workspace dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace packages
        run: |
          npm run build -w packages/synesis-telemetry
          npm run build -w packages/synesis-context-trust
          npm run build -w packages/synesis-auth-contracts
          npm run build -w packages/synesis-oidc-auth
          npm run build -w packages/synesis-manifest
          npm run build -w packages/synesis-mcp-tools
          npm run build -w packages/synesis-agent-orchestration
          npm run build -w packages/synesis-upper-harness

      - name: Run OpenAI conformance contract suites
        working-directory: base/yarn-ts
        run: npm run test:openai-conformance

  openai-conformance-live:
    name: OpenAI conformance (live endpoint)
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 25
    defaults:
      run:
        working-directory: base/yarn-ts
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: base/yarn-ts/package-lock.json

      - name: Install and run OpenAI conformance harness
        env:
          SYNESIS_YARN_EVAL_URL: ${{ vars.SYNESIS_YARN_EVAL_URL }}
          SYNESIS_TEST_PAT_TOKEN: ${{ secrets.SYNESIS_TEST_PAT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SYNESIS_YARN_EVAL_URL:-}" ]; then
            echo "Missing repository variable SYNESIS_YARN_EVAL_URL."
            exit 1
          fi
          if [ -z "${SYNESIS_TEST_PAT_TOKEN:-}" ]; then
            echo "Missing secret SYNESIS_TEST_PAT_TOKEN."
            exit 1
          fi
          npm ci
          npm run verify:openai-conformance -- --json openai-conformance-report.json

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: yarn-openai-conformance-report
          path: base/yarn-ts/openai-conformance-report.json
          if-no-files-found: ignore
