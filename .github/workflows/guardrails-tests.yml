name: Guardrails Security Tests

on:
  push:
    branches: [main]
    paths:
      - "base/security/**"
  pull_request:
    branches: [main]
    paths:
      - "base/security/**"

permissions:
  contents: read

jobs:
  guardrails-core-tests:
    name: Guardrails Core Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install guardrails core
        working-directory: base/security
        run: uv pip install --system -e ".[test]" pytest

      - name: Run guardrails core tests
        working-directory: base/security
        run: python -m pytest tests/ -v --tb=short --junitxml=../../guardrails-test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: guardrails-test-results
          path: guardrails-test-results.xml

