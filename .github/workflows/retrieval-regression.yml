name: Retrieval Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "base/planner/app/nodes/router.py"
      - "base/planner/app/nodes/unified_retrieval.py"
      - "base/planner/app/rag_client.py"
      - "benchmarks/retrieval/**"
      - "benchmarks/bm25/queries.yaml"
  workflow_dispatch:
    inputs:
      tolerance:
        description: "Regression tolerance (fraction, e.g. 0.05 for 5%)"
        default: "0.05"
      milvus_host:
        description: "Milvus host (cluster-internal or port-forwarded)"
        default: "milvus.synesis-rag.svc.cluster.local"
      embedder_url:
        description: "TEI embedder URL"
        default: "http://embedder.synesis-rag.svc.cluster.local:8080"

permissions:
  contents: read

jobs:
  retrieval-regression:
    name: Retrieval Quality Regression
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.SYNESIS_VALIDATION_ENABLED == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    environment: validation
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "benchmarks/retrieval/requirements.txt"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv pip install --system -r benchmarks/retrieval/requirements.txt

      - name: Run retrieval benchmark
        env:
          MILVUS_HOST: ${{ inputs.milvus_host }}
          EMBEDDER_URL: ${{ inputs.embedder_url }}
        run: |
          python benchmarks/retrieval/bench_hybrid.py \
            --milvus-host "$MILVUS_HOST" \
            --embedder-url "$EMBEDDER_URL" \
            --tolerance ${{ inputs.tolerance }} \
            --baseline benchmarks/retrieval/baseline.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: retrieval-regression-results
          path: benchmarks/retrieval/baseline.json
