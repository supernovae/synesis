# Go RAG harness against planner POST /v1/knowledge/search (scripts/rag_retrieval_eval.py).
#
# Triggers: manual + release, and relevant PRs when live validation is enabled.
#
# Canonical GitHub configuration (Settings → Secrets and variables → Actions):
#   Secret   SYNESIS_INTERNAL_SERVICE_TOKEN — internal service token (synesis-internal-service-auth), not a PAT.
#   Variable SYNESIS_PLANNER_EVAL_URL — planner base URL (e.g. https://api.kybern.dev), no trailing /v1 required.
#
# Optional: protect the `validation` environment with required reviewers for workflow_dispatch.

name: RAG retrieval eval (Go harness)

on:
  pull_request:
    branches: [main]
    paths:
      - "base/planner-ts/src/retrieval/**"
      - "base/rag/**"
      - "scripts/rag_retrieval_eval.py"
      - "tests/prompts/go_retrieval_eval.yaml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  go-retrieval-eval:
    name: Go retrieval eval suite
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'pull_request' && vars.SYNESIS_VALIDATION_ENABLED == 'true')
    runs-on: self-hosted
    timeout-minutes: 20
    environment: validation
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "benchmarks/corpus/requirements.lock"

      - name: Install script deps
        run: uv pip install --system --require-hashes -r benchmarks/corpus/requirements.lock

      - name: Run harness
        env:
          SYNESIS_INTERNAL_SERVICE_TOKEN: ${{ secrets.SYNESIS_INTERNAL_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          URL="${{ vars.SYNESIS_PLANNER_EVAL_URL }}"
          if [ -z "${URL}" ]; then
            echo "Missing repository variable SYNESIS_PLANNER_EVAL_URL."
            exit 1
          fi
          if [ -z "${SYNESIS_INTERNAL_SERVICE_TOKEN:-}" ]; then
            echo "Missing secret SYNESIS_INTERNAL_SERVICE_TOKEN."
            exit 1
          fi
          python3 scripts/rag_retrieval_eval.py \
            --url "${URL}" \
            --suite tests/prompts/go_retrieval_eval.yaml \
            --disable-domain-filter \
            --top-k 8 \
            --save-json retrieval-eval-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rag-retrieval-eval-results
          if-no-files-found: error
          path: retrieval-eval-results.json
