name: Build local package artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --workspace=@synesis/mcp --include-workspace-root=false
      - run: npm run build
      - run: npm test
      - name: Pack the standalone CLI
        run: npm pack --workspace=@synesis/mcp --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v6
        with:
          name: synesis-local-package
          path: ${{ runner.temp }}/synesis-mcp-*.tgz
          if-no-files-found: error
