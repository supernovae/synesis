apiVersion: karpenter.azure.com/v1beta1
kind: AKSNodeClass
metadata:
  name: spot-burst
  annotations:
    kubernetes.io/description: Opportunistic spot capacity for bursty Synesis workloads
spec:
  imageFamily: Ubuntu
  maxPods: 80
  osDiskSizeGB: 64
  tags:
    environment: prod
    managed-by: gitops
    project: kybern
    workload-cost-profile: spot-burst
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot-burst
spec:
  disruption:
    budgets:
      - nodes: 10%
    consolidateAfter: 10m
    consolidationPolicy: WhenEmptyOrUnderutilized
  limits:
    cpu: "32"
    memory: 128Gi
  template:
    metadata:
      labels:
        intent: burst
        workload-cost-profile: spot-burst
        terraform-managed-pool: spot-burst
    spec:
      expireAfter: Never
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: spot-burst
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
        - key: karpenter.azure.com/sku-family
          operator: In
          values:
            - D
            - E
            - F
        - key: karpenter.azure.com/sku-cpu
          operator: In
          values:
            - "4"
            - "8"
            - "16"
        - key: karpenter.azure.com/sku-memory
          operator: Gte
          values:
            - "16384"
        - key: karpenter.azure.com/sku-storage-premium-capable
          operator: In
          values:
            - "true"
  weight: 20
