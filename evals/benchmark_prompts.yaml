# Synesis Full vs Selective A/B Evaluation Benchmark
# 70 prompts: 25 easy, 25 medium, 20 hard
# Each prompt tagged with: difficulty bucket, corpus_slice (corpus | no_corpus),
# expected capabilities (parametric, retrieval, web, code_snippet, multi_step),
# and must-pass quality criteria.
#
# Usage:
#   python evals/run_ab.py --prompts evals/benchmark_prompts.yaml \
#       --modes full,selective --judge openrouter

metadata:
  version: 1
  created: "2026-03-15"
  total_prompts: 70
  buckets:
    easy: 25
    medium: 25
    hard: 20

prompts:
  # =========================================================================
