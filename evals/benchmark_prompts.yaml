      - User authentication and authorization
      - Product catalog (1M SKUs)
      - Order processing (10k orders/day)
      - Payment processing (PCI-DSS compliant)
      - Real-time inventory tracking
      - Email/SMS notifications

      Design the migration strategy. Cover:
      - Service decomposition (what becomes its own service and why)
      - Strangler fig pattern implementation details
      - Database decomposition strategy (shared DB → service-owned)
      - Data consistency across services (saga pattern vs 2PC)
      - Team reorganization to support service ownership
      - Risk mitigation for the migration itself
      - Timeline with milestones (assume 18 months total)
    capabilities: [parametric, multi_step]
    must_pass:
      - service_boundaries_justified
      - migration_pattern
      - database_strategy
      - consistency_pattern
      - timeline_with_milestones
      - risk_mitigation

