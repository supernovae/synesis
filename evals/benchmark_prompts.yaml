  - id: hard-10
    bucket: hard
    corpus_slice: corpus
    prompt: |
      Propose a redesign of the Synesis entry pipeline to reduce p95 latency
      by 50% without regressing quality on hard prompts. Consider:
      - Speculative execution (start writer while frame extractor runs)
      - Model distillation (replace GLiNER2 + LLM repair with a fine-tuned classifier)
      - Predictive routing (cache classifier → route mappings)
      - Lazy frame extraction (skip for parametric-only queries)

      For each approach, estimate: implementation effort, latency savings,
      quality risk, and infrastructure cost impact. Recommend a specific
      sequenced plan to implement the top 2-3 changes.
    capabilities: [retrieval, multi_step]
    must_pass:
      - four_approaches_analyzed
      - latency_estimates
      - quality_risk_assessed
      - implementation_plan

