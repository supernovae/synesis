  # =========================================================================
  # HARD (20) — multi-constraint architecture, deep planning, ambiguity
  # =========================================================================

  - id: hard-01
    bucket: hard
    corpus_slice: no_corpus
    prompt: |
      You are helping me design a production-ready AI assistant for a small engineering organization.
      Task:
      Propose a practical architecture for an internal coding assistant that can:
      1. answer questions about company docs,
      2. help write and review code,
      3. avoid confidently making up facts,
      4. escalate when it lacks enough evidence,
      5. keep latency and cost reasonable.
      Constraints:
      - Team size: 80 engineers
      - Mix of public and private knowledge
      - Must support Kubernetes, Terraform, and Python workflows
      - Budget is limited, so expensive always-on large models are undesirable
      - Security matters, but the company is not in a highly regulated industry
      - The system should be useful within 90 days, not as a multi-year research project
      What I want from you:
      - State the main design goals
      - Propose a concrete architecture
      - Explain model choices and where small vs large models should be used
      - Explain how retrieval should work
      - Describe failure modes and mitigations
      - Explain how the system should decide when to ask clarifying questions, when to answer, and when to refuse
      - Give a phased rollout plan for 30, 60, and 90 days
      - List the top 5 risks or mistakes likely to cause failure
      Important:
      - Do not give a generic answer
      - Make tradeoffs explicit
      - Separate facts, assumptions, and recommendations
      - If something is uncertain, say so clearly
      - Be concise but specific
    capabilities: [parametric, web, multi_step]
    must_pass:
      - architecture_diagram
      - phased_rollout
      - model_choices_justified
      - tradeoffs_explicit
      - risks_listed
      - assumptions_labeled

  - id: hard-02
    bucket: hard
    corpus_slice: no_corpus
    prompt: |
      Design a real-time fraud detection system for a fintech company processing
      5 million transactions per day. Requirements:
      - Sub-100ms decision latency for 95th percentile
      - Must handle both rule-based and ML-based detection
      - Needs to explain why a transaction was flagged
      - Must support A/B testing of detection models
      - Regulatory requirement: decisions must be auditable for 7 years
      - Team has 5 ML engineers and 3 platform engineers

      Propose the architecture, data pipeline, model serving strategy, and
      operational runbook. Make specific technology choices and justify them.
      Include a capacity planning estimate.
    capabilities: [parametric, web, multi_step]
    must_pass:
      - architecture_diagram
      - latency_addressed
      - technology_choices_specific
      - capacity_estimate
      - auditability_addressed

  - id: hard-03
    bucket: hard
    corpus_slice: corpus
    prompt: |
      Analyze the Synesis planner pipeline end-to-end. Identify the top 5
      latency bottlenecks for a complex multi-section knowledge task with
      difficulty 0.8. For each bottleneck:
      1. Explain what it does and why it's slow
      2. Quantify the expected latency contribution
      3. Propose a concrete optimization with expected improvement
      4. Assess the quality/cost tradeoff of each optimization
      Present this as a prioritized action plan.
    capabilities: [retrieval, multi_step]
    must_pass:
      - five_bottlenecks
      - quantified
      - actionable
      - tradeoffs_explicit

  - id: hard-04
    bucket: hard
    corpus_slice: no_corpus
    prompt: |
      Design a multi-region active-active deployment for a social media
      application serving 10M DAU across North America and Europe.
      Requirements:
      - Eventual consistency is acceptable for feeds (5s max lag)
      - Strong consistency required for user profiles and auth
      - Must handle a full region failure within 30 seconds
      - Budget: $50k/month cloud infrastructure
      - Team: 12 engineers, 2 SREs

      Cover: architecture, database strategy (including conflict resolution),
      CDN and caching layers, deployment pipeline, monitoring and alerting,
      disaster recovery testing plan. Make specific technology choices.
    capabilities: [parametric, web, multi_step]
    must_pass:
      - multi_region_architecture
      - consistency_models_addressed
      - conflict_resolution
      - budget_addressed
      - technology_choices_specific
      - dr_testing_plan

  - id: hard-05
    bucket: hard
    corpus_slice: no_corpus
    prompt: |
      I'm building a data platform for a logistics company with:
      - 500 IoT sensors on trucks sending GPS + temperature every 10 seconds
      - 3 legacy ERP systems (SAP, Oracle, custom) that need integration
      - Regulatory requirement to retain all data for 5 years
      - Analytics team of 8 who currently use Excel and want self-service BI
      - Budget: $30k/month including cloud costs
      - Must be production-ready in 6 months

      Design the complete data architecture from ingestion to visualization.
      Address schema evolution, data quality, access control, and cost
      optimization. Make every technology choice specific and justified.
      Show a phased delivery plan.
    capabilities: [parametric, web, multi_step]
    must_pass:
      - end_to_end_architecture
      - iot_ingestion_addressed
      - erp_integration
      - data_quality
      - cost_within_budget
      - phased_delivery

  - id: hard-06
    bucket: hard
    corpus_slice: no_corpus
    prompt: |
