      A) Naive RAG (retrieve-then-generate)
      B) Advanced RAG (query rewriting, reranking, CRAG-style correction)
      C) Agentic RAG (tool-using agents that decide when and how to retrieve)

      For each approach:
      - Describe the architecture with a diagram
      - Analyze latency, cost, and quality characteristics
      - Identify failure modes
      - Specify when this approach is the right choice

      Then recommend which approach to start with for a team of 5 engineers
      building a customer support assistant over 100k documents.
      Justify your recommendation with specific numbers where possible.
    capabilities: [parametric, web, multi_step]
    must_pass:
      - three_architectures_compared
      - diagrams_present
      - failure_modes
      - recommendation_justified
      - quantitative_analysis

