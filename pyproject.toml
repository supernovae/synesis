[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "S", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Fixed Git argv for local documentation checks.
"scripts/check-doc-reference-integrity.py" = ["S603", "S607"]
# Tests invoke the local CLI/resolver and include Unicode evidence fixtures.
"**/test_*.py" = ["S101", "S603", "S607", "E402", "RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = [".venv", ".test-venv", "venv", "node_modules"]
