# Bootstrap corpus — Cross-cutting toolchain foundations
# Resources that apply across all languages: version control, containers,
# CI/CD, security, API conventions, observability, and dependency management.
#
items:
- uri: https://git-scm.com/doc
  handler: web_page
  title: Git Documentation
  domain: devops
  authority: canonical
  origin_type: curated
  tags:
  - git
  - version-control
  - scm
  priority: 1
  corpus_class: coder_enriched
  languages: []
  artifact_kind: docs
  content_profile: reference
  freshness_sla_days: 365
  scope_tags:
  - version-control
  - common-patterns
  constraint_kind: hard
  config:
    discovery: sitemap_first
    follow_links: true
    max_depth: 4
    max_pages: 80
    respect_robots: true
    min_request_interval: 0.4
    allowed_prefixes:
    - https://git-scm.com/doc
    - https://git-scm.com/book

