        emptyDir: {}
      - name: cache
        emptyDir: {}
    resources:
      requests:
        cpu: 500m
        memory: 1536Mi
      limits:
        cpu: "2"
        memory: 3Gi
    podSecurityContext:
      runAsNonRoot: false
      seccompProfile:
        type: RuntimeDefault
    probes:
      readiness: /health
      liveness: /health
      startup: /health
    lifecycle:
      postStart:
        exec:
          command:
            - /bin/bash
            - -c
            - |
              nohup python3 /opt/synesis/synesis-fix-user-models.py >> /tmp/synesis-fix-user-models.log 2>&1 &
  search:
    enabled: true
    namespace: search
    name: searxng
    component: search
    image:
      repository: docker.io/searxng/searxng
      tag: latest
    ports:
      - name: http
        containerPort: 8080
    env:
      - name: SEARXNG_BASE_URL
        value: http://searxng.synesis-search.svc.cluster.local:8080/
      - name: SEARXNG_PORT
        value: "8080"
      - name: GRANIAN_PORT
        value: "8080"
    podSecurityContext:
      runAsNonRoot: false
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
      - name: cache
        mountPath: /var/cache/searxng
      - name: tmp-etc
        mountPath: /etc/searxng
    volumes:
      - name: cache
        emptyDir:
          sizeLimit: 100Mi
      - name: tmp-etc
        emptyDir:
          sizeLimit: 10Mi
  nornicdb:
    enabled: true
    namespace: rag
    name: synesis-nornicdb
    component: graph-store
    amd64Only: true
    strategy: Recreate
    annotations:
      synesis.io/upstream-release: "https://github.com/orneryd/NornicDB/releases/tag/v1.1.5"
      synesis.io/upstream-docker-docs: "https://github.com/orneryd/NornicDB/blob/v1.1.5/docs/operations/docker.md"
    image:
      # Upstream v1.1.5 Docker docs list the timothyswt Docker Hub images as
      # the public production images. If upstream publishes a GHCR/org image,
      # override this repository at deploy time and keep the release annotation
      # above pointed at the GitHub tag under orneryd/NornicDB.
      # For ARM64 (Azure Cobalt), override with the upstream ARM64 image:
      #   repository: docker.io/timothyswt/nornicdb-arm64-metal-bge
      # or the official Neo4j community image:
      #   repository: neo4j
      #   tag: "5-community"
      repository: docker.io/timothyswt/nornicdb-amd64-cpu
      tag: v1.1.5
    ports:
      - name: bolt
        containerPort: 7687
      - name: http
        containerPort: 7474
    env:
      - name: NORNICDB_RUNTIME_PROFILE
        value: cpu-bge
    volumeMounts:
      - name: data
        mountPath: /data
    volumes:
      - name: data
        persistentVolumeClaim:
          claimName: synesis-nornicdb-data
    podSecurityContext:
      # Upstream NornicDB v1.1.5 images currently run as root. Keep the
      # container otherwise restricted with no privilege escalation, dropped
      # Linux capabilities, and RuntimeDefault seccomp.
      runAsNonRoot: false
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: false
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
      limits:
        cpu: "4"
        memory: 16Gi
  embedder:
    # Disabled by default: the BGE-M3 TEI CPU container is memory-heavy and can
    # OOM during warmup on default clusters. Re-enable only with a right-sized
    # node pool or replace this workload with the selected SynPack/RAG embedder.
    enabled: false
    namespace: rag
    name: embedder
    component: embedder
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    image:
      repository: ghcr.io/huggingface/text-embeddings-inference
      tag: cpu-1.9
    ports:
      - name: http
        containerPort: 8080
    args:
      - --model-id
      - BAAI/bge-m3
      - --port
      - "8080"
    env:
      - name: HOME
        value: /tmp
      - name: XDG_CACHE_HOME
        value: /tmp/.cache
      - name: HF_HOME
        value: /tmp/hf_home
    podSecurityContext:
      runAsNonRoot: false
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        cpu: "1"
        memory: 12Gi
