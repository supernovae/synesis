    amd64Only: true
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    image:
      repository: ghcr.io/supernovae/synesis/gliner-service
      tag: latest
    ports:
      - name: http
        containerPort: 8080
    env:
      - name: HOME
        value: /tmp
      - name: XDG_CACHE_HOME
        value: /tmp/.cache
      - name: HF_HOME
        value: /tmp/hf_home
      - name: TRANSFORMERS_CACHE
        value: /tmp/hf_home
      - name: TORCH_HOME
        value: /tmp/torch
      - name: TORCHINDUCTOR_CACHE_DIR
        value: /tmp/torchinductor
      - name: TOKENIZERS_PARALLELISM
        value: "false"
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 6Gi
  astMcp:
    enabled: true
    namespace: yarn
    name: synesis-ast-mcp
    component: ast-mcp
    image:
      repository: ghcr.io/supernovae/synesis/synesis-ast-mcp
      tag: latest
    ports:
      - name: http
        containerPort: 8080
    env:
      - name: PORT
        value: "8080"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      runAsUser: 1001
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
