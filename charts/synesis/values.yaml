        cpu: "1"
        memory: 1Gi
  openfga:
    enabled: true
    namespace: authz
    name: openfga
    component: authz
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    annotations:
      karpenter.sh/do-not-disrupt: "true"
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: openfga
            topologyKey: kubernetes.io/hostname
    image:
      repository: openfga/openfga
      tag: v1.8.5
    containerSecurityContext:
      runAsUser: 10001
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    replicas: 2
    args:
      - run
    ports:
      - name: http
        containerPort: 8080
      - name: grpc
        containerPort: 8081
      - name: metrics
        containerPort: 2112
    env:
      - name: OPENFGA_DATASTORE_ENGINE
        value: postgres
      - name: OPENFGA_DATASTORE_URI
        valueFrom:
          secretKeyRef:
            name: openfga-config
            key: OPENFGA_DATASTORE_URI
      - name: OPENFGA_AUTHN_METHOD
        value: preshared
      - name: OPENFGA_AUTHN_PRESHARED_KEYS
        valueFrom:
          secretKeyRef:
            name: openfga-config
            key: OPENFGA_AUTHN_PRESHARED_KEYS
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

jobs:
  indexer:
    enabled: true
    image:
      repository: ghcr.io/supernovae/synesis/indexer
      tag: latest
      pullPolicy: Always
    serviceAccountName: default
    githubTokenSecretName: synesis-github-token
    hfTokenSecretName: synesis-hf-token
    adminUrl: http://synesis-admin.synesis-admin.svc.cluster.local:8080
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      runAsUser: 1001
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    queue:
      enabled: true
      suspend: true
      schedule: "0 3 * * 0"
      backoffLimit: 2
      ttlSecondsAfterFinished: 7200
      resources:
        requests:
          cpu: "1"
          memory: 3Gi
        limits:
          cpu: "4"
          memory: 8Gi
      extraEnv: []
    contentPacks:
      enabled: true
      suspend: false
      schedule: "*/15 * * * *"
      backoffLimit: 2
      activeDeadlineSeconds: 86400
      ttlSecondsAfterFinished: 7200
      resources:
        requests:
          cpu: "1"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 8Gi
      extraEnv:
        - name: SYNESIS_CONTENT_PACK_IMPORT_BACKEND
          value: auto
        - name: SYNESIS_NORNIC_URI
          value: bolt://synesis-nornicdb.synesis-rag.svc.cluster.local:7687
        - name: SYNESIS_NORNIC_BULK_NODE_BATCH_SIZE
          value: "250"
        - name: SYNESIS_NORNIC_BULK_META_NODE_BATCH_SIZE
          value: "1000"
        - name: SYNESIS_NORNIC_BULK_EDGE_BATCH_SIZE
          value: "500"
        - name: SYNESIS_NORNIC_EDGE_BATCH_SIZE
          value: "500"
        - name: SYNESIS_NORNIC_BULK_RETRY_ATTEMPTS
          value: "8"
        - name: SYNESIS_NORNIC_BULK_RETRY_BASE_DELAY
          value: "2"
        - name: SYNESIS_NORNIC_BULK_SUSPEND_VECTOR_INDEX
          value: "true"
        - name: SYNESIS_NORNIC_FAST_NODE_CREATE
          value: "true"
        - name: SYNESIS_CONTENT_PACK_MAX_JOBS
          value: "1"
    staged:
      enabled: false
      s3Bucket: ""
      s3Prefix: ""
      fetch:
        suspend: true
        schedule: "15 3 * * 0"
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 6Gi
      normalize:
        suspend: true
        schedule: "30 3 * * 0"
        batchLimit: 16
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 6Gi
      enrich:
        suspend: true
        schedule: "45 3 * * 0"
        batchLimit: 8
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "8"
            memory: 16Gi
  qualityRunner:
    enabled: false
    schedule: "0 4 * * *"
    image:
      repository: ghcr.io/supernovae/synesis/quality-runner
      tag: latest
      pullPolicy: Always
    command:
      - python
      - entrypoint.py
    activeDeadlineSeconds: 3600
    backoffLimit: 1
    runCurator: false
    env:
      - name: SYNESIS_NORNIC_URI
        value: bolt://synesis-nornicdb.synesis-rag.svc.cluster.local:7687
      - name: SYNESIS_EMBEDDER_URL
        value: ""
      - name: SYNESIS_ADMIN_API_URL
        value: http://synesis-admin.synesis-admin.svc.cluster.local:8080
      - name: SYNESIS_LLM_URL
        value: http://synesis-planner-ts.synesis-planner.svc.cluster.local:8080/v1
      - name: SYNESIS_LLM_MODEL
        value: synesis-writer
      - name: SYNESIS_TAXONOMY_PATH
        value: /app/taxonomy_prompt_config.yaml
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

extraManifests: []
