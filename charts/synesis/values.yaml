# Synesis Helm values.
#
# Backend modes:
#   postgres.mode: cloudnativepg | external | azureFlexible
#   kv.mode:       redkey | external | azureRedis
#
# "redkey" intentionally means a Redis-compatible open source KV backend, with
# Valkey/RedKey-style operator CRs by default. The app still consumes redis://
# URLs because the Node/Python Redis clients use that URI scheme for compatible
# servers.

nameOverride: ""
fullnameOverride: ""
createNamespaces: true

global:
  # The chart default is API mode: external/provider LLMs are called directly
  # from Planner using routes configured in the Admin model registry.
  mode: api
  imageRegistry: ghcr.io/supernovae/synesis
  imageTag: latest
  imagePullPolicy: Always
  imagePullSecrets: []
  # Set true only for disposable local/demo renders that intentionally keep
  # placeholder credentials. Production renders fail fast on known placeholders.
  allowInsecureDefaults: false
  clusterDomain: cluster.local
  # Provider controls cloud-specific defaults. Use "auto" for best-effort
  # detection, or set explicitly to openshift, aks, eks, gke, or kubernetes.
  provider: openshift
  # Deprecated compatibility switch. Prefer global.provider=openshift.
  openshift: true
  routeDomain: apps.example.com
  # Set to "arm64" to schedule workloads on ARM nodes (e.g. Azure Cobalt),
  # "amd64" to pin to x86, or "" (default) for no arch constraint.
  # Per-workload nodeSelector overrides this. ML services (bge-reranker,
  # gliner-service, spam-service) always pin to amd64 since their images
  # are amd64-only.
  architecture: ""

registryCredentials:
  # When enabled, Helm creates a docker-registry pull secret in Synesis
  # namespaces and mounts it through imagePullSecrets on chart-managed pods.
  enabled: false
  name: ghcr-pull-secret
  registry: ghcr.io
  username: ""
  password: ""
  email: ""

security:
  # Comma-separated ingress/router CIDRs whose X-Forwarded-For values may be
  # trusted by admin rate limiting and session audit metadata.
  trustedProxyCidrs: ""

platform:
  storage:
    # If a PVC/database storageClass is unset, use provider defaults below.
    useProviderDefaults: true
    defaultClass: ""
    postgresClass: ""
    webuiClass: ""
    nornicdbClass: ""
  openshift:
    storageClass: ""
  aks:
    storageClass: managed-csi
  eks:
    storageClass: gp3
  gke:
    storageClass: standard-rwo
  kubernetes:
    storageClass: ""

namespaces:
  admin: synesis-admin
  auth: synesis-auth
  authz: synesis-authz
  gateway: synesis-gateway
  planner: synesis-planner
  rag: synesis-rag
  sandbox: synesis-sandbox
  search: synesis-search
  webui: synesis-webui
  yarn: synesis-yarn
  models: synesis-models

operators:
  # true renders OLM Subscription resources. Set false on AKS/EKS/GKE unless
  # OLM is installed and intentionally managed through this chart.
  installWithOLM: true
  customResources:
    # auto renders operator-backed custom resources only after Helm discovery
    # can see their CRDs. This lets a first install create OLM subscriptions
    # without failing on Keycloak/CloudNativePG/Valkey kinds that OLM has not
    # installed yet; rerun helm upgrade after the CRDs appear.
    # Use "always" when rendering offline or when CRDs are managed externally.
    # Use "never" for an operators-only bootstrap pass.
    create: auto
    failOnMissingCRDs: false
  cloudnativepg:
    enabled: true
    createNamespace: true
    namespace: cnpg-system
    operatorGroup: true
    subscription:
      name: cloudnative-pg
      package: cloudnative-pg
      channel: stable-v1
      source: community-operators
      sourceNamespace: openshift-marketplace
      installPlanApproval: Automatic
  keycloak:
    enabled: true
    namespace: synesis-auth
    operatorGroup: true
    subscription:
      name: rhbk-operator
      package: rhbk-operator
      channel: stable-v26
      source: redhat-operators
      sourceNamespace: openshift-marketplace
      # Red Hat recommends Manual for production upgrades. Automatic gives a
      # smoother first bootstrap; switch to Manual in controlled environments.
      installPlanApproval: Automatic
  redkey:
    enabled: false
    createNamespace: true
    namespace: valkey-operator-system
    operatorGroup: true
    subscription:
      name: valkey-operator
      package: valkey-operator
      channel: stable
      source: community-operators
      sourceNamespace: openshift-marketplace
      installPlanApproval: Automatic

postgres:
  mode: cloudnativepg
  cloudnativepg:
    admin:
      name: synesis-admin-db
      database: synesis_admin
      owner: app
      password: changeme
      instances: 1
      storage:
        size: 5Gi
        storageClass: ""
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
    keycloak:
      name: synesis-auth-db
      database: keycloak
      owner: app
      password: changeme
      instances: 1
      storage:
        size: 2Gi
        storageClass: ""
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    openfga:
      name: synesis-openfga-db
      database: openfga
      owner: openfga
      password: changeme
      instances: 1
      storage:
        size: 2Gi
        storageClass: ""
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
  external:
    admin:
      host: ""
      port: 5432
      database: synesis_admin
      username: app
      password: changeme
      sslmode: require
      adminUrl: ""
      traceUrl: ""
    keycloak:
      host: ""
      port: 5432
      database: keycloak
      username: app
      password: changeme
    openfga:
      host: ""
      port: 5432
      database: openfga
      username: openfga
      password: changeme
      sslmode: require
      datastoreUri: ""
  azureFlexible:
    host: synesis-postgres.postgres.database.azure.com
    port: 5432
    sslmode: require
    admin:
      database: synesis_admin
      username: app
      password: changeme
      adminUrl: ""
      traceUrl: ""
    keycloak:
      database: keycloak
      username: app
      password: changeme
    openfga:
      database: openfga
      username: openfga
      password: changeme
      datastoreUri: ""

kv:
  mode: redkey
  external:
    url: redis://managed-valkey.example.com:6379/3
  azureRedis:
    # Azure Cache for Redis commonly uses TLS on 6380 and a password/access key.
    # Set url to override the generated rediss:// URL.
    url: ""
    host: synesis-cache.redis.cache.windows.net
    port: 6380
    username: ""
    password: changeme
    database: 0
    tls: true
  redkey:
    # Set this to the service DNS name created by your Valkey/RedKey operator.
    url: redis://synesis-valkey.synesis-rag.svc.cluster.local:6379/3
    createCustomResource: true
    apiVersion: cache.cs.sap.com/v1alpha1
    kind: Valkey
    name: synesis-valkey
    spec:
      replicas: 1
      sentinel:
        enabled: false
      metrics:
        enabled: true
      tls:
        enabled: false

secrets:
  internalServiceToken: synesis-internal-change-me
  webuiSecretKey: sk-synesis-change-me
  adminSessionTokenKey: ""
  patPepper: ""
  # Leave empty to have Helm generate a NornicDB password on first install and
  # reuse the existing synesis-nornicdb-auth Secret on later upgrades.
  nornicdbPassword: ""
  # Optional bootstrap provider keys. Prefer managing provider API keys from
  # Admin -> Providers & API keys after install; any keys set here are
  # Helm-managed and can be reconciled on upgrade.
  providerApiKeys: {}
  openfgaAuthToken: changeme-generate-a-real-key
  openwebuiAdminToken: ""
  githubToken: ""
  huggingFaceToken: ""

nornicdb:
  auth:
    secretName: synesis-nornicdb-auth
    username: neo4j

openfga:
  client:
    # Leave empty until the OpenFGA bootstrap step creates a real store. The
    # services treat an empty store ID as "OpenFGA not configured"; a placeholder
    # non-ULID value makes the OpenFGA SDK fail during startup.
    storeId: ""
    modelId: ""
  bootstrap:
    enabled: true
    storeName: synesis
    image:
      repository: python
      tag: 3.12-alpine
      pullPolicy: Always
    timeoutSeconds: 300
    writeModel: true
    writeBaselineTuples: true
    consumerNamespaces:
      - admin
      - planner
      - yarn
      - rag
    restartDeployments:
      - namespace: admin
        name: synesis-admin
      - namespace: planner
        name: synesis-planner-ts
      - namespace: yarn
        name: synesis-yarn
      - namespace: yarn
        name: synesis-mcp

keycloak:
  enabled: true
  name: synesis-keycloak
  realm: synesis
  instances: 1
  publicUrl: https://auth.apps.example.com
  adminUrl: https://auth-admin.apps.example.com
  internalIssuerUrl: http://synesis-keycloak-service.synesis-auth.svc.cluster.local:8080/realms/synesis
  additionalOptions:
    - name: features
      value: organization
  # Passed through to spec.ingress on the Keycloak CR when non-empty. Useful
  # when a cloud Ingress is managed by this chart instead of the operator.
  operatorIngress: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  realmImport:
    enabled: true
    # Optional first-login user for the application realm. This is disabled by
    # default because the password is embedded in the KeycloakRealmImport spec.
    # Enable only for controlled bootstrap flows, then rotate or replace it.
    bootstrapAdmin:
      enabled: false
      username: synesis-admin
      email: admin@example.com
      firstName: Synesis
      lastName: Admin
      password: ""
      temporaryPassword: true
    webuiRedirectUris:
      - https://chat.apps.example.com/*
    webuiWebOrigins:
      - https://chat.apps.example.com
    adminRedirectUris:
      - https://admin.apps.example.com/*
    adminWebOrigins:
      - https://admin.apps.example.com
    harnessRedirectUris:
      []
    harnessWebOrigins:
      []
    harnessStandardFlowEnabled: false
    harnessDeviceAuthorizationEnabled: true
  deferredBootstrap:
    # When operators.customResources.create=auto and Helm cannot see the
    # Keycloak CRDs during the first render, this hook waits for OLM and applies
    # the Keycloak CR and realm import before the Helm install completes.
    enabled: true
    image:
      repository: bitnami/kubectl
      tag: 1.31.3
      pullPolicy: Always
    timeoutSeconds: 1200
    keycloakReadyTimeoutSeconds: 900
    postgresReadyTimeoutSeconds: 900
    realmImportTimeoutSeconds: 600

routes:
  enabled: true
  items:
    synesis-api:
      namespace: planner
      service: synesis-planner-ts
      port: http
      host: ""
      timeout: 300s
    synesis-admin:
      namespace: admin
      service: synesis-admin
      port: http
      host: admin.apps.example.com
      timeout: 300s
    synesis-webui:
      namespace: webui
      service: open-webui
      port: http
      host: chat.apps.example.com
      timeout: 300s
    synesis-yarn:
      namespace: yarn
      service: synesis-yarn
      port: http
      host: coder.apps.example.com
      timeout: 300s
    synesis-auth:
      namespace: auth
      service: synesis-keycloak-service
      port: http
      host: auth.apps.example.com
      timeout: 300s
    synesis-auth-admin:
      namespace: auth
      service: synesis-keycloak-service
      port: http
      host: auth-admin.apps.example.com
      timeout: 300s

ingress:
  # Enable this for AKS/EKS/GKE/generic Kubernetes. OpenShift defaults to Route
  # resources through routes.enabled. cloudflared can also reuse these items
  # when cloudflared.enabled=true; in that case ingress.enabled can stay false.
  enabled: false
  className: ""
  # Recommended for production: add NGINX rate-limit annotations here or per-item.
  # nginx.ingress.kubernetes.io/limit-rps: "30"
  # nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
  # nginx.ingress.kubernetes.io/limit-connections: "20"
  annotations: {}
  tls:
    enabled: true
    secretName: ""
  items:
    synesis-api:
      namespace: planner
      service: synesis-planner-ts
      port: http
      originPort: 8080
      host: api.example.com
      path: /
      pathType: Prefix
    synesis-admin:
      namespace: admin
      service: synesis-admin
      port: http
      originPort: 8080
      host: admin.example.com
      path: /
      pathType: Prefix
    synesis-webui:
      namespace: webui
      service: open-webui
      port: http
      originPort: 8080
      host: chat.example.com
      path: /
      pathType: Prefix
    synesis-yarn:
      namespace: yarn
      service: synesis-yarn
      port: http
      originPort: 8000
      host: coder.example.com
      path: /
      pathType: Prefix
    synesis-auth:
      namespace: auth
      service: synesis-keycloak-service
      port: http
      originPort: 8080
      host: auth.example.com
      path: /
      pathType: Prefix
    synesis-auth-admin:
      namespace: auth
      service: synesis-keycloak-service
      port: http
      originPort: 8080
      host: auth-admin.example.com
      path: /
      pathType: Prefix
    synesis-mcp:
      namespace: yarn
      service: synesis-mcp
      port: http
      originPort: 8100
      host: mcp.example.com
      path: /
      pathType: Prefix

cloudflared:
  # Optional Cloudflare Tunnel connector. When enabled, this renders a
  # cloudflared Deployment and a local tunnel config that routes public hostnames
  # to the internal services listed in ingress.items.
  enabled: false
  namespace: gateway
  name: cloudflared
  replicas: 2
  image:
    repository: cloudflare/cloudflared
    tag: latest
    pullPolicy: Always
  tunnel:
    # "credentials" runs a locally-managed tunnel with credentials.json and
    # chart-rendered ingress rules. "token" runs a remotely-managed tunnel using
    # the Docker/Kubernetes token from Cloudflare and remote tunnel config.
    mode: credentials
    # Required in credentials mode. Use the UUID of a locally managed
    # Cloudflare Tunnel.
    id: ""
    # Set existingSecret=true when this secret is managed out of band.
    # Credentials mode expects credentialsSecretKey. Token mode expects
    # tokenSecretKey.
    existingSecret: false
    credentialsSecretName: cloudflared-credentials
    credentialsSecretKey: credentials.json
    tokenSecretKey: token
    # Remotely-managed Cloudflare Tunnel token. Prefer an external values file
    # or a pre-created Secret over --set so shell history does not retain it.
    token: ""
    # Structured Cloudflare tunnel credentials. This is safer than passing raw
    # JSON via --set because Helm can type-coerce JSON-like CLI values.
    credentials: {}
    # Raw Cloudflare tunnel credentials JSON string. Prefer a values file.
    credentialsJson: ""
  ingress:
    useChartIngressItems: true
    defaultService: http_status:404
    # Additional raw cloudflared ingress rules appended after chart-derived
    # rules and before defaultService.
    items: []
  originRequest: {}
  logLevel: info
  metrics: 0.0.0.0:2000
  metricsPort: 2000
  extraArgs: []
  extraEnv: []
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

networkPolicies:
  enabled: true
  # Baseline policies allow Synesis namespace traffic, DNS, and configured public
  # TCP egress while blocking direct egress to private/link-local networks by
  # default. Keep this list aligned with managed external dependencies such as
  # Azure Database for PostgreSQL and Azure Cache for Redis.
  ingress:
    allowAll: false
    extraNamespaceNames:
      - openshift-ingress
      - openshift-monitoring
      - openshift-user-workload-monitoring
  egress:
    allowAll: false
    allowSynesisNamespaces: true
    allowDns: true
    allowPublicHttps: true
    extraPublicTcpPorts:
      # Cloudflare Tunnel edge connectivity (HTTP/2 fallback) plus managed
      # external dependencies such as Azure Database and Redis.
      - 7844
      - 5432
      - 10000
    extraPublicUdpPorts:
      # Cloudflare Tunnel QUIC edge connectivity.
      - 7844

persistence:
  webui:
    enabled: true
    size: 10Gi
    storageClass: ""
  nornicdb:
    enabled: true
    size: 10Gi
    storageClass: ""

workloads:
  admin:
    enabled: true
    namespace: admin
    name: synesis-admin
    component: admin
    image:
      repository: ghcr.io/supernovae/synesis/admin
      tag: latest
    replicas: 1
    ports:
      - name: http
        containerPort: 8080
    env:
      - name: SYNESIS_LOG_LEVEL
        value: info
      - name: SYNESIS_ADMIN_DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: synesis-admin-db-url
            key: admin-url
      - name: SYNESIS_ADMIN_SESSION_TOKEN_KEY
        valueFrom:
          secretKeyRef:
            name: synesis-admin-session-token-key
            key: key
      - name: SYNESIS_ADMIN_REQUIRE_SESSION_TOKEN_ENCRYPTION
        value: "true"
      - name: SYNESIS_REQUIRE_PAT_PEPPER
        value: "true"
      - name: SYNESIS_PAT_PEPPER
        valueFrom:
          secretKeyRef:
            name: synesis-pat-pepper
            key: pepper
      - name: SYNESIS_TRUSTED_PROXY_CIDRS
        value: "{{ .Values.security.trustedProxyCidrs }}"
      - name: SYNESIS_KEYCLOAK_ISSUER_URL
        value: "{{ .Values.keycloak.publicUrl }}/realms/{{ .Values.keycloak.realm }}"
      - name: SYNESIS_KEYCLOAK_INTERNAL_ISSUER_URL
        value: "{{ .Values.keycloak.internalIssuerUrl }}"
      - name: SYNESIS_KEYCLOAK_AUDIENCE
        value: ""
      - name: SYNESIS_KEYCLOAK_EXPECTED_AZP
        value: synesis-admin
      - name: SYNESIS_PLANNER_URL
        value: http://synesis-planner-ts.synesis-planner.svc.cluster.local:8080
      - name: SYNESIS_ADMIN_ASSISTANT_MODEL
        value: synesis-writer
      - name: SYNESIS_MCP_URL
        value: http://synesis-mcp.synesis-yarn.svc.cluster.local:8100
      - name: SYNESIS_ADMIN_MCP_URL
        value: http://synesis-admin-mcp-ts.synesis-admin.svc.cluster.local:8102
      - name: SYNESIS_QUALITY_REPORT_PATH
        value: /data/quality/corpus_audit_report.json
      - name: SYNESIS_CURATOR_PROPOSALS_PATH
        value: /data/quality/proposed_sources.yaml
      - name: SYNESIS_TAXONOMY_YAML_PATH
        value: /etc/synesis/taxonomy_prompt_config.yaml
      - name: SYNESIS_CONTENT_PACK_CATALOG_URL
        value: https://r2.kybern.dev/synesis-pack-catalog.json
      - name: SYNESIS_INTERNAL_SERVICE_TOKEN
        valueFrom:
          secretKeyRef:
            name: synesis-internal-service-auth
            key: token
      - name: SYNESIS_OPENFGA_API_URL
        value: http://openfga.synesis-authz.svc.cluster.local:8080
      - name: SYNESIS_OPENFGA_STORE_ID
        valueFrom:
          secretKeyRef:
            name: openfga-client-config
            key: store-id
      - name: SYNESIS_OPENFGA_MODEL_ID
        valueFrom:
          secretKeyRef:
            name: openfga-client-config
            key: model-id
      - name: SYNESIS_OPENFGA_AUTH_TOKEN
        valueFrom:
          secretKeyRef:
            name: openfga-client-config
            key: auth-token
      # Rate limiting (per-IP, in-memory)
      - name: SYNESIS_ADMIN_RATE_LIMIT_MAX
        value: "120"
      - name: SYNESIS_ADMIN_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - name: SYNESIS_ADMIN_AUTH_RATE_LIMIT_MAX
        value: "20"
      - name: SYNESIS_ADMIN_AUTH_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - name: SYNESIS_ADMIN_RAG_RATE_LIMIT_MAX
        value: "30"
      - name: SYNESIS_ADMIN_RAG_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
    volumeMounts:
      - name: taxonomy-config
        mountPath: /etc/synesis/taxonomy_prompt_config.yaml
        subPath: taxonomy_prompt_config.yaml
        readOnly: true
    volumes:
      - name: taxonomy-config
        configMap:
          name: synesis-taxonomy-config
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    probes:
      readiness: /api/v1/health
      liveness: /api/v1/health
      startup: /api/v1/health
  plannerTs:
    enabled: true
    namespace: planner
    name: synesis-planner-ts
    component: planner
    image:
      repository: ghcr.io/supernovae/synesis/planner-ts
      tag: latest
    # Planner session state is externalized to Redis. Multi-replica is safe when
    # SYNESIS_PLANNER_TS_REDIS_URL is set (required for replicas > 1).
    replicas: 2
    terminationGracePeriodSeconds: 60
    lifecycle:
      preStop:
        exec:
          command: ["sh", "-c", "sleep 5"]
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    ports:
      - name: http
        containerPort: 8080
    env:
      - name: NODE_ENV
        value: production
      - name: PORT
        value: "8080"
      - name: HOST
        value: 0.0.0.0
      - name: SYNESIS_PLANNER_TS_LLM_ENABLED
        value: "true"
      - name: SYNESIS_PLANNER_TS_MODEL_ID
        value: Synesis Auto
      - name: SYNESIS_PLANNER_TS_MODEL_IDS
        value: Synesis Auto,Synesis Pulse,Synesis Core,Synesis Horizon
      - name: SYNESIS_PLANNER_TS_WRITER_MODEL
        value: synesis-writer
      - name: SYNESIS_PLANNER_TS_PLANNER_MODEL
        value: synesis-planner
      - name: SYNESIS_PLANNER_TS_CRITIC_MODEL
        value: synesis-critic
      # LLM resilience. These bound slow/failing provider calls before Kubernetes
      # health checks or external load balancers have to absorb the failure.
      - name: SYNESIS_PLANNER_TS_LLM_TIMEOUT_MS
        value: "300000"
      - name: SYNESIS_PLANNER_TS_LLM_RETRY_MAX_ATTEMPTS
        value: "3"
      - name: SYNESIS_PLANNER_TS_LLM_RETRY_BASE_DELAY_MS
        value: "1000"
      - name: SYNESIS_PLANNER_TS_LLM_CIRCUIT_BREAKER_FAILURE_THRESHOLD
        value: "5"
      - name: SYNESIS_PLANNER_TS_LLM_CIRCUIT_BREAKER_RECOVERY_TIMEOUT_MS
        value: "60000"
      - name: SYNESIS_PLANNER_TS_LLM_CIRCUIT_BREAKER_HALF_OPEN_MAX
        value: "1"
      - name: SYNESIS_PLANNER_TS_NODE_TIMEOUT_MS
        value: "60000"
      - name: SYNESIS_PLANNER_TS_WRITER_NODE_TIMEOUT_MS
        value: "180000"
      - name: SYNESIS_PLANNER_TS_REQUIRE_BEARER_AUTH
        value: "true"
      - name: SYNESIS_PLANNER_TS_TRUST_FORWARDED_IDENTITY_HEADERS
        value: "true"
      - name: SYNESIS_PLANNER_TS_STRICT_FORWARDED_IDENTITY_MODE
        value: "true"
      - name: SYNESIS_PLANNER_TS_ALLOW_OPAQUE_BEARER
        value: "false"
      - name: SYNESIS_PLANNER_TS_PREFIX_CACHE_MODE
        value: auto
      - name: SYNESIS_PLANNER_TS_INTERNAL_SERVICE_TOKEN
        valueFrom:
          secretKeyRef:
            name: synesis-internal-service-auth
            key: token
      - name: SYNESIS_PLANNER_TS_REDIS_URL
        valueFrom:
          secretKeyRef:
            name: synesis-redis
            key: url
      - name: SYNESIS_PLANNER_TS_REDIS_KEY_PREFIX
        value: "synesis:planner:session:"
      - name: SYNESIS_PLANNER_TS_REDIS_SESSION_TTL_S
        value: "14400"
      - name: SYNESIS_PLANNER_TS_SESSION_MAX_SESSIONS
        value: "5000"
      - name: SYNESIS_PLANNER_TS_REDIS_CAS_MAX_RETRIES
        value: "5"
      # Rate limiting (per-user + global, in-memory per pod)
      - name: SYNESIS_PLANNER_TS_GLOBAL_RATE_LIMIT_MAX
