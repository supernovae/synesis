  yarn:
    enabled: true
    namespace: yarn
    name: synesis-yarn
    component: yarn
    image:
      repository: ghcr.io/supernovae/synesis/yarn-ts
      tag: latest
    # Yarn now persists full SessionState (history, governor counters) to Redis
    # on every request via saveSessionState and rehydrates on pod migration.
    # Structural index, file snapshots, and dedup caches start cold after migration
    # but rebuild incrementally from tool traffic. Session affinity (below) is
    # recommended for best UX but no longer strictly required.
    replicas: 1
    terminationGracePeriodSeconds: 60
    lifecycle:
      preStop:
        exec:
          command: ["sh", "-c", "sleep 5"]
    sessionAffinity:
      type: ClientIP
      timeoutSeconds: 10800
    ports:
