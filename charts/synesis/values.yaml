jobs:
  indexer:
    enabled: false
    image:
      repository: ghcr.io/supernovae/synesis/indexer
      tag: latest
      pullPolicy: IfNotPresent
    serviceAccountName: default
    githubTokenSecretName: synesis-github-token
    hfTokenSecretName: synesis-hf-token
    adminUrl: http://synesis-admin.synesis-admin.svc.cluster.local:8080
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      runAsUser: 1001
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    queue:
      enabled: true
      suspend: true
      schedule: "0 3 * * 0"
      backoffLimit: 2
      ttlSecondsAfterFinished: 7200
      resources:
        requests:
          cpu: "1"
          memory: 3Gi
        limits:
          cpu: "4"
          memory: 8Gi
      extraEnv: []
    staged:
      enabled: false
      s3Bucket: ""
      s3Prefix: ""
      fetch:
        suspend: true
        schedule: "15 3 * * 0"
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 6Gi
      normalize:
        suspend: true
        schedule: "30 3 * * 0"
        batchLimit: 16
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 6Gi
      enrich:
        suspend: true
        schedule: "45 3 * * 0"
        batchLimit: 8
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "8"
            memory: 16Gi
  qualityRunner:
    enabled: false
    schedule: "0 4 * * *"
    image:
      repository: ghcr.io/supernovae/synesis/quality-runner
      tag: latest
      pullPolicy: IfNotPresent
    command:
      - python
      - entrypoint.py
    activeDeadlineSeconds: 3600
    backoffLimit: 1
    runCurator: false
    env:
      - name: SYNESIS_NORNIC_URI
        value: bolt://synesis-nornicdb.synesis-rag.svc.cluster.local:7687
      - name: SYNESIS_EMBEDDER_URL
        value: http://embedder.synesis-rag.svc.cluster.local:8080
      - name: SYNESIS_ADMIN_API_URL
        value: http://synesis-admin.synesis-admin.svc.cluster.local:8080
      - name: SYNESIS_LLM_URL
        value: http://synesis-planner-ts.synesis-planner.svc.cluster.local:8080/v1
      - name: SYNESIS_LLM_MODEL
        value: synesis-writer
      - name: SYNESIS_TAXONOMY_PATH
        value: /app/taxonomy_prompt_config.yaml
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

extraManifests: []
