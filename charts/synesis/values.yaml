        value: /tmp/.cache
      - name: HF_HOME
        value: /tmp/hf_home
      - name: TRANSFORMERS_CACHE
        value: /tmp/hf_home
      - name: TORCH_HOME
        value: /tmp/torch
      - name: TORCHINDUCTOR_CACHE_DIR
        value: /tmp/torchinductor
