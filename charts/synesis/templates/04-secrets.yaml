{{- $adminHost := include "synesis.postgres.adminHost" . -}}
{{- include "synesis.validateProductionSecrets" . -}}
{{- $adminDb := include "synesis.postgres.database" (dict "root" . "key" "admin") -}}
{{- $adminUser := include "synesis.postgres.username" (dict "root" . "key" "admin") -}}
{{- $adminPass := include "synesis.postgres.adminPassword" . -}}
{{- $adminPort := include "synesis.postgres.port" (dict "root" . "key" "admin") -}}
{{- $adminSslmode := include "synesis.postgres.sslmode" (dict "root" . "key" "admin") -}}
{{- $adminAsyncSuffix := ternary "" (printf "?ssl=%s" $adminSslmode) (eq .Values.postgres.mode "cloudnativepg") -}}
{{- $adminSyncSuffix := ternary "" (printf "?sslmode=%s" $adminSslmode) (eq .Values.postgres.mode "cloudnativepg") -}}
{{- $adminUrlDefault := printf "postgresql+asyncpg://%s:%s@%s:%v/%s%s" $adminUser ($adminPass | urlquery) $adminHost $adminPort $adminDb $adminAsyncSuffix -}}
{{- $traceUrlDefault := printf "postgresql://%s:%s@%s:%v/%s%s" $adminUser ($adminPass | urlquery) $adminHost $adminPort $adminDb $adminSyncSuffix -}}
{{- $adminOverrides := ternary .Values.postgres.azureFlexible.admin .Values.postgres.external.admin (eq .Values.postgres.mode "azureFlexible") -}}
{{- $adminUrl := default $adminUrlDefault $adminOverrides.adminUrl -}}
{{- $traceUrl := default $traceUrlDefault $adminOverrides.traceUrl -}}
{{- range $ns := list .Values.namespaces.admin .Values.namespaces.planner .Values.namespaces.yarn }}
---
apiVersion: v1
kind: Secret
metadata:
  name: synesis-admin-db-url
  namespace: {{ $ns }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
type: Opaque
stringData:
  admin-url: {{ $adminUrl | quote }}
  trace-url: {{ $traceUrl | quote }}
{{- end }}
{{- $nornicAuthSecretName := include "synesis.nornicAuthSecretName" . -}}
{{- $nornicAuthUser := include "synesis.nornicAuthUsername" . -}}
{{- $existingNornicAuth := lookup "v1" "Secret" .Values.namespaces.rag $nornicAuthSecretName -}}
{{- $existingNornicPassword := "" -}}
{{- if and $existingNornicAuth $existingNornicAuth.data (hasKey $existingNornicAuth.data "password") -}}
{{- $existingNornicPassword = index $existingNornicAuth.data "password" | b64dec -}}
{{- end -}}
{{- $configuredNornicPassword := index (.Values.secrets | default dict) "nornicdbPassword" | default "" -}}
{{- $nornicAuthPassword := default (default (randAlphaNum 32) $existingNornicPassword) $configuredNornicPassword -}}
{{- range $ns := uniq (list .Values.namespaces.admin .Values.namespaces.planner .Values.namespaces.rag) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $nornicAuthSecretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
type: Opaque
stringData:
  username: {{ $nornicAuthUser | quote }}
  password: {{ $nornicAuthPassword | quote }}
  auth: {{ printf "%s/%s" $nornicAuthUser $nornicAuthPassword | quote }}
{{- end }}
{{- range $ns := list .Values.namespaces.admin .Values.namespaces.gateway .Values.namespaces.planner .Values.namespaces.rag .Values.namespaces.sandbox .Values.namespaces.webui .Values.namespaces.yarn }}
---
apiVersion: v1
kind: Secret
metadata:
  name: synesis-internal-service-auth
  namespace: {{ $ns }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
type: Opaque
stringData:
  token: {{ $.Values.secrets.internalServiceToken | quote }}
{{ end }}
{{ $existingVisionAuth := lookup "v1" "Secret" .Values.namespaces.yarn "synesis-vision-worker-auth" -}}
{{- $existingVisionToken := "" -}}
{{- if and $existingVisionAuth $existingVisionAuth.data (hasKey $existingVisionAuth.data "token") -}}
{{- $existingVisionToken = index $existingVisionAuth.data "token" | b64dec -}}
{{- end -}}
{{- $visionToken := default (default (randAlphaNum 48) $existingVisionToken) .Values.secrets.visionWorkerToken -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: synesis-vision-worker-auth
  namespace: {{ .Values.namespaces.yarn }}
  labels:
    {{- include "synesis.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $visionToken | quote }}
{{ $adminSessionSecretName := "synesis-admin-session-token-key" -}}
{{- $existingAdminSessionSecret := lookup "v1" "Secret" .Values.namespaces.admin $adminSessionSecretName -}}
{{- $existingAdminSessionKey := "" -}}
{{- if and $existingAdminSessionSecret $existingAdminSessionSecret.data (hasKey $existingAdminSessionSecret.data "key") -}}
{{- $existingAdminSessionKey = index $existingAdminSessionSecret.data "key" | b64dec -}}
{{- end -}}
{{- $configuredAdminSessionKey := index (.Values.secrets | default dict) "adminSessionTokenKey" | default "" -}}
{{- $adminSessionKey := default (default (randAlphaNum 48) $existingAdminSessionKey) $configuredAdminSessionKey -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $adminSessionSecretName }}
  namespace: {{ .Values.namespaces.admin }}
  labels:
    {{- include "synesis.labels" . | nindent 4 }}
type: Opaque
stringData:
  key: {{ $adminSessionKey | quote }}
{{- $patPepperSecretName := "synesis-pat-pepper" -}}
{{- $existingPatPepperSecret := lookup "v1" "Secret" .Values.namespaces.admin $patPepperSecretName -}}
{{- $existingPatPepper := "" -}}
{{- if and $existingPatPepperSecret $existingPatPepperSecret.data (hasKey $existingPatPepperSecret.data "pepper") -}}
{{- $existingPatPepper = index $existingPatPepperSecret.data "pepper" | b64dec -}}
{{- end -}}
{{- $configuredPatPepper := index (.Values.secrets | default dict) "patPepper" | default "" -}}
{{- $patPepper := default (default (randAlphaNum 48) $existingPatPepper) $configuredPatPepper -}}
{{- range $ns := list .Values.namespaces.admin .Values.namespaces.planner .Values.namespaces.yarn }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $patPepperSecretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
type: Opaque
stringData:
  pepper: {{ $patPepper | quote }}
{{- end }}
{{- if .Values.registryCredentials.enabled }}
{{- $dockerAuth := printf "%s:%s" .Values.registryCredentials.username .Values.registryCredentials.password | b64enc -}}
{{- $dockerConfig := dict "auths" (dict .Values.registryCredentials.registry (dict "username" .Values.registryCredentials.username "password" .Values.registryCredentials.password "email" .Values.registryCredentials.email "auth" $dockerAuth)) -}}
{{- range $ns := values .Values.namespaces | uniq }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.registryCredentials.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $dockerConfig | toJson | b64enc | quote }}
{{- end }}
{{- end }}
{{- if .Values.secrets.githubToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: synesis-github-token
  namespace: {{ .Values.namespaces.rag }}
  labels:
    {{- include "synesis.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.secrets.githubToken | quote }}
{{- end }}
{{- if .Values.secrets.huggingFaceToken }}
{{- range $ns := list .Values.namespaces.rag .Values.namespaces.models }}
---
apiVersion: v1
kind: Secret
metadata:
  name: synesis-hf-token
  namespace: {{ $ns }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
type: Opaque
stringData:
  HF_TOKEN: {{ $.Values.secrets.huggingFaceToken | quote }}
{{- end }}
{{- end }}
{{- range $ns := list .Values.namespaces.gateway .Values.namespaces.planner .Values.namespaces.yarn }}
---
apiVersion: v1
kind: Secret
metadata:
  name: provider-api-keys
  namespace: {{ $ns }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
type: Opaque
{{- with $.Values.secrets.providerApiKeys }}
stringData:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: webui-api-key
  namespace: {{ .Values.namespaces.webui }}
  labels:
    {{- include "synesis.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.secrets.webuiSecretKey | quote }}
{{- $openwebuiTokenSecretName := "synesis-openwebui-admin-token" -}}
{{- $existingOpenWebUIToken := "" -}}
{{- range $ns := list .Values.namespaces.webui .Values.namespaces.admin .Values.namespaces.planner }}
{{- if not $existingOpenWebUIToken }}
{{- $existingSecret := lookup "v1" "Secret" $ns $openwebuiTokenSecretName -}}
{{- if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "token") -}}
{{- $existingOpenWebUIToken = index $existingSecret.data "token" | b64dec -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $configuredOpenWebUIToken := index (.Values.secrets | default dict) "openwebuiAdminToken" | default "" -}}
{{- if and $configuredOpenWebUIToken (not (hasPrefix "sk-" $configuredOpenWebUIToken)) -}}
{{- fail "secrets.openwebuiAdminToken must start with sk- because Open WebUI routes only sk-* bearer values through its API-key resolver" -}}
{{- end -}}
{{- $reusableOpenWebUIToken := "" -}}
{{- if and $existingOpenWebUIToken (hasPrefix "sk-" $existingOpenWebUIToken) -}}
{{- $reusableOpenWebUIToken = $existingOpenWebUIToken -}}
{{- end -}}
{{- $openwebuiServiceToken := default (default (printf "sk-synesis-%s" (randAlphaNum 48)) $reusableOpenWebUIToken) $configuredOpenWebUIToken -}}
{{- range $ns := uniq (list .Values.namespaces.webui .Values.namespaces.admin .Values.namespaces.planner) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $openwebuiTokenSecretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
type: Opaque
stringData:
  token: {{ $openwebuiServiceToken | quote }}
{{- end }}
{{- range $ns := uniq (list .Values.namespaces.rag .Values.namespaces.planner .Values.namespaces.yarn) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: synesis-redis
  namespace: {{ $ns }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
type: Opaque
stringData:
  url: {{ include "synesis.kvUrl" $ | quote }}
{{- end }}
{{ $openfgaHost := include "synesis.postgres.openfgaHost" . }}
{{ $openfgaDb := include "synesis.postgres.database" (dict "root" . "key" "openfga") }}
{{ $openfgaUser := include "synesis.postgres.username" (dict "root" . "key" "openfga") }}
{{ $openfgaPass := include "synesis.postgres.openfgaPassword" . }}
{{ $openfgaPort := include "synesis.postgres.port" (dict "root" . "key" "openfga") }}
{{ $openfgaSslmode := include "synesis.postgres.sslmode" (dict "root" . "key" "openfga") }}
{{ $openfgaUriDefault := printf "postgres://%s:%s@%s:%v/%s?sslmode=%s" $openfgaUser ($openfgaPass | urlquery) $openfgaHost $openfgaPort $openfgaDb $openfgaSslmode }}
{{ $openfgaOverrides := ternary .Values.postgres.azureFlexible.openfga .Values.postgres.external.openfga (eq .Values.postgres.mode "azureFlexible") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: openfga-config
  namespace: {{ .Values.namespaces.authz }}
  labels:
    {{- include "synesis.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENFGA_DATASTORE_URI: {{ default $openfgaUriDefault $openfgaOverrides.datastoreUri | quote }}
  OPENFGA_AUTHN_PRESHARED_KEYS: {{ .Values.secrets.openfgaAuthToken | quote }}
{{- $openfgaClientSecretName := "openfga-client-config" -}}
{{- $existingOpenFGAStoreID := "" -}}
{{- $existingOpenFGAModelID := "" -}}
{{- range $ns := list .Values.namespaces.admin .Values.namespaces.planner .Values.namespaces.yarn .Values.namespaces.rag }}
{{- if not $existingOpenFGAStoreID }}
{{- $existingSecret := lookup "v1" "Secret" $ns $openfgaClientSecretName -}}
{{- if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "store-id") -}}
{{- $existingOpenFGAStoreID = index $existingSecret.data "store-id" | b64dec -}}
{{- end -}}
{{- if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "model-id") -}}
{{- $existingOpenFGAModelID = index $existingSecret.data "model-id" | b64dec -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $openfgaStoreID := .Values.openfga.client.storeId | default $existingOpenFGAStoreID | default "" -}}
{{- $openfgaModelID := .Values.openfga.client.modelId | default $existingOpenFGAModelID | default "" -}}
{{- range $ns := list .Values.namespaces.admin .Values.namespaces.planner .Values.namespaces.yarn .Values.namespaces.rag }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $openfgaClientSecretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
type: Opaque
stringData:
  store-id: {{ $openfgaStoreID | quote }}
  model-id: {{ $openfgaModelID | quote }}
  auth-token: {{ $.Values.secrets.openfgaAuthToken | quote }}
{{- end }}
