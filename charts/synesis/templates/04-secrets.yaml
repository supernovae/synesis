{{- $adminHost := include "synesis.postgres.adminHost" . -}}
{{- $adminDb := ternary .Values.postgres.cloudnativepg.admin.database .Values.postgres.external.admin.database (eq .Values.postgres.mode "cloudnativepg") -}}
{{- $adminUser := ternary .Values.postgres.cloudnativepg.admin.owner .Values.postgres.external.admin.username (eq .Values.postgres.mode "cloudnativepg") -}}
{{- $adminPass := include "synesis.postgres.adminPassword" . -}}
{{- $adminPort := ternary 5432 (.Values.postgres.external.admin.port | int) (eq .Values.postgres.mode "cloudnativepg") -}}
{{- $adminAsyncSuffix := ternary "" (printf "?ssl=%s" .Values.postgres.external.admin.sslmode) (eq .Values.postgres.mode "cloudnativepg") -}}
{{- $adminSyncSuffix := ternary "" (printf "?sslmode=%s" .Values.postgres.external.admin.sslmode) (eq .Values.postgres.mode "cloudnativepg") -}}
{{- $adminUrlDefault := printf "postgresql+asyncpg://%s:%s@%s:%v/%s%s" $adminUser ($adminPass | urlquery) $adminHost $adminPort $adminDb $adminAsyncSuffix -}}
{{- $traceUrlDefault := printf "postgresql://%s:%s@%s:%v/%s%s" $adminUser ($adminPass | urlquery) $adminHost $adminPort $adminDb $adminSyncSuffix -}}
{{- $litellmUrlDefault := printf "postgresql://%s:%s@%s:%v/litellm%s" $adminUser ($adminPass | urlquery) $adminHost $adminPort $adminSyncSuffix -}}
{{- $adminUrl := default $adminUrlDefault .Values.postgres.external.admin.adminUrl -}}
{{- $traceUrl := default $traceUrlDefault .Values.postgres.external.admin.traceUrl -}}
{{- $litellmUrl := default $litellmUrlDefault .Values.postgres.external.admin.litellmUrl -}}
{{- range $ns := list .Values.namespaces.admin .Values.namespaces.planner .Values.namespaces.yarn }}
---
apiVersion: v1
kind: Secret
metadata:
  name: synesis-admin-db-url
  namespace: {{ $ns }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
type: Opaque
stringData:
  admin-url: {{ $adminUrl | quote }}
  trace-url: {{ $traceUrl | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-database-url
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    {{- include "synesis.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ $litellmUrl | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-db-credentials
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    {{- include "synesis.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ $adminUser | quote }}
  password: {{ $adminPass | quote }}
{{- range $ns := list .Values.namespaces.admin .Values.namespaces.gateway .Values.namespaces.planner }}
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
type: Opaque
stringData:
  master-key: {{ $.Values.secrets.litellmMasterKey | quote }}
  salt-key: {{ $.Values.secrets.litellmSaltKey | quote }}
{{- end }}
{{- range $ns := list .Values.namespaces.admin .Values.namespaces.gateway .Values.namespaces.planner .Values.namespaces.rag .Values.namespaces.sandbox .Values.namespaces.webui .Values.namespaces.yarn }}
---
apiVersion: v1
kind: Secret
metadata:
  name: synesis-internal-service-auth
  namespace: {{ $ns }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
type: Opaque
stringData:
  token: {{ $.Values.secrets.internalServiceToken | quote }}
{{- end }}
{{- range $ns := list .Values.namespaces.gateway .Values.namespaces.planner .Values.namespaces.yarn }}
---
apiVersion: v1
kind: Secret
metadata:
  name: provider-api-keys
  namespace: {{ $ns }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $.Values.secrets.providerApiKeys }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: webui-api-key
  namespace: {{ .Values.namespaces.webui }}
  labels:
    {{- include "synesis.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.secrets.webuiSecretKey | quote }}
{{- if .Values.secrets.openwebuiAdminToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: synesis-openwebui-admin-token
  namespace: {{ .Values.namespaces.admin }}
  labels:
    {{- include "synesis.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.secrets.openwebuiAdminToken | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: synesis-redis
  namespace: {{ .Values.namespaces.rag }}
  labels:
    {{- include "synesis.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ include "synesis.kvUrl" . | quote }}
{{ $openfgaHost := include "synesis.postgres.openfgaHost" . }}
{{ $openfgaDb := ternary .Values.postgres.cloudnativepg.openfga.database .Values.postgres.external.openfga.database (eq .Values.postgres.mode "cloudnativepg") }}
{{ $openfgaUser := ternary .Values.postgres.cloudnativepg.openfga.owner .Values.postgres.external.openfga.username (eq .Values.postgres.mode "cloudnativepg") }}
{{ $openfgaPass := include "synesis.postgres.openfgaPassword" . }}
{{ $openfgaPort := ternary 5432 (.Values.postgres.external.openfga.port | int) (eq .Values.postgres.mode "cloudnativepg") }}
{{ $openfgaUriDefault := printf "postgres://%s:%s@%s:%v/%s?sslmode=%s" $openfgaUser ($openfgaPass | urlquery) $openfgaHost $openfgaPort $openfgaDb (ternary "disable" .Values.postgres.external.openfga.sslmode (eq .Values.postgres.mode "cloudnativepg")) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: openfga-config
  namespace: {{ .Values.namespaces.authz }}
  labels:
    {{- include "synesis.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENFGA_DATASTORE_URI: {{ default $openfgaUriDefault .Values.postgres.external.openfga.datastoreUri | quote }}
  OPENFGA_AUTHN_PRESHARED_KEYS: {{ .Values.secrets.openfgaAuthToken | quote }}
{{- range $ns := list .Values.namespaces.admin .Values.namespaces.planner .Values.namespaces.yarn .Values.namespaces.rag }}
---
apiVersion: v1
kind: Secret
metadata:
  name: openfga-client-config
  namespace: {{ $ns }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
type: Opaque
stringData:
  store-id: bootstrap-store
  model-id: ""
  auth-token: {{ $.Values.secrets.openfgaAuthToken | quote }}
{{- end }}
