{{- if .Values.workloads.openfga.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openfga-migrate
  namespace: {{ .Values.namespaces.authz }}
  labels:
    {{- include "synesis.labels" . | nindent 4 }}
    app.kubernetes.io/name: openfga
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ .Values.workloads.openfga.image.repository }}:{{ .Values.workloads.openfga.image.tag }}
          args:
            - migrate
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: openfga-config
                  key: OPENFGA_DATASTORE_URI
          securityContext:
            {{- if .Values.workloads.openfga.containerSecurityContext }}
            {{- toYaml .Values.workloads.openfga.containerSecurityContext | nindent 12 }}
            {{- else }}
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            {{- end }}
{{- end }}
