{{- $cnpgReady := eq (include "synesis.operatorCustomResourceReady" (dict "root" . "apiVersion" "postgresql.cnpg.io/v1/Cluster")) "true" -}}
{{- if and (eq .Values.postgres.mode "cloudnativepg") (not $cnpgReady) .Values.operators.customResources.failOnMissingCRDs -}}
{{- fail "postgres.mode=cloudnativepg requires the CloudNativePG CRD clusters.postgresql.cnpg.io. Install the CloudNativePG operator first, or keep operators.customResources.create=auto and rerun helm upgrade after OLM installs the CRD." -}}
{{- end -}}
{{- if and (eq .Values.postgres.mode "cloudnativepg") $cnpgReady }}
{{- $clusters := dict "admin" .Values.postgres.cloudnativepg.admin "litellm" .Values.postgres.cloudnativepg.litellm "keycloak" .Values.postgres.cloudnativepg.keycloak "openfga" .Values.postgres.cloudnativepg.openfga -}}
{{- range $key, $db := $clusters }}
{{- $nsKey := ternary "auth" (ternary "authz" (ternary "gateway" "admin" (eq $key "litellm")) (eq $key "openfga")) (eq $key "keycloak") -}}
{{- $ns := include "synesis.namespace" (dict "root" $ "key" $nsKey) -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $db.name }}-app
  namespace: {{ $ns }}
  annotations:
    meta.helm.sh/release-name: {{ $.Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $db.owner | quote }}
  password: {{ $db.password | quote }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $db.name }}
  namespace: {{ $ns }}
  annotations:
    meta.helm.sh/release-name: {{ $.Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  instances: {{ $db.instances }}
  bootstrap:
    initdb:
      database: {{ $db.database }}
      owner: {{ $db.owner }}
      secret:
        name: {{ $db.name }}-app
  storage:
    size: {{ $db.storage.size }}
    {{- $storageClass := include "synesis.storageClass" (dict "root" $ "key" "postgres" "storageClass" $db.storage.storageClass) }}
    {{- if $storageClass }}
    storageClass: {{ $storageClass }}
    {{- end }}
  resources:
    {{- toYaml $db.resources | nindent 4 }}
  postgresql:
    parameters:
      max_connections: "100"
      log_statement: "ddl"
  monitoring:
    enablePodMonitor: false
{{ end }}
{{- end }}
