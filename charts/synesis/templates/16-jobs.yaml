{{- $root := . -}}
{{- $ragNs := include "synesis.namespace" (dict "root" . "key" .Values.namespaces.rag) -}}
{{- if and .Values.jobs.indexer.enabled .Values.jobs.indexer.queue.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: synesis-indexer-queue
  namespace: {{ .Values.namespaces.rag }}
  labels:
    {{- include "synesis.labels" . | nindent 4 }}
    app.kubernetes.io/name: synesis-indexer
    app.kubernetes.io/component: rag-indexer
    synesis.io/indexer-group: queue
spec:
  schedule: {{ .Values.jobs.indexer.queue.schedule | quote }}
  suspend: {{ .Values.jobs.indexer.queue.suspend }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.jobs.indexer.queue.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.jobs.indexer.queue.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: synesis-indexer
            app.kubernetes.io/part-of: synesis
            synesis.io/indexer-group: queue
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ .Values.jobs.indexer.serviceAccountName }}
          {{- include "synesis.imagePullSecrets" . | nindent 10 }}
          {{- with .Values.jobs.indexer.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: indexer
              image: {{ .Values.jobs.indexer.image.repository }}:{{ .Values.jobs.indexer.image.tag }}
              imagePullPolicy: {{ .Values.jobs.indexer.image.pullPolicy }}
              args:
                - --mode
                - queue
              env:
                - name: SYNESIS_ADMIN_URL
                  value: {{ .Values.jobs.indexer.adminUrl | quote }}
                - name: SYNESIS_ADMIN_SERVICE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: synesis-internal-service-auth
                      key: token
                      optional: true
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.jobs.indexer.githubTokenSecretName }}
                      key: token
                      optional: true
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.jobs.indexer.hfTokenSecretName }}
                      key: HF_TOKEN
                      optional: true
                {{- with .Values.jobs.indexer.queue.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- with .Values.jobs.indexer.queue.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.jobs.indexer.containerSecurityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
{{- end }}
{{- if and .Values.jobs.indexer.enabled .Values.jobs.indexer.contentPacks.enabled }}
