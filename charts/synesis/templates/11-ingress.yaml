{{- if and (ne (include "synesis.isOpenShift" .) "true") .Values.ingress.enabled }}
{{- range $name, $ingress := .Values.ingress.items }}
{{- $ns := include "synesis.namespace" (dict "root" $ "key" $ingress.namespace) -}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
  {{- if or $.Values.ingress.annotations $ingress.annotations }}
  annotations:
    {{- with $.Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if $.Values.ingress.className }}
  ingressClassName: {{ $.Values.ingress.className }}
  {{- end }}
  {{- if and $.Values.ingress.tls.enabled $ingress.host }}
  tls:
    - hosts:
        - {{ $ingress.host }}
      {{- if $.Values.ingress.tls.secretName }}
      secretName: {{ $.Values.ingress.tls.secretName }}
      {{- end }}
  {{- end }}
  rules:
    - {{- if $ingress.host }}
      host: {{ $ingress.host }}
      {{- end }}
      http:
        paths:
          - path: {{ $ingress.path | default "/" }}
            pathType: {{ $ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $ingress.service }}
                port:
                  name: {{ $ingress.port | default "http" }}
{{ end }}
{{ end }}
