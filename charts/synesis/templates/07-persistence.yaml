{{- if .Values.persistence.webui.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: {{ .Values.namespaces.webui }}
  labels:
    {{- include "synesis.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.webui.size }}
  {{- $webuiStorageClass := include "synesis.storageClass" (dict "root" . "key" "webui" "storageClass" .Values.persistence.webui.storageClass) }}
  {{- if $webuiStorageClass }}
  storageClassName: {{ $webuiStorageClass }}
  {{- end }}
{{- end }}
{{- if .Values.persistence.nornicdb.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synesis-nornicdb-data
  namespace: {{ .Values.namespaces.rag }}
  labels:
    {{- include "synesis.labels" . | nindent 4 }}
    app.kubernetes.io/component: graph-store
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.nornicdb.size }}
  {{- $nornicdbStorageClass := include "synesis.storageClass" (dict "root" . "key" "nornicdb" "storageClass" .Values.persistence.nornicdb.storageClass) }}
  {{- if $nornicdbStorageClass }}
  storageClassName: {{ $nornicdbStorageClass }}
  {{- end }}
{{- end }}
