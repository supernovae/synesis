{{- if .Values.workloads.admin.enabled }}
{{- $adminNs := include "synesis.namespace" (dict "root" . "key" .Values.workloads.admin.namespace) -}}
{{- $targets := list
  (dict "namespace" .Values.namespaces.gateway "deployment" "")
  (dict "namespace" .Values.namespaces.planner "deployment" .Values.workloads.plannerTs.name)
  (dict "namespace" .Values.namespaces.yarn "deployment" .Values.workloads.yarn.name)
-}}
{{- range $target := $targets }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: synesis-admin-provider-keys
  namespace: {{ $target.namespace }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
    app.kubernetes.io/component: admin
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["provider-api-keys"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  {{- if $target.deployment }}
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ $target.deployment | quote }}]
    verbs: ["get", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: synesis-admin-provider-keys
  namespace: {{ $target.namespace }}
  labels:
    {{- include "synesis.labels" $ | nindent 4 }}
    app.kubernetes.io/component: admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: synesis-admin-provider-keys
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ $adminNs }}
{{- end }}
{{- end }}
