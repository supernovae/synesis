# AKS example using Azure Database for PostgreSQL Flexible Server and
# Azure Cache for Redis. Operators are assumed to be installed outside Helm.

global:
  provider: aks
  openshift: false

operators:
  installWithOLM: false
  cloudnativepg:
    enabled: false
  keycloak:
    enabled: false
  redkey:
    enabled: false

routes:
  enabled: false

ingress:
  enabled: true
  className: webapprouting.kubernetes.azure.com
  annotations: {}
  tls:
    enabled: true
    secretName: synesis-tls
  items:
    synesis-api:
      namespace: planner
      service: synesis-planner-ts
      port: http
      originPort: 8080
      host: api.synesis.example.com
      path: /
      pathType: Prefix
    synesis-admin:
      namespace: admin
      service: synesis-admin
      port: http
      originPort: 8080
      host: admin.synesis.example.com
      path: /
      pathType: Prefix
    synesis-webui:
      namespace: webui
      service: open-webui
      port: http
      originPort: 8080
      host: chat.synesis.example.com
      path: /
      pathType: Prefix
    synesis-yarn:
      namespace: yarn
      service: synesis-yarn
      port: http
      originPort: 8000
      host: coder.synesis.example.com
      path: /
      pathType: Prefix
    synesis-auth:
      namespace: auth
      service: synesis-keycloak-service
      port: http
      originPort: 8080
      host: auth.synesis.example.com
      path: /
      pathType: Prefix
    synesis-auth-admin:
      namespace: auth
      service: synesis-keycloak-service
      port: http
      originPort: 8080
      host: auth-admin.synesis.example.com
      path: /
      pathType: Prefix

# Optional Cloudflare Tunnel ingress. To put Synesis behind cloudflared instead
# of Azure Web App Routing, set ingress.enabled=false and
# cloudflared.enabled=true. For Cloudflare's Docker/Kubernetes token, set
# tunnel.mode=token and create the referenced secret with key "token".
# For locally-managed config, keep tunnel.mode=credentials and provide
# credentials.json plus tunnel.id.
cloudflared:
  enabled: false
  namespace: gateway
  tunnel:
    mode: token
    id: replace-with-cloudflare-tunnel-uuid
    existingSecret: true
    credentialsSecretName: cloudflared-credentials
    credentialsSecretKey: credentials.json
    tokenSecretKey: token

postgres:
  mode: azureFlexible
  azureFlexible:
    host: synesis-postgres.postgres.database.azure.com
    port: 5432
    sslmode: require
    admin:
      database: synesis_admin
      username: app
      password: replace-me
    keycloak:
      database: keycloak
      username: app
      password: replace-me
    openfga:
      database: openfga
      username: openfga
      password: replace-me

kv:
  mode: azureRedis
  azureRedis:
    host: synesis-cache.redis.cache.windows.net
    port: 6380
    password: replace-me
    database: 3
    tls: true

keycloak:
  publicUrl: https://auth.synesis.example.com
  adminUrl: https://auth-admin.synesis.example.com
  additionalOptions:
    - name: features
      value: organization
    - name: db-url-properties
      value: "?sslmode=require"
  operatorIngress:
    enabled: false
  realmImport:
    webuiRedirectUris:
      - https://chat.synesis.example.com/*
    webuiWebOrigins:
      - https://chat.synesis.example.com
    adminRedirectUris:
      - https://admin.synesis.example.com/*
    adminWebOrigins:
      - https://admin.synesis.example.com

workloads:
  webui:
    podSecurityContext:
      fsGroup: 1001
      runAsNonRoot: true
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
    env:
      - name: OPENAI_API_BASE_URL
        value: http://synesis-planner-ts.synesis-planner.svc.cluster.local:8080/v1
      - name: OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: synesis-internal-service-auth
            key: token
      - name: WEBUI_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: webui-api-key
            key: api-key
      - name: WEBUI_AUTH
        value: "true"
      - name: ENABLE_LOGIN_FORM
        value: "false"
      - name: ENABLE_OAUTH_SIGNUP
        value: "true"
      - name: OPENID_PROVIDER_URL
        value: https://auth.synesis.example.com/realms/synesis/.well-known/openid-configuration
      - name: OAUTH_CLIENT_ID
        value: synesis-webui
      - name: OAUTH_CODE_CHALLENGE_METHOD
        value: S256
      - name: OPENID_REDIRECT_URI
        value: https://chat.synesis.example.com/oauth/oidc/callback
      - name: WEBUI_URL
        value: https://chat.synesis.example.com
      - name: ENABLE_API_KEYS
        value: "true"
      - name: ENABLE_OLLAMA_API
        value: "false"
      - name: WEBUI_NAME
        value: Synesis
    volumeMounts:
      - name: data
        mountPath: /app/backend/data
      - name: tmp-home
        mountPath: /tmp/home
      - name: cache
        mountPath: /app/backend/.cache
    volumes:
      - name: data
        persistentVolumeClaim:
          claimName: open-webui-data
      - name: tmp-home
        emptyDir: {}
      - name: cache
        emptyDir: {}
  search:
    podSecurityContext:
      fsGroup: 977
      runAsNonRoot: true
      runAsUser: 977
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsUser: 977
      seccompProfile:
        type: RuntimeDefault
    env:
      - name: SEARXNG_BASE_URL
        value: http://searxng.synesis-search.svc.cluster.local:8080/
      - name: SEARXNG_PORT
        value: "8080"
      - name: GRANIAN_PORT
        value: "8080"
      - name: SEARXNG_SETTINGS_PATH
        value: /etc/searxng/settings.yml
    volumeMounts:
      - name: cache
        mountPath: /var/cache/searxng
      - name: tmp-etc
        mountPath: /etc/searxng
    volumes:
      - name: cache
        emptyDir:
          sizeLimit: 100Mi
      - name: tmp-etc
        emptyDir:
          sizeLimit: 10Mi
  nornicdb:
    podSecurityContext:
      fsGroup: 1001
      runAsNonRoot: true
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
  embedder:
    podSecurityContext:
      fsGroup: 1001
      runAsNonRoot: true
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
    env:
      - name: HOME
        value: /tmp
      - name: XDG_CACHE_HOME
        value: /tmp/.cache
      - name: HF_HOME
        value: /data/hf
      - name: HUGGINGFACE_HUB_CACHE
        value: /data
    volumeMounts:
      - name: model-cache
        mountPath: /data
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: model-cache
        emptyDir:
          sizeLimit: 8Gi
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi
  spamService:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
  glinerService:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
