# EKS example using externally managed Postgres and Redis-compatible KV.

global:
  provider: eks
  openshift: false

operators:
  installWithOLM: false
  cloudnativepg:
    enabled: false
  keycloak:
    enabled: false
  redkey:
    enabled: false

routes:
  enabled: false

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  tls:
    enabled: true
  items:
    synesis-api:
      namespace: planner
      service: synesis-planner-ts
      port: http
      originPort: 8080
      host: api.synesis.example.com
    synesis-admin:
      namespace: admin
      service: synesis-admin
      port: http
      originPort: 8080
      host: admin.synesis.example.com
    synesis-webui:
      namespace: webui
      service: open-webui
      port: http
      originPort: 8080
      host: chat.synesis.example.com
    synesis-yarn:
      namespace: yarn
      service: synesis-yarn
      port: http
      originPort: 8000
      host: coder.synesis.example.com
    synesis-auth:
      namespace: auth
      service: synesis-keycloak-service
      port: http
      originPort: 8080
      host: auth.synesis.example.com
    synesis-auth-admin:
      namespace: auth
      service: synesis-keycloak-service
      port: http
      originPort: 8080
      host: auth-admin.synesis.example.com

# Optional Cloudflare Tunnel ingress. To put Synesis behind cloudflared instead
# of an AWS load balancer, set ingress.enabled=false and
# cloudflared.enabled=true. For Cloudflare's Docker/Kubernetes token, set
# tunnel.mode=token and create the referenced secret with key "token".
# For locally-managed config, keep tunnel.mode=credentials and provide
# credentials.json plus tunnel.id.
cloudflared:
  enabled: false
  namespace: gateway
  tunnel:
    mode: token
    id: replace-with-cloudflare-tunnel-uuid
    existingSecret: true
    credentialsSecretName: cloudflared-credentials
    credentialsSecretKey: credentials.json
    tokenSecretKey: token

postgres:
  mode: external
  external:
    admin:
      host: synesis-postgres.example.us-east-1.rds.amazonaws.com
      database: synesis_admin
      username: app
      password: replace-me
      sslmode: require
    keycloak:
      host: synesis-postgres.example.us-east-1.rds.amazonaws.com
      database: keycloak
      username: app
      password: replace-me
    openfga:
      host: synesis-postgres.example.us-east-1.rds.amazonaws.com
      database: openfga
      username: openfga
      password: replace-me
      sslmode: require

kv:
  mode: external
  external:
    url: rediss://:replace-me@synesis-cache.example.cache.amazonaws.com:6379/3
